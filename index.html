<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Railhead</title>
<style>
  :root { --ink: #2b2118; --paper: #efe7d4; --paper-2: #e2d6ba; --edge: #6e4426; --accent: #9e3a26; --green: #3f6b2c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9d3d8; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: Georgia, "Times New Roman", serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud { position: fixed; z-index: 2; }
  [hidden] { display: none !important; }
  button { font: 600 15px/1 Georgia, serif; color: var(--ink); background: var(--paper); border: 2px solid var(--edge);
    border-radius: 8px; min-width: 48px; min-height: 48px; padding: 0 12px; cursor: pointer; touch-action: manipulation; }
  button:active { background: var(--paper-2); }
  button[aria-pressed="true"] { background: var(--edge); color: var(--paper); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #topleft { left: calc(env(safe-area-inset-left) + 10px); top: calc(env(safe-area-inset-top) + 10px); display: grid; gap: 6px; }
  #clock { background: var(--paper); border: 2px solid var(--edge); border-radius: 8px; padding: 6px 10px; font-size: 15px;
    color: var(--ink); font-variant-numeric: tabular-nums; justify-self: start; }
  #speeds { display: flex; gap: 4px; }
  /* Cash (economy): beside the speed buttons under the clock on a narrow phone, beside the clock when wide. */
  #topleft { grid-template-areas: "clock clock" "speeds cash"; grid-template-columns: auto auto; justify-content: start; align-items: center; }
  #clock { grid-area: clock; } #speeds { grid-area: speeds; }
  #cash { grid-area: cash; justify-self: start; background: var(--paper); border: 2px solid var(--edge); border-radius: 8px; padding: 6px 8px;
    font-size: 15px; color: var(--green); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; }
  #cash[data-neg] { color: var(--accent); }
  @media (min-width: 600px) { #topleft { grid-template-areas: "clock cash" "speeds speeds"; } }
  #speeds button { padding: 0 8px; }
  #bottomleft { left: calc(env(safe-area-inset-left) + 10px); bottom: calc(env(safe-area-inset-bottom) + 10px); display: flex; gap: 8px; }
  #bottomleft svg { width: 26px; height: 26px; display: block; }
  #carry { left: calc(env(safe-area-inset-left) + 10px); bottom: calc(env(safe-area-inset-bottom) + 66px); max-width: min(78vw, 340px);
    box-sizing: border-box; display: flex; gap: 8px; align-items: center; background: var(--paper); border: 2px solid var(--edge);
    border-radius: 8px; padding: 3px 3px 3px 10px; font-size: 15px; color: var(--ink); }
  #carryText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #carryPut { flex: none; }
  #centre { right: calc(env(safe-area-inset-right) + 10px); bottom: calc(env(safe-area-inset-bottom) + 10px); }
  #toast { left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 112px); max-width: min(92vw, 420px);
    background: var(--ink); color: var(--paper); border-radius: 8px; padding: 10px 14px; font-size: 15px; line-height: 1.3;
    pointer-events: none; opacity: 0; transition: opacity .25s; text-align: center; }
  #toast.show { opacity: 1; }
  #toast.below { top: calc(env(safe-area-inset-top) + 184px); } /* under the Send-to banner */
  #panel { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 70px); width: min(94vw, 380px);
    box-sizing: border-box; background: var(--paper); border: 2px solid var(--edge); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
  #panel .row { display: flex; gap: 6px; align-items: center; }
  #panel .grow { flex: 1; }
  #panel h2 { margin: 0; font-size: 18px; color: var(--ink); }
  #panelStatus { font-size: 14px; color: #5a4a3a; min-height: 1.3em; }
  #panel .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #panel .acts button { padding: 0 4px; font-size: 14px; }
  #banner { left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 112px); width: min(94vw, 380px);
    box-sizing: border-box; background: var(--accent); color: #fff; border-radius: 10px; padding: 8px 8px 8px 14px;
    display: flex; gap: 10px; align-items: center; font-size: 15px; }
  #banner span { flex: 1; }
  #buildBtn { right: calc(env(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-top) + 10px); }
  #buildLabel { left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 112px); width: max-content; max-width: min(92vw, 380px);
    box-sizing: border-box; background: var(--paper); color: var(--ink); border: 2px solid var(--edge); border-left-width: 8px;
    border-radius: 8px; padding: 8px 12px; font-size: 15px; line-height: 1.3; text-align: center; pointer-events: none; }
  #buildLabel[data-k="ok"] { border-left-color: var(--green); }
  #buildLabel[data-k="amber"] { border-left-color: #d9952b; }
  #buildLabel[data-k="bad"] { border-left-color: var(--accent); color: var(--accent); }
  #buildConfirm { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 70px); display: flex; gap: 12px; }
  #buildConfirm button { min-height: 56px; min-width: 128px; font-size: 17px; }
  #buildLay { background: var(--edge); color: var(--paper); }
  #buildLay:disabled { opacity: 0.45; cursor: default; }
  #buildConfirm.planOnly { width: max-content; }
  #buildPlanOnly { display: flex; align-items: center; flex: 0 0 auto; width: 200px; min-height: 56px; box-sizing: border-box; padding: 6px 12px;
    background: var(--paper); color: var(--ink); border: 2px solid var(--edge); border-radius: 8px; font-size: 15px; line-height: 1.25; }
  /* The car panel (loading and unloading a set-out car): same place and look as the train panel. */
  #carPanel { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 70px); width: min(94vw, 380px); max-height: 52vh;
    overflow-y: auto; box-sizing: border-box; background: var(--paper); border: 2px solid var(--edge); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
  #carPanel .row { display: flex; gap: 6px; align-items: center; }
  #carPanel .grow { flex: 1; min-width: 0; }
  #carPanel h2 { margin: 0; font-size: 18px; color: var(--ink); }
#panelLoco { font-size: 13px; margin: 2px 0 4px; color: #4a3a28; }
#panelTt { margin-top: 6px; }
#panel.sending #panelLoco, #panel.sending #panelTt { display: none; }
#ttCard { position: fixed; left: 0; top: 0; z-index: 1; pointer-events: none; background: rgba(40, 30, 20, 0.86); color: #f3e7cf;
  border-radius: 8px; padding: 6px 9px; font-size: 12px; line-height: 1.35; max-width: 250px; }
#ttCard b { display: block; font-size: 13px; }
#ttCard .sig { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  #carInfo, #carHeld { font-size: 14px; color: #5a4a3a; }
  #carItems { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  #carItems button { font-size: 14px; padding: 0 6px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The telegraph panel (economy): orders, contracts and the ledger, at the depot's telegraph key. Same look as the car panel. */
  #telPanel { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 70px); width: min(94vw, 380px);
    box-sizing: border-box; background: var(--paper); border: 2px solid var(--edge); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  #telPanel .row { display: flex; gap: 6px; align-items: center; }
  #telPanel .grow { flex: 1; min-width: 0; }
  #telPanel h2 { margin: 0; font-size: 18px; color: var(--ink); }
  #telTabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #telTabs button { padding: 0 4px; font-size: 14px; }
  #telInfo { font-size: 14px; color: #5a4a3a; line-height: 1.3; }
  #telBody { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink); max-height: 36vh; overflow-y: auto; }
  #officeBody { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink); }
  #officeBody .row { display: flex; gap: 6px; align-items: center; }
  :is(#telBody, #officeBody) .row > span { line-height: 1.25; }
  :is(#telBody, #officeBody) .q { min-width: 2em; text-align: center; font-variant-numeric: tabular-nums; }
  :is(#telBody, #officeBody) small { color: #5a4a3a; font-size: 13px; }
  :is(#telBody, #officeBody) .card { border-top: 1px solid var(--paper-2); padding-top: 6px; display: grid; gap: 6px; }
  :is(#telBody, #officeBody) .money { font-variant-numeric: tabular-nums; white-space: nowrap; }
  :is(#telBody, #officeBody) button { font-size: 14px; padding: 0 8px; }
  #telSend { background: var(--edge); color: var(--paper); }
  #telSend:disabled { opacity: 0.45; }
  .jobSign, .townSign { left: 0; top: 0; z-index: 1; width: max-content; max-width: 250px; box-sizing: border-box; pointer-events: none;
    background: var(--paper); color: var(--ink); border: 2px solid var(--edge); border-left-width: 7px; border-radius: 8px;
    padding: 3px 3px 3px 9px; font-size: 14px; line-height: 1.25; display: flex; gap: 8px; align-items: center; }
  .jobSign .txt, .townSign .txt { flex: 1 1 auto; min-width: 0; max-width: 150px; }
  .jobSign b, .townSign b { display: block; font-size: 14px; }
  .jobSign span:empty, .townSign span:empty { display: none; }
  .jobSign button { pointer-events: auto; flex: none; font-size: 14px; padding: 0 8px; min-width: 48px; min-height: 48px; max-width: 86px; line-height: 1.1; }
  .jobSign button[data-armed] { background: var(--accent); color: #fff; }
  .jobSign[data-k="need"] { border-left-color: var(--accent); }
  .jobSign[data-k="ready"] { border-left-color: var(--green); }
  .jobSign[data-k="work"] { border-left-color: #c69a2c; }
  .townSign .txt { max-width: 190px; }
  .townSign[data-k="want"] { border-left-color: var(--accent); }
  .townSign[data-k="deliver"] { border-left-color: var(--green); }
  .townSign[data-k="offer"] { border-left-color: #c69a2c; }
  /* Passengers (C4): the staffing readout and the ticket window's button. */
  #paxDesk { left: calc(env(safe-area-inset-left) + 10px); bottom: calc(env(safe-area-inset-bottom) + 122px); max-width: min(78vw, 340px);
    box-sizing: border-box; display: flex; gap: 8px; align-items: center; background: var(--paper); border: 2px solid var(--edge);
    border-left: 7px solid var(--green); border-radius: 8px; padding: 3px 3px 3px 10px; font-size: 15px; color: var(--ink); }
  #paxDeskText { flex: 1; min-width: 0; line-height: 1.25; }
  #paxLeave { flex: none; }
  /* Riding our own train (D13): the riding readout with Step off, and the Board button at a passenger car's door. */
  #ride { left: calc(env(safe-area-inset-left) + 10px); bottom: calc(env(safe-area-inset-bottom) + 122px); max-width: min(78vw, 340px);
    box-sizing: border-box; display: flex; gap: 8px; align-items: center; background: var(--paper); border: 2px solid var(--edge);
    border-left: 7px solid #c69a2c; border-radius: 8px; padding: 3px 3px 3px 10px; font-size: 15px; color: var(--ink); }
  #rideText { flex: 1; min-width: 0; line-height: 1.25; }
  #rideOff { flex: none; }
  #ride[data-moving] #rideOff { opacity: 0.55; }
  #rideBoard { left: 0; top: 0; z-index: 1; font-size: 14px; padding: 0 10px; white-space: nowrap; border-left-width: 6px; border-left-color: #c69a2c; }
  .paxWin { left: 0; top: 0; z-index: 1; font-size: 14px; padding: 0 10px; white-space: nowrap; border-left-width: 6px; border-left-color: var(--green); }
  @media (orientation: landscape) and (max-height: 500px) {
    #carPanel { left: auto; right: calc(env(safe-area-inset-right) + 10px); transform: none; bottom: calc(env(safe-area-inset-bottom) + 10px); width: 340px; max-height: 76vh; }
    #telPanel { left: auto; right: calc(env(safe-area-inset-right) + 10px); transform: none; bottom: calc(env(safe-area-inset-bottom) + 10px); width: 360px; }
    #telBody { max-height: calc(100vh - 250px); }
    #buildLabel { top: calc(env(safe-area-inset-top) + 10px); max-width: 340px; }
    #buildConfirm { bottom: calc(env(safe-area-inset-bottom) + 10px); }
    #panel { left: auto; right: calc(env(safe-area-inset-right) + 10px); transform: none; bottom: calc(env(safe-area-inset-bottom) + 66px); width: 340px; }
    #toast, #banner { top: calc(env(safe-area-inset-top) + 10px); }
    #toast.below { top: calc(env(safe-area-inset-top) + 82px); }
  }
  /* Office, telegrams, alerts and Look (D13, builder D1). */
  #tgBtn { right: calc(env(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-top) + 66px); padding: 0 8px; display: flex; gap: 4px; align-items: center; }
  #tgBtn svg { width: 26px; height: 26px; display: block; }
  #tgCount { background: var(--accent); color: #fff; border-radius: 10px; font-size: 13px; line-height: 1; padding: 3px 6px; font-variant-numeric: tabular-nums; }
  #tgCount:empty { display: none; }
  #alerts { right: calc(env(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-top) + 122px); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  #alerts button { width: 56px; min-width: 56px; padding: 0 2px; font-size: 12px; line-height: 1.15; border-left-width: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #alerts button b { font-size: 13px; }
  #alerts button[data-k="wait"] { border-left-color: #c69a2c; }
  #alerts button[data-k="late"] { border-left-color: var(--accent); }
  #alerts button[data-k="stock"] { border-left-color: #5b6fa8; }
  #alerts button[data-k="wood"] { border-left-color: var(--green); }
  #tgSlide { left: calc(env(safe-area-inset-left) + 10px); top: calc(env(safe-area-inset-top) + 104px); width: min(calc(100vw - 120px), 300px); min-height: 48px;
    box-sizing: border-box; background: var(--paper); color: var(--ink); border: 2px solid var(--edge); border-left: 7px solid #c69a2c; border-radius: 8px;
    padding: 6px 10px; font-size: 14px; line-height: 1.25; transform: translateX(calc(-100% - 20px)); transition: transform .3s; cursor: pointer; }
  #tgSlide.show { transform: none; }
  #tgSlide b, #tgSlide small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tgSlide small { color: #5a4a3a; font-size: 13px; }
  .bigPanel { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 70px); width: min(94vw, 400px); max-height: calc(100vh - 240px);
    box-sizing: border-box; background: var(--paper); border: 2px solid var(--edge); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .bigPanel .row { display: flex; gap: 6px; align-items: center; }
  .bigPanel .grow { flex: 1; min-width: 0; }
  .bigPanel h2 { margin: 0; font-size: 18px; color: var(--ink); }
  #officeHead { flex-wrap: wrap; }
  #officeTabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; flex: 1 1 100%; order: 3; }
  #officeTabs button { padding: 0 1px; font-size: 13px; min-width: 0; }
  #officeInfo { font-size: 14px; color: #5a4a3a; line-height: 1.3; }
  #officeBody, #inboxBody { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  #officeBody table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  #officeBody td, #officeBody th { padding: 3px 4px; border-bottom: 1px solid var(--paper-2); text-align: left; font-size: 13px; }
  #officeBody td.n, #officeBody th.n { text-align: right; white-space: nowrap; }
  #officeBody svg.spark { width: 56px; height: 18px; flex: none; }
  #inboxBody { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink); }
  #inboxBody .tg { border: 1px solid var(--paper-2); border-left: 6px solid var(--paper-2); border-radius: 6px; padding: 6px 8px; min-height: 48px; box-sizing: border-box; display: grid; gap: 4px; cursor: pointer; }
  #inboxBody .tg[data-unread] { border-left-color: var(--accent); }
  #inboxBody .tg[data-unread] b { color: var(--accent); }
  #inboxBody .tg small { color: #5a4a3a; font-size: 13px; }
  #inboxBody .tg .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  #inboxBody .tg .acts button { font-size: 14px; padding: 0 10px; }
  #lookCard { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 70px); width: min(94vw, 380px); max-height: 52vh; overflow-y: auto;
    box-sizing: border-box; background: var(--paper); border: 2px solid var(--edge); border-left: 7px solid #5b6fa8; border-radius: 10px; padding: 10px; display: grid; gap: 6px; }
  #lookCard .row { display: flex; gap: 6px; align-items: center; }
  #lookCard h2 { margin: 0; font-size: 18px; color: var(--ink); flex: 1; min-width: 0; }
  #lookBody { font-size: 14px; color: var(--ink); line-height: 1.35; display: grid; gap: 3px; }
  #lookBody small { color: #5a4a3a; font-size: 13px; }
  #lookBtn[aria-pressed="true"] { background: #5b6fa8; border-color: #3c4d7d; color: #fff; }
  @media (orientation: landscape) and (max-height: 500px) {
    #tgBtn { top: calc(env(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-right) + 96px); }
    #alerts { top: calc(env(safe-area-inset-top) + 66px); }
    .bigPanel { left: auto; transform: none; right: calc(env(safe-area-inset-right) + 110px); bottom: calc(env(safe-area-inset-bottom) + 10px); width: 420px; max-height: calc(100vh - 76px); gap: 6px; }
    #officeHead h2 { display: none; }
    #officeTabs { flex: 1 1 auto; order: 0; }
    #officeInfo { font-size: 13px; }
    #lookCard { left: auto; transform: none; right: calc(env(safe-area-inset-right) + 110px); bottom: calc(env(safe-area-inset-bottom) + 10px); width: 340px; max-height: calc(100vh - 76px); }
  }
  /* The investor's tutorial (D2): the current task chip under the telegraph button (portrait) or Build (landscape). */
  #tutTask { right: calc(env(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-top) + 122px); display: grid; justify-items: end; gap: 6px;
    max-width: min(64vw, 300px); }
  #tutChip { max-width: 100%; text-align: left; font-size: 14px; line-height: 1.2; padding: 4px 10px; border-left: 7px solid #c69a2c;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tutChip small { display: block; font-size: 12px; font-weight: 400; color: #5a4a3a; }
  #tutChip.pulse { animation: tutPulse 1.2s ease-in-out 3; }
  @keyframes tutPulse { 50% { background: #f6d98a; } }
  @media (orientation: landscape) and (max-height: 500px) { #tutTask { top: calc(env(safe-area-inset-top) + 66px); } }
</style>
<!-- three.js, pinned to one exact version. Changing it is its own reviewed step. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="topleft" class="hud">
  <div id="clock">Mon, Spring 1, 1866 &middot; 05:00</div>
  <div id="speeds" role="group" aria-label="Game speed">
    <button data-speed="0" aria-label="Pause">II</button>
    <button data-speed="1">1x</button>
    <button data-speed="2">2x</button>
    <button data-speed="4">4x</button>
  </div>
  <div id="cash" role="status" aria-label="Cash on hand">$2,500.00</div>
</div>
<div id="bottomleft" class="hud">
  <button id="rotL" aria-label="Turn view left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 3v5h5"/></svg></button>
  <button id="rotR" aria-label="Turn view right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 3v5h-5"/></svg></button>
  <button id="lookBtn" aria-pressed="false" aria-label="Look: tap, then tap a thing to see its card">Look</button>
  <button id="officeBtn" aria-pressed="false" hidden>Office</button>
</div>
<button id="tgBtn" class="hud" aria-label="Telegrams" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="M3.5 7l8.5 6.5 8.5-6.5"/></svg><span id="tgCount"></span></button>
<div id="alerts" class="hud" role="group" aria-label="Problems"></div>
<div id="tgSlide" class="hud" role="status" aria-live="polite"><b id="tgSlideTitle"></b><small id="tgSlideFrom"></small></div>
<button id="centre" class="hud" hidden>Centre</button>
<button id="buildBtn" class="hud" aria-pressed="false">Build</button>
<div id="buildLabel" class="hud" role="status" aria-live="polite" hidden></div>
<div id="buildConfirm" class="hud" hidden><button id="buildLay">Lay track</button><button id="buildCancel">Cancel</button></div>
<div id="tutTask" class="hud" hidden>
  <button id="tutChip" aria-expanded="false"><small>Current task</small><span id="tutChipText"></span></button>
</div>
<div id="toast" class="hud" role="status" aria-live="polite"></div>
<div id="carry" class="hud" role="status" aria-live="polite" hidden><span id="carryText"></span><button id="carryPut">Put down</button></div>

// ==== Section: config ====

  TENDER_FIRST: 0.6,         // speed cap factor running tender-first

  STOP_GAP: 0.5 * SC,        // trains stop 0.5u (x SC) before a block they may not enter

// track graph, cost = length plus 20u for each diverging switch). Returns the switch settings it needs.

  }

    case 'walkDir':
      // Letting go (a = null) only ends a walk by direction; a switch throw in progress carries on.
      if (c.a === null) { if (P.mode === 'dir') { P.mode = 'idle'; P.use = null; P.act = null; } }
      else { P.mode = 'dir'; P.a = c.a; P.run = !!c.run; P.use = null; P.act = null; }
      break;
    case 'useSwitch': {
      const W = T.switches[c.sw];
      if (!W) return;
      P.mode = 'to'; P.tx = W.stand.ux; P.tz = W.stand.uz; P.use = { k: 'sw', id: c.sw }; P.act = null; P.run = false;
      break;
    }
    case 'useTrain':
      // c.view (optional): direction from the scene towards the camera as a 0-255 angle code, so the
      // player prefers the side of the train the camera sees. The sim itself knows nothing of the camera.
      if (!tr) return;
      P.mode = 'to'; P.use = { k: 'tr', id: c.tr }; P.act = null; P.run = false;
      if (Number.isInteger(c.view)) P.use.view = ((c.view % 256) + 256) % 256;
      break;
    case 'throwSwitch': throwSwitch(S, c.sw, ev); break;
    case 'carryPick': carryPickCmd(S, c, ev); break;
    case 'carryPut': carryPutCmd(S, c, ev); break;
    case 'carryTool': carryToolCmd(S, c, ev); break;
    case 'useCar': carryUseCarCmd(S, c, ev); break;
    case 'buildTrack': buildTrackCmd(S, c, ev); break;
    case 'stakeJob': jobStakeCmd(S, c, ev); break;   // construction jobs: Stake it, work, cancel
    case 'jobWork': jobWorkCmd(S, c, ev); break;
    case 'jobCancel': jobCancelCmd(S, c, ev); break;
    case 'setBayTag': setBayTag(S, c.b, c.bay, c.tag, ev); break;
    case 'uncouple': ttUncoupleCmd(S, c, ev); break;      // coupling, refuelling and the timetable (section "timetable")
    case 'fuelTender': ttFuelCmd(S, c, ev); break;
    case 'takeWater': ttWaterCmd(S, c, ev); break;
    case 'ttAssign': ttAssignCmd(S, c, ev); break;
    case 'ttHighball': ttHighballCmd(S, c, ev); break;
    case 'useTelegraph': { const k = econTelegraphKey(); P.mode = 'to'; P.tx = k.x; P.tz = k.z; P.use = { k: 'tel' }; P.act = null; P.run = false; break; }
    case 'useDesk': { const k = econDeskSpot(); P.mode = 'to'; P.tx = k.x; P.tz = k.z; P.use = { k: 'desk' }; P.act = null; P.run = false; break; }
    case 'tgRead': tgReadCmd(S, c, ev); break;           // telegrams (section "telegrams and alerts")
    case 'tgAnswer': tgAnswerCmd(S, c, ev); break;
    case 'tutorialSkip': tutSkipCmd(S, ev); break;      // the tutorial's Skip tutorial button (section "tutorial")
    case 'econOrder': econOrderCmd(S, c, ev); break;     // economy: orders, contracts and the credit line by telegraph
    case 'contractAccept': econContractCmd(S, c, ev, true); break;
    case 'contractDecline': econContractCmd(S, c, ev, false); break;
    case 'creditDraw': econCreditCmd(S, c, ev, true); break;
    case 'creditRepay': econCreditCmd(S, c, ev, false); break;
    case 'useBiz': townUseCmd(S, c, ev); break;          // town: walk to a business door
    case 'staffWindow': paxStaffCmd(S, c, ev); break;   // passengers: staff a station's ticket window
    case 'leaveWindow': paxLeaveCmd(S, ev); break;
    case 'boardCar': rideBoardCmd(S, c, ev); break;     // riding our own train (section "passengers", riding)
    case 'stepOff': rideStepOffCmd(S, ev); break;
    case 'trainRun': {
      if (!tr) return;
      releaseRoute(S, tr);
      const want = c.dir > 0 ? 1 : -1;
      // A moving train never flips direction at once: mode 'turn' brakes to a stop first,
      // then trainTick sets m = -m and runs the new way.
      if (want !== tr.m && tr.v > 0.01) tr.mode = 'turn';
      else { tr.mode = 'run'; tr.m = want; }
      break;
    }
    case 'trainStop':
      if (!tr) return;
      releaseRoute(S, tr);
      tr.mode = 'stop';
      break;
    case 'trainSendTo': {
      if (!tr) return;
      const tE = Number.isInteger(c.e) ? T.edges[c.e] : null;
      if (!tE || !Number.isFinite(c.s) || c.s < 0 || c.s / 1000 > tE.len) { ev.push({ t: 'noRoute', tr: tr.id, why: 'That is not a place on the track.' }); return; }
      if (tE.fixed && (typeof worldId !== 'function' || worldId(T) === 'yard')) { ev.push({ t: 'noRoute', tr: tr.id, why: 'That is the Overland\'s interchange track: it is not joined to our line yet.' }); return; }
      const target = { e: c.e, s: c.s / 1000 };
      const occ = occupiedSwitches(S);
      // A moving train may only take a route in the direction it is already going.
      const moving = tr.v > 0.01;
      let best = null, otherWay = false;
      for (const m of (moving ? [tr.m, -tr.m] : [1, -1])) {
        const r = findRoute(T, leadPos(T, tr, m), target);
        if (!r) continue;
        const clash = r.needs.find(n => {
          const W = T.switches[n.sw];
          if (W.state === n.state) return false;
          return occ[n.sw] !== undefined || (W.lockedBy !== null && W.lockedBy !== tr.id);
        });
        if (clash) continue;
        if (moving && m !== tr.m) { otherWay = true; continue; }
        // Compare by estimated time: tender-first running is capped at 60% speed.
        const time = r.cost / (CFG.LOCO_MAX * (tenderFirst(tr, m) ? CFG.TENDER_FIRST : 1));
        if (!best || time < best.time) best = { r, m, time };
      }
      if (!best) { ev.push({ t: 'noRoute', tr: tr.id, why: otherWay ? 'Stop the train first.' : 'There is no way there without reversing.' }); return; }
      const held = ttReservedBy(S, best.r.path, tr.id);
      if (held !== null) { ev.push({ t: 'noRoute', tr: tr.id, why: `The line is reserved for ${S.trains[held].name}: wait until it has passed.` }); return; }
      releaseRoute(S, tr);
      const locks = [];
      for (const n of best.r.needs) {
        const W = T.switches[n.sw];
        W.state = n.state; W.lockedBy = tr.id;
        if (!locks.find(l => l.sw === n.sw)) locks.push({ sw: n.sw, at: n.at });
      }
      tr.mode = 'route'; tr.m = best.m;
      tr.route = { total: best.r.dist, left: best.r.dist, locks };
      // Sent onto a standing cut of cars: run up to it and couple it (section "trains", coupling).
      if (S.trains.some(o => o !== tr && trainCanCouple(o) && trainSegs(T, o).some(([e, a, b]) => e === c.e && target.s >= a - 0.3 * SC && target.s <= b + 0.3 * SC))) tr.route.couple = true;
      ev.push({ t: 'routeSet', tr: tr.id });
      break;
    }
  }
}
// Lay track (M0: instant, debug build). Re-checks the plan from the command's whole numbers, then applies it.
// Never over a train's track; edges keep their ids (new ones are appended); the derived index is rebuilt.
function buildTrackCmd(S, c, ev) {
  const p = buildPlan(S, c);
  if (!p.ok) { ev.push({ t: 'buildRefused', why: p.why || 'Drag further to lay track' }); return; }
  trackLayPlan(S, p, ev);
}
// Add a checked plan's track to the network: the instant build, and a construction job when its last spike is in.
function trackLayPlan(S, p, ev) {
  const e0 = S.track.edges.length, r = bMutate(S.track, p.G);
  // A switch split a straight edge (bPlaceSwitch: the edge keeps its id up to the first cut, the rest are new
  // edges running the same way): a train standing beyond the first cut moves onto the piece it stands on.
  if (r.split) for (const tr of S.trains) {
    const f = tr.front, { e, cuts, pieces } = r.split;
    if (!f || f.e !== e || f.s <= cuts[0] + 1e-9) continue;
    let k = 0;
    while (k + 1 < cuts.length && f.s > cuts[k + 1] + 1e-9) k++;
    tr.front = { e: pieces[k + 1], s: f.s - cuts[k], d: f.d };
  }
  trackIndexCache.delete(S.track); walkGridCache.delete(S.track);
  ev.push({ t: 'trackBuilt', edges: S.track.edges.length - e0, sw: r.sw, len: Math.round(p.len * 100) });
  return r;
}
function throwSwitch(S, swId, ev) {
  const W = S.track.switches[swId];
  if (!W) return;
  const why = switchLockReason(S, swId);
  if (why) { ev.push({ t: 'switchLocked', sw: swId, why }); return; }
  W.state = W.state === 'N' ? 'R' : 'N';
  ev.push({ t: 'switchThrown', sw: swId, state: W.state });
}

// ==== Section: trains ====
function trainTick(S, tr, ev) {
  if (trainOff(tr) || tr.owner === 'interchange' || !trainPower(tr)) return; // away, or standing cars with no engine
  const T = S.track;
  // Coupling up (section "timetable", coupling): the train stands while the crew couples.
  if (tr.cw > 0) { tr.cw -= CFG.TICK_GAME_S; tr.v = 0; tr.status = 'Coupling up'; if (tr.cw <= 0) { delete tr.cw; tr.status = 'Coupled'; } return; }
  const L = trainLength(tr);
  const mass = tr.consist.reduce((s, c) => s + c.mass, 0);
  const power = trainPower(tr);
  const accel = CFG.ACCEL_K * power / mass;
  let vTarget = 0, stop = 0, reason = null, sw = null, sc = null, obst = null;
  const driving = tr.mode === 'run' || tr.mode === 'route';
  // A player's move ('run', Forward or Back) or a coupling route runs into a standing cut of cars to couple it;
  // any other move stops 0.5u short of another train.
  const coupling = tr.mode === 'run' || (tr.mode === 'route' && tr.route && tr.route.couple);
  // Look ahead whenever the train moves, also while it brakes ('stop', 'turn'), so it never rolls
  // onto a switch set against it or past the gap at a dead end.
  if (driving || tr.v > 0) {
    const lead = leadPos(T, tr, tr.m);
    const look = (tr.v * tr.v) / (2 * CFG.BRAKE) + 4 * SC;
    sc = trackScan(T, lead, look);
    stop = sc.stop; reason = sc.reason; sw = sc.sw;
    // Other trains ahead. The Overland runs up to its own set-out cars (its crew couples them, "The Overland").
    const ob = trainObstacle(S, tr, lead, look + 1);
    if (ob) {
      const own = tr.owner === 'overland' && ob.other.owner === 'interchange';
      const couples = !tr.owner && coupling && trainCanCouple(ob.other);
      const at = Math.max(0, ob.gap - (couples || own ? COUPLER_GAP : CFG.STOP_GAP));
      if (at < stop) { stop = at; reason = couples ? 'couple' : 'train'; obst = couples ? ob.other : null; }
    }
  }
  if (driving) {
    if (tr.mode === 'route' && tr.route.left < stop) { stop = tr.route.left; reason = 'target'; obst = null; }
    vTarget = CFG.LOCO_MAX * (tenderFirst(tr, tr.m) ? CFG.TENDER_FIRST : 1);
    if (trainOutOf(tr)) vTarget = Math.min(vTarget, CFG.LIM.yard); // out of wood or water: creeping at yard speed
    // Speed limits on the track under the train and ahead of it.
    for (const [e] of trainSegs(T, tr)) vTarget = Math.min(vTarget, T.edges[e].lim);
    for (const l of sc.limits) vTarget = Math.min(vTarget, Math.sqrt(l.lim * l.lim + 2 * CFG.BRAKE * l.at));
    vTarget = Math.min(vTarget, Math.sqrt(2 * CFG.BRAKE * stop));
  }
  if (!driving) {
    // Ordinary braking ('stop', 'turn', 'idle'), but never faster than the curve that ends at the stopping point.
    tr.v = Math.max(0, tr.v - CFG.BRAKE * DT_MIN);
    if (tr.v > 0) tr.v = Math.min(tr.v, Math.sqrt(2 * CFG.BRAKE * stop));
  }
  else if (tr.v < vTarget) tr.v = Math.min(vTarget, tr.v + accel * DT_MIN);
  else tr.v = vTarget; // vTarget already follows the braking curve to the stopping point
  let ds = tr.v * DT_MIN;
  ds = Math.min(ds, stop);
  if (!driving && tr.v > 0 && stop - ds < 1e-3) tr.v = 0; // reached the stopping point while braking
  if (ds > 0) {
    if (tr.m > 0) tr.front = trackWalk(T, tr.front, ds).pos;
    else {
      const rear = trackWalk(T, leadPos(T, tr, -1), ds).pos;
      tr.front = trackWalk(T, reversePos(rear), L).pos;
    }
    if (tr.route) {
      tr.route.left = Math.max(0, tr.route.left - ds);
      const done = tr.route.total - tr.route.left;
      const occ = occupiedSwitches(S);
      for (const lk of tr.route.locks) {
        const W = T.switches[lk.sw];
        if (W.lockedBy === tr.id && done > lk.at + L + 1 * SC && occ[lk.sw] === undefined) W.lockedBy = null;
      }
    }
    if (!tr.owner) trainBurn(tr, ds); // wood and water drop with running (section "timetable")
  }
  // Touching a standing cut of cars at the end of a coupling move: couple it.
  if (obst && reason === 'couple' && stop - ds < 1e-3) { trainCouple(S, tr, obst, ev); return; }
  // Status line for the panel.
  if (tr.mode === 'route' && tr.route && tr.route.left < 1e-3) {
    tr.v = 0; releaseRoute(S, tr); tr.mode = 'idle'; tr.status = 'Arrived';
    ev.push({ t: 'trainArrived', tr: tr.id });
  } else if (tr.mode === 'stop') {
    if (tr.v < 1e-3) { tr.v = 0; tr.mode = 'idle'; }
    tr.status = 'Stopped';
  } else if (tr.mode === 'turn') {
    // Braked to a stop: now go the other way.
    if (tr.v < 1e-3) { tr.v = 0; tr.m = -tr.m; tr.mode = 'run'; }
    tr.status = 'Stopping to change direction';
  } else if ((tr.mode === 'run' || tr.mode === 'route') && stop < 1e-3) {
    tr.v = 0;
    tr.status = reason === 'against' ? 'Waiting: the switch ahead is set against us' : reason === 'end' ? 'At the end of the track'
      : reason === 'train' ? 'Waiting: a train is in the way' : 'Waiting';
  } else if (tr.mode === 'run' || tr.mode === 'route') {
    const dir = (tr.m > 0 ? 'forward' : 'back') + (tenderFirst(tr, tr.m) ? ' (tender first)' : '');
    tr.status = (tr.mode === 'route' ? 'On its way, ' : 'Running ') + dir;
  } else if (tr.mode === 'idle' && tr.status !== 'Arrived') tr.status = 'Stopped';
}

// ---- Coupling, uncoupling and locomotive state (M1 package 6, builder C3; design-doc 7) ----
// Pure simulation. Each vehicle in tr.consist is listed front to back; a vehicle turned round relative to the
// train's front has rev: true (an engine moved to the other end by a run-around still faces the old way).
// An engine's smokebox faces the train's front unless rev. Running with the tender leading is capped at 60%.
// Each engine (not the Overland's) carries fuel (wood, as u of range left) and water (u of range left).
// Coupling: a player's move (Forward or Back) or a coupling route that runs into a standing cut of cars
// (a train with no engine) slows to touch it and couples it; the train then stands 1.0 game minute ('Coupling
// up'). The joined train keeps the mover's id; the cut's entry stays in S.trains with no cars (ids never change).
// Any other train ahead makes a moving train stop 0.5u short of it. Uncoupling needs a person at the joint
// (section "timetable", ttUncoupleCmd); the part with the engine keeps the train's id, the other part becomes a
// cut: the interchange's cut entry if it stands on the interchange and that entry is empty, else an empty
// 'cut' entry, else a new one appended.
const trainPower = tr => tr.consist.reduce((s, c) => s + (c.power || 0), 0);
// Which way the (first) engine's smokebox faces: +1 towards the train's front, -1 towards its rear.
function trainFacing(tr) { const c = tr.consist.find(c => c.k === 'loco'); return c && c.rev ? -1 : 1; }
function tenderFirst(tr, m) { return m !== trainFacing(tr); }
const trainLocos = tr => tr.consist.filter(c => c.k === 'loco' && typeof c.fuel === 'number');
function trainOutOf(tr) { return trainLocos(tr).some(c => c.fuel <= 0 || c.water <= 0); }
// Wood and water burn with the weight hauled (provisional): 1u of range per u run for 6 tons (an engine and three
// loaded cars), so No. 1 with its combine and boxcar burns 72% and a light engine shunting 50%.
const trainBurnRate = tr => tr.consist.reduce((s, c) => s + c.mass, 0) / 6;
function trainBurn(tr, ds) {
  const k = ds * trainBurnRate(tr);
  for (const c of trainLocos(tr)) { c.fuel = Math.max(0, c.fuel - k); c.water = Math.max(0, c.water - k); }
}
const FUEL_CAP = CFG.CORD_U * CFG.TENDER_CORDS;
function locoFull() { return { fuel: FUEL_CAP, water: CFG.WATER_U }; }
// The stretches of track ahead of a position, in travel order: { e, from, to, at (distance from pos to from), d }.
function trackAhead(T, pos, maxDist) {
  let e = pos.e, s = pos.s, d = pos.d, run = 0;
  const out = [];
  for (let guard = 0; guard < 1000; guard++) {
    const E = T.edges[e], avail = d > 0 ? E.len - s : s, take = Math.min(avail, maxDist - run);
    out.push({ e, from: s, to: s + d * take, at: run, d });
    run += take;
    if (run >= maxDist - 1e-12) break;
    const node = d > 0 ? E.b : E.a, nx = nextEdge(T, node, e);
    if (nx.blocked) break;
    const E2 = T.edges[nx.e];
    e = nx.e; d = E2.a === node ? 1 : -1; s = d > 0 ? 0 : E2.len;
  }
  return out;
}
// The nearest other train ahead of `lead` within maxDist: { gap, other }, or null.
function trainObstacle(S, tr, lead, maxDist) {
  const T = S.track, ahead = trackAhead(T, lead, maxDist);
  let best = null;
  for (const o of S.trains) {
    if (o === tr || trainOff(o)) continue;
    for (const [e, a, b] of trainSegs(T, o)) for (const p of ahead) {
      if (p.e !== e) continue;
      const lo = Math.min(p.from, p.to), hi = Math.max(p.from, p.to);
      if (b < lo - 1e-9 || a > hi + 1e-9) continue;
      const gap = p.at + (p.d > 0 ? Math.max(0, a - p.from) : Math.max(0, p.from - b));
      if (!best || gap < best.gap - 1e-12 || (Math.abs(gap - best.gap) <= 1e-12 && o.id < best.other.id)) best = { gap, other: o };
    }
  }
  return best;
}
// A cut of standing cars with no engine, not the Overland's train.
function trainCanCouple(o) { return !trainOff(o) && o.owner !== 'overland' && !trainPower(o) && o.v === 0; }
function trainFlip(cs) { return cs.slice().reverse().map(c => { const n = { ...c }; if (n.rev) delete n.rev; else n.rev = true; return n; }); }
// The mover X touches the standing cut Y with its leading end: Y's cars join X, in order along the track.
function trainCouple(S, X, Y, ev) {
  const T = S.track, lead = leadPos(T, X, X.m), yRear = leadPos(T, Y, -1);
  const at = p => edgeAt(T, T.edges[p.e], p.s), pl = at(lead), pf = at(Y.front), pr = at(yRear);
  const touchedFront = Math.hypot(pl.x - pf.x, pl.z - pf.z) <= Math.hypot(pl.x - pr.x, pl.z - pr.z);
  const n = Y.consist.length;
  if (X.m > 0) { X.consist = (touchedFront ? trainFlip(Y.consist) : Y.consist).concat(X.consist); X.front = touchedFront ? yRear : { ...Y.front }; }
  else X.consist = X.consist.concat(touchedFront ? Y.consist : trainFlip(Y.consist));
  Y.consist = []; Y.v = 0; Y.mode = 'idle'; Y.route = null; Y.status = 'Coupled';
  releaseRoute(S, X);
  X.v = 0; X.mode = 'idle'; X.status = 'Coupling up'; X.cw = CFG.COUPLE_S;
  ev.push({ t: 'coupled', tr: X.id, from: Y.id, cars: n });
}
// Split a standing train between consist[k - 1] and consist[k]. Returns the cut (the part without the engine).
function trainSplit(S, tr, k, ev) {
  const T = S.track, A = tr.consist.slice(0, k), B = tr.consist.slice(k);
  const backFront = reversePos(trackWalk(T, reversePos(tr.front), trainLength({ consist: A }) + COUPLER_GAP).pos);
  const keepBack = !A.some(c => c.k === 'loco') && B.some(c => c.k === 'loco');
  const cars = keepBack ? A : B, carsFront = keepBack ? { ...tr.front } : backFront;
  tr.consist = keepBack ? B : A; if (keepBack) tr.front = backFront;
  let cut = null;
  const ich = interchangeCut(S);
  if (ich && !ich.consist.length && T.edges[carsFront.e].fixed) cut = ich;
  if (!cut) cut = S.trains.find(t => t.owner === 'cut' && !t.consist.length) || null;
  if (!cut) { cut = { id: S.trains.length, name: 'Cut of cars', owner: 'cut', front: null, v: 0, mode: 'idle', m: 1, route: null, status: 'Standing', consist: [] }; S.trains.push(cut); }
  cut.consist = cars; cut.front = carsFront; cut.v = 0; cut.mode = 'idle'; cut.route = null; cut.status = 'Standing'; cut.m = 1;
  ev.push({ t: 'uncoupled', tr: tr.id, cut: cut.id, cars: cars.length });
  return cut;
}

// ---- The Overland (M1 package 2, builder B4): design-doc 9 "The interchange" ----
// Pure simulation. The Overland's train (S.trains entry with owner 'overland') arrives twice a day, at 06:00
// and 18:00 game time: at that tick it comes in from beyond the east map edge on the interchange track
// (section "test yard layout", ICH), pushing its cars ahead of the engine. It sets them out (uncouples them)
// at the dead end, and leaves off the map edge again. The cars it set out are one standing train with no
// engine (owner 'interchange'), which blocks walking like any train and holds items at CAR locations.
// Pick-up (one track serves inbound and outbound for now): when cars stand there, the Overland couples to
// them (1.0 game minute). If any standing car is empty, or holds only goods addressed Outside, it takes
// those cars: it pulls the whole string off the map, where its crew drops them (their Outside goods are
// logged as sold Outside), then pushes the rest back in and sets them out with its new cars.
// Everything is in S.overland and the two trains; a visit is driven by game ticks only, so it is the same
// every time and a save taken mid-visit resumes exactly. The player cannot drive either train.
// Room: set-out cars must end by s = ICH.FIT_S (x = 48). Cars that do not fit stay on the Overland and come
// back next visit; while it has cars like that aboard it brings no new delivery.
// Events: overlandArriving, overlandCoupled, overlandPickedUp, overlandSetOut, overlandLeft.
const OVERLAND = { FIRST_STOCK: 100, DUE: [6 * 3600, 18 * 3600], COUPLE_S: 60, UNCOUPLE_S: 30 };
const OVERLAND_LOCO = { k: 'loco', len: 5.2 * SC, mass: 3, power: 10, look: 'overland' };
const OVERLAND_CARS = { flatcar: { k: 'flatcar', len: 2.6 * SC, mass: 0.5 }, boxcar: { k: 'boxcar', len: 2.6 * SC, mass: 0.5 } };
// The fixed test delivery, until money and import orders exist (M1 round C). Each line is
// [commodity, destination town (CARGO_TOWNS id), consignee kind, consignee id, how many]. Track materials go to
// CONSTRUCTION (id 0, the hub's own track work); town goods to placeholder businesses (id 0 at the hub,
// id 1 at Willow Ford). Morning: 4 tie bundles, 2 rail bundles and a hardware crate (switch parts) on a
// flatcar, and 2 spike kegs with town goods in a boxcar. Evening: a boxcar of town goods and the mail.
const OVERLAND_DELIVERY = {
  morning: [

    const at = job.site[id], to = at ? { kind: 'GROUND', x: at[0], z: at[1] } : spot();

  const d = job.done, L = job.loose;

  for (const m of JOB_MATS) {
    const per = JOB_MAT[m].per;
    for (let left = pieces[m]; left > 0; left -= per) {
      const wb = { commodity: m, originTownId: 0, destTownId: 0, consignee: { kind: 'CONSTRUCTION', id: job.id }, contractId: null, due: null };
      if (left < per) wb.pieces = left;
      if (itemCreate(S, wb, spot(), ev).ok) n++;

  }
  L.ties = 0; L.rails = 0; L.spikes = 0;
  if (placed) { d.ties = 0; d.rails = 0; d.spikes = 0; d.hardware = 0; }

}
function jobRemove(S, job) { S.jobs.list = S.jobs.list.filter(j => j !== job); }
// The last spike is in: the track joins the network exactly as the build command lays it, then the job goes.
function jobComplete(S, job, ev) {
  const P = S.player;
  if ((P.use && P.use.k === 'job') || (P.act && P.act.k === 'job')) { P.use = null; P.act = null; P.mode = 'idle'; }
  const p = buildPlan(S, { t: 'buildTrack', ...job.cmd });
  if (!p.ok) { jobStop(S, job, ev, 'The track cannot join yet: ' + (p.why || 'the plan no longer fits')); return; }
  const g = jobGeoFromPlan(p);
  if (Math.abs(g.len - job.len) > 1e-6) { jobStop(S, job, ev, 'The track cannot join: the track around the job has changed'); return; }
  trackLayPlan(S, p, ev);
  jobReturn(S, job, ev, false);
  jobRemove(S, job);
  ev.push({ t: 'jobDone', id: job.id, len: Math.round(job.len * 100) });
}
function jobCancelCmd(S, c, ev) {
  const job = Number.isInteger(c.id) ? jobGet(S, c.id) : null;
  if (!job) return jobRefuse(ev, 'There is no such job');
  const P = S.player;
  if ((P.use && P.use.k === 'job' && P.use.id === job.id) || (P.act && P.act.k === 'job' && P.act.id === job.id)) { P.use = null; P.act = null; P.mode = 'idle'; }
  const items = jobReturn(S, job, ev, true);

// Every piece of track material in the game: in items (whole or part-used), loose at jobs, placed at jobs.
// Track that has joined the network is not counted. For the checks.
function jobPieceTotals(S) {

  for (const j of S.jobs.list) {
    out.ties += j.loose.ties + j.done.ties; out.rails += j.loose.rails + 2 * j.done.rails;
    out.spikes += j.loose.spikes + j.done.spikes; out.hardware += j.done.hardware;

}
// Shape check for the saved jobs (used when a save is loaded). Throws on damage.
function jobCheckSaveShape(st) {

  if (!J || !int(J.next) || !Array.isArray(J.list)) bad();
  for (const j of J.list) {
    if (!j || !int(j.id) || j.id >= J.next || !j.cmd || !j.geo || !Array.isArray(j.geo.edges) || !j.geo.edges.length || !Array.isArray(j.stakes)) bad();
    for (const k of ['count', 'need', 'done', 'loose']) if (!j[k] || Object.values(j[k]).some(v => !int(v) || v < 0)) bad();

// Debug only (rh.scenario('handbuild')): a 20u siding staked off the north main line, with a switch, and every

// ==== Section: town ====
// Owner: M1 package 4 (builder C5). Placeholder towns (design-doc 9 "Local delivery", 11 "Consumption per
// person per week", 12 "Town businesses", 15 "Starting hub", 21 "Starting world"): the businesses of the hub
// and Willow Ford as stock holders that use goods up at fixed weekly rates, offer contracts by telegraph when
// they run low, and take deliveries at their doors. M2 replaces this with real citizens.
// Pure simulation: no three.js, no page elements. Whole numbers only; businesses and goods in sorted order.
//
// TOWN_BUSINESSES is the one list of businesses (the economy's ECON_BUSINESSES is the same array).
// Each: { id, name, short, townId, kind (its building recipe), uses: { commodity: milli-units a week },
// winter: { commodity: milli-units a week, winter only } }. Rates: section 11 for the people each serves,
// section 12 for the boarding house and the saloon (DEV_NOTES "Town" lists the provisional numbers).
//
// S.town.biz[id] (index = business id):
//   shelf   { c: n }   opening stock, counted but not items (a new game has no items; section 21 starts with none
//                      in the warehouse). Used up first, then the delivered items.
//   acc     { c: n }   what has been used since the last whole unit, in milli-units x hours (a unit is 1000 x 168)
//   short   { c: n }   units wanted when nothing was in stock (unmet need, for M2's satisfaction)
//   offered { c: t }   when this business last offered a contract for c (game seconds), or null
// Delivered goods are real items at { kind: 'BUSINESS', businessId } (the cargo section's place) until used.
//
// Each game hour every business uses its rates (acc += rate; a whole unit at 1000 x 168): first from the shelf,
// then the oldest delivered item (itemConsume, reason 'business', logged), else counted as short.
// Each day at 07:00 a business low on a good (stock plus what open contracts and offers still bring is under
// 4 days of use) offers a delivery contract by telegraph (the economy's contractOffer): enough for 2 weeks,
// due by the end of the 4th day after, priced at the delivered price plus up to 30% when it has none
// (section 10 scarcity). At most one offer per good every 3 days.
//
// Buildings: TOWN_LOTS, placed from the hub depot's position (townAnchor; C2's station data when it lands)
// with the section 6 clearances. townFootprints() joins buildingFootprints(), so the walk grid, the build tool
// and the crowd keep out of them; each has a door spot (townDoor) just outside its front, where it is used.
//
// Delivery (section 9): carry an item to a business door and put it down there (carryPut { biz }, 0.2 game
// minutes, by hand, hand truck or handcart). Only items addressed to that business are taken (townDeliverWhy);
// the item moves to { kind: 'BUSINESS', businessId } and the economy's contractDeliver pays for it under its
// contract. With more items for the same business, the next one is put down straight after.
// Commands: { t: 'useBiz', biz } walk to the door (event reachedBiz); { t: 'carryPut', biz } deliver the top item.
// Events: reachedBiz { biz }, bizDelivered { biz, id, paid, contract, why }, contractOffered (economy).
const TOWN = {
  UNIT: 1000 * 168,         // acc per whole unit used: rates are milli-units a week, added once a game hour
  OFFER_SOD: 7 * 3600,      // offers are looked at once a day, at 07:00
  LOW_DAYS: 4, TARGET_DAYS: 14, OPEN_DAYS: 5, DUE_DAYS: 4, OFFER_GAP_S: 3 * 86400, SCARCE_PCT: 30, // OPEN_DAYS 5 (was 10, D4): first offers about day 3 (provisional)
  DOOR_OUT: 0.6,            // the door spot, this far out from the front wall
  SIGN_NEAR: 9 * SC,        // the door label shows when the player is this close (page side)
};
// Who lives where (provisional, section 15 and 21): hub 25 people in 9 households, 8 of them boarders;
// Willow Ford 10 people in 4 households.
const TOWN_PLACES = [
  { id: 0, name: 'Hub', people: 25, households: 9, boarders: 8 },
  { id: 1, name: 'Willow Ford', people: 10, households: 4, boarders: 0 },
];
// Section 11 weekly use per person (milli-units): food and clothing; per household: lamp oil, and cordwood in winter.
const TOWN_PER_PERSON = { flour: 250, beans: 150, meat: 100, coffee: 50, salt: 50, clothing: 30 };

const TOWN_PER_HOUSEHOLD_WINTER = { cordwood: 500 };
function townStoreRates(people, households) {
  const uses = {}, winter = {};
  for (const c of Object.keys(TOWN_PER_PERSON).sort()) uses[c] = TOWN_PER_PERSON[c] * people;
  for (const c of Object.keys(TOWN_PER_HOUSEHOLD).sort()) uses[c] = TOWN_PER_HOUSEHOLD[c] * households;
  for (const c of Object.keys(TOWN_PER_HOUSEHOLD_WINTER).sort()) winter[c] = TOWN_PER_HOUSEHOLD_WINTER[c] * households;
  return { uses, winter };
}
// The general store serves everyone but the boarders (17 people, 8 households at the hub); the boarding house
// feeds its 8 boarders at section 12's rate (1 flour, 1 beans, 0.5 meat, 0.2 coffee per 12 residents a week)
// and lights and heats itself as one household; the saloon takes 1 barrel of whiskey per 30 people; the
// developer's yard uses building materials at a placeholder rate until it builds real projects (M2).
const TOWN_BUSINESSES = (() => {
  const H = TOWN_PLACES[0], W = TOWN_PLACES[1], hubStore = townStoreRates(H.people - H.boarders, H.households - 1), wfStore = townStoreRates(W.people, W.households);
  const per12 = (n, b) => Math.round(n * b / 12);
  return [
    { id: 0, name: 'Hub General Store', short: 'general store', townId: 0, kind: 'store', ...hubStore },
    { id: 1, name: 'Willow Ford General Store', short: 'general store', townId: 1, kind: 'tradingpost', ...wfStore },
    { id: 2, name: 'Hub Developer\'s Yard', short: 'developer\'s yard', townId: 0, kind: 'devyard', uses: { lumber: 2000, nails: 500 }, winter: {} },
    { id: 3, name: 'Hub Saloon', short: 'saloon', townId: 0, kind: 'saloon', uses: { whiskey: Math.round(1000 * H.people / 30) }, winter: {} },
    { id: 4, name: 'Hub Boarding House', short: 'boarding house', townId: 0, kind: 'boarding',
      uses: { beans: per12(1000, H.boarders), coffee: per12(200, H.boarders), flour: per12(1000, H.boarders), lampoil: 100, meat: per12(500, H.boarders) }, winter: { cordwood: 500 } },
  ];
})();
const townBiz = id => TOWN_BUSINESSES.find(b => b.id === id) || null;
// Every good a business ever uses, sorted.
const townGoods = B => Object.keys(Object.assign({}, B.uses, B.winter)).sort();
const townWinter = day => Math.floor(day / 14) % 4 === 3; // seasons as in clockText: 14 days each, spring first
function townRate(B, c, winter) { return (B.uses[c] || 0) + (winter ? B.winter[c] || 0 : 0); }

// ---- Buildings: plan sizes, doors and lots (plain data; the drawing is in "buildings") ----
// Plan extent in the building's own frame [minX, maxX, minZ, maxZ]; local +z is the front (the street side).
// door: the door's local x on the front; sign: where the name board is (local x, y, z), for the door label.
// D15: town buildings grow with the world (their extents, doors and signs times SC) and so do the lots' places.
const TOWN_KINDS = scaleDeep({
  store: { ext: [-1.9, 1.9, -1.3, 2.0], door: 0, sign: [0, 2.15, 1.4] },          // general store, false front, porch
  saloon: { ext: [-1.7, 1.7, -1.3, 2.0], door: 0, sign: [0, 2.45, 1.4] },         // saloon, taller stepped false front
  boarding: { ext: [-2.3, 2.3, -1.4, 2.0], door: -0.9, sign: [-0.9, 1.75, 1.95] }, // two storeys, small porch
  devyard: { ext: [-3.0, 3.0, -2.2, 2.2], door: 0, sign: [1.3, 1.25, 2.25] },     // fenced yard, gate at the front
  tradingpost: { ext: [-1.4, 1.4, -1.1, 1.4], door: 0, sign: [0, 1.75, 1.42] },   // Willow Ford: canvas store tent
  house: { ext: [-0.9, 0.9, -0.75, 0.75], door: -0.35, sign: null },             // a shanty home (4 at the hub)
});
// Lots: kind, business (null for homes), town, and the position from the town's anchor (dx, dz in the anchor's
// frame, yaw added to it; a world may give its own, as start: { dx, dz }). Both worlds have their station on the
// track side of the depot, so the hub's lots are the same from its depot in each: a Main Street behind the depot
// (z about 3.5 on the test yard, -14 in the real start), the four businesses on its far side facing it, the
// shanties on a back lane behind them, clear of the depot's back (the yard's build tool check plans along
// x = -2.4), of the track (section 6: 1.2u from main, 1.0u from yard) and, in the real start, inside the hub
// boundary. Willow Ford's general store stands beside its depot, west of the platform, among the settlers' cabins.
const TOWN_LOTS = [
  { id: 'store', kind: 'store', biz: 0, townId: 0, dx: 8.9 * SC, dz: -9.2 * SC, yaw: 0 },
  { id: 'saloon', kind: 'saloon', biz: 3, townId: 0, dx: 14.0 * SC, dz: -9.2 * SC, yaw: 0 },
  { id: 'boarding', kind: 'boarding', biz: 4, townId: 0, dx: -6.0 * SC, dz: -9.2 * SC, yaw: 0 },
  { id: 'devyard', kind: 'devyard', biz: 2, townId: 0, dx: -12.8 * SC, dz: -9.4 * SC, yaw: 0 },
  { id: 'house1', kind: 'house', biz: null, townId: 0, dx: -8.6 * SC, dz: -14.6 * SC, yaw: 0 },
  { id: 'house2', kind: 'house', biz: null, townId: 0, dx: -4.2 * SC, dz: -14.6 * SC, yaw: 0 },
  { id: 'house3', kind: 'house', biz: null, townId: 0, dx: 8.2 * SC, dz: -14.6 * SC, yaw: 0 },
  { id: 'house4', kind: 'house', biz: null, townId: 0, dx: 12.4 * SC, dz: -14.6 * SC, yaw: 0 },
  { id: 'wfstore', kind: 'tradingpost', biz: 1, townId: 1, dx: 0, dz: 0, yaw: 0, start: { dx: -8.1 * SC, dz: 0.4 * SC } },
];
// Where each town is laid out from, in the world in use (worldUse points BLD_LAYOUT at it): the hub from its
// depot; Willow Ford from its depot in the real start, and in the M0 test yard (which has no Willow Ford) from a
// spot inside the yard's east loop, clear of the track.
const TOWN_WILLOW_SPOT = { x: 23.4 * SC, z: -2.0 * SC, yaw: 0 };
function townAnchor(townId) {
  const d = BLD_LAYOUT.find(a => a.id === (townId === 0 ? 'depot' : 'wfdepot'));
  return d ? { x: d.x, z: d.z, yaw: d.yaw || 0 } : TOWN_WILLOW_SPOT;
}
// Local (lx, lz) in a frame at (x, z, yaw) to world, as the buildings section does (local +z faces the front).
function townWorld(at, lx, lz) { const c = Math.cos(at.yaw), s = Math.sin(at.yaw); return { x: at.x + lx * c + lz * s, z: at.z - lx * s + lz * c }; }
let townLotCache = null;
// The lots placed in the world in use: { ...lot, x, z, yaw } (worked out on first use per world, as the buildings
// section comes later in the file).
function townPlaced() {
  const w = typeof worldCur === 'string' ? worldCur : 'yard';
  if (townLotCache && townLotCache.w === w) return townLotCache.list;
  const list = TOWN_LOTS.map(L => { const A = townAnchor(L.townId), o = L[w] || L, p = townWorld(A, o.dx, o.dz); return { ...L, x: p.x, z: p.z, yaw: A.yaw + L.yaw }; });
  townLotCache = { w, list };

}
// Plan rectangles in buildingFootprints()' form (none is flush: all block walking, except at the door spot outside).
function townFootprints() {
  return townPlaced().map(L => {
    const [x0, x1, z0, z1] = TOWN_KINDS[L.kind].ext, p = townWorld(L, (x0 + x1) / 2, (z0 + z1) / 2);
    return { id: L.id, kind: L.kind, x: p.x, z: p.z, w: x1 - x0, d: z1 - z0, yaw: L.yaw, flush: false, town: L.townId, biz: L.biz };
  });
}
const townLotOf = bizId => townPlaced().find(L => L.biz === bizId) || null;
// The door spot of a business (or of a lot): where the player stands to use it, TOWN.DOOR_OUT outside the front.
function townDoor(bizId) {
  const L = typeof bizId === 'object' ? bizId : townLotOf(bizId);
  if (!L) return null;
  const K = TOWN_KINDS[L.kind];
  return townWorld(L, K.door, K.ext[3] + TOWN.DOOR_OUT);
}
// The name board, for the door label: { x, y, z } (null for homes).
function townSignSpot(bizId) {
  const L = townLotOf(bizId), K = L && TOWN_KINDS[L.kind];
  if (!K || !K.sign) return null;
  const p = townWorld(L, K.sign[0], K.sign[2]);

// ---- State ----
// openDays: days of opening stock (TOWN.OPEN_DAYS; the save migration step passes the 10 days of before).
function townNewState(openDays) {
  const days = openDays === undefined ? TOWN.OPEN_DAYS : openDays;
  return { biz: TOWN_BUSINESSES.map(B => {
    const st = { id: B.id, shelf: {}, acc: {}, short: {}, offered: {} };
    for (const c of townGoods(B)) {
      // Opening stock: about `days` days of the year-round rate, at least 1 of anything used year-round.
      const r = B.uses[c] || 0;
      st.shelf[c] = r ? Math.max(1, Math.round(r * days / 7 / 1000)) : 0;
      st.acc[c] = 0; st.short[c] = 0; st.offered[c] = null;
    }
    return st;
  }) };
}
// Delivered items of a good at a business, oldest first.
function townItems(S, bizId, c) { return itemsAt(S, { kind: 'BUSINESS', businessId: bizId }).filter(id => S.items.waybill[id].commodity === c); }
// Stock of a good: the opening shelf plus delivered items not yet used.
function townStock(S, bizId, c) { const st = S.town && S.town.biz[bizId]; return (st && st.shelf[c] || 0) + townItems(S, bizId, c).length; }
// Still coming under offers and open contracts of this business for this good (this period).
function townPending(S, bizId, c) {
  let n = 0;
  for (const k of S.econ ? S.econ.contracts : []) if (k.counterparty === bizId && k.commodity === c && /^(OFFERED|ACTIVE|LATE)$/.test(k.status)) n += Math.max(0, k.quantity - k.delivered);
  return n;
}
// Use one unit: the shelf first, then the oldest delivered item, else it counts as short.
function townUseOne(S, bizId, c, ev) {
  const st = S.town.biz[bizId];
  if (st.shelf[c] > 0) { st.shelf[c] -= 1; return; }
  const ids = townItems(S, bizId, c);
  if (ids.length) { itemConsume(S, ids[0], 'business', ev); return; }
  st.short[c] += 1;
}
// Step 8b of the sim tick: once a game hour, use goods; at 07:00, offer contracts for goods running low.
function townTick(S, ev) {
  if (!S.town || S.time % 3600 !== 0) return;
  const abs = S.time + CFG.DAY_START_S, day = Math.floor(abs / 86400), winter = townWinter(day);
  for (const B of TOWN_BUSINESSES) {
    const st = S.town.biz[B.id];
    for (const c of townGoods(B)) {
      st.acc[c] += townRate(B, c, winter);
      while (st.acc[c] >= TOWN.UNIT) { st.acc[c] -= TOWN.UNIT; townUseOne(S, B.id, c, ev); }
    }
  }
  if (abs % 86400 === TOWN.OFFER_SOD) townOffers(S, day, winter, ev);
}
// Once a day: a business low on a good offers a delivery contract for it (section 10 contracts by telegraph).
function townOffers(S, day, winter, ev) {
  if (!S.econ) return;
  for (const B of TOWN_BUSINESSES) {
    const st = S.town.biz[B.id];
    for (const c of townGoods(B)) {
      const r = townRate(B, c, winter);
      if (!r) continue;
      if (S.econ.contracts.some(k => k.counterparty === B.id && k.commodity === c && k.status === 'OFFERED')) continue;
      if (st.offered[c] !== null && S.time - st.offered[c] < TOWN.OFFER_GAP_S) continue;
      const low = Math.max(1, Math.ceil(r * TOWN.LOW_DAYS / 7 / 1000)), stock = townStock(S, B.id, c), have = stock + townPending(S, B.id, c);
      if (have >= low) continue;
      const quantity = Math.max(1, Math.ceil(r * TOWN.TARGET_DAYS / 7 / 1000) - have);
      // Scarcity (section 10): up to +30% on the delivered price when the business has none.
      const pct = Math.floor(TOWN.SCARCE_PCT * Math.max(0, low - stock) / low);
      const pricePerUnit = Math.round(econDeliveredPrice(S.econ, c, B.townId) * (100 + pct) / 100);
      const due = (day + 1 + TOWN.DUE_DAYS) * 86400 - CFG.DAY_START_S;
      const res = contractOffer(S, { kind: 'DELIVERY', counterparty: B.id, commodity: c, quantity, due, pricePerUnit }, ev);
      if (res.ok) st.offered[c] = S.time;
    }
  }
}

// ---- Delivery at the door (section 9 "Local delivery") ----
// Why this business will not take this item, in plain words, or null when it will.
function townDeliverWhy(S, id, bizId) {
  const B = townBiz(bizId);
  if (!B || !townLotOf(bizId)) return 'There is no such business here';
  const I = S.items;
  if (!Number.isInteger(id) || id < 0 || id >= I.next || !I.alive[id]) return 'There is no such item';
  const wb = I.waybill[id], k = wb.consignee, what = COMMODITIES[wb.commodity] ? COMMODITIES[wb.commodity].name.toLowerCase() : 'this';
  if (k.kind === 'BUSINESS' && k.id === bizId) return null;

function townUseCmd(S, c, ev) {

// After a put-down (carrying calls this): an item put down at a business door is handed over. The economy pays

function townAfterCarry(S, a, ev) {

  let id = null;
  for (let i = ev.length - 1; i >= 0; i--) if (ev[i].t === 'carryPut') { id = ev[i].id; break; }
  const biz = a.dest.businessId, w = id === null ? null : S.items.where[id];
  if (!w || w.kind !== 'BUSINESS' || w.businessId !== biz) return;

  const held = carryHeld(S), d = townDoor(biz), P = S.player;
  if (held.length && !townDeliverWhy(S, held[held.length - 1], biz) && Math.hypot(d.x - P.x, d.z - P.z) <= CFG.REACH) P.act = { k: 'put', dest: { kind: 'BUSINESS', businessId: biz }, left: CFG.CARRY_S };

// Shape check for the saved towns (used when a save is loaded). Throws on damage.
function townCheckSaveShape(st) {

  if (!T || !Array.isArray(T.biz) || T.biz.length !== TOWN_BUSINESSES.length) bad();
  T.biz.forEach((b, i) => {
    if (!b || b.id !== i || !b.shelf || !b.acc || !b.short || !b.offered) bad();
    for (const c of townGoods(TOWN_BUSINESSES[i])) if (!int(b.shelf[c]) || b.shelf[c] < 0 || !int(b.acc[c]) || !int(b.short[c]) || !(b.offered[c] === null || int(b.offered[c]))) bad();
