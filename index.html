<style>

<script>
'use strict';

// ==== Section: config ====
// Tunable numbers, named as in design-doc.md. Units: u (world units), game minutes, game seconds.
const CFG = {
  SCHEMA_VERSION: 1,
  SEED: 1866,
  TICK_GAME_S: 8,            // one sim tick = 8 game seconds (section 19)
  TICKS_PER_REAL_S: 10,      // at 1x
  DAY_START_S: 5 * 3600,     // the game starts at 05:00
  WALK: 2.25, RUN: 3.5,      // player speeds, u per game minute (section 4)
  ACCEL_K: 2.0,              // a = 2.0 x power / mass, u/min^2 (section 7)
  BRAKE: 3.0,                // u/min^2
  TENDER_FIRST: 0.6,         // speed cap factor running tender-first
  LOCO_MAX: 4.0,             // mainline maximum
  LIM: { main: 4.0, yard: 1.0, diverge: 1.5 },
  STOP_GAP: 0.5,             // trains stop 0.5u before a block they may not enter
  THROW_S: 30,               // throwing a switch takes 0.5 game minutes
  DIVERGE_PENALTY: 20,       // route cost per diverging switch
  REACH: 1.5,                // interactables are in reach within 1.5u
  GEOM: { main: { minR: 12, revStraight: 3 }, yard: { minR: 8, revStraight: 2 } },
  GAUGE_HALF: 0.38,
  ZOOM_MIN: 0.6, ZOOM_MAX: 4, VIEW_MIN_U: 14,
  ISO_EL: Math.atan(1 / Math.SQRT2), // 35.264 degrees
  CAM_LAG_S: 0.2,
  HOLD_MS: 220, TAP_MOVE_PX: 10,
  MAP_HALF: 60,
};
const DT_MIN = CFG.TICK_GAME_S / 60; // one tick in game minutes

// ==== Section: random numbers (seeded) ====
// sfc32. The state is four 32-bit integers kept inside the game state, so saves resume the same sequence.
function rngSeed(seed) {
  const st = [0x9e3779b9 | 0, 0x243f6a88 | 0, 0xb7e15162 | 0, seed | 0];
  for (let i = 0; i < 15; i++) rngNext(st);
  return st;
}
function rngNext(st) {
  let a = st[0], b = st[1], c = st[2], d = st[3];
  let t = (a + b) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11);
  d = (d + 1) | 0; t = (t + d) | 0; c = (c + t) | 0;
  st[0] = a; st[1] = b; st[2] = c; st[3] = d;
  return (t >>> 0) / 4294967296;
}

// ==== Section: track graph ====
// Nodes joined by straight or arc edges (section 6). A train position is {e, s, d}:
// edge id, distance from node A, and d = +1 facing towards B or -1 facing towards A.
function trackNew() { return { nodes: [], edges: [], switches: [] }; }
function trackNode(T, x, z) { const id = T.nodes.length; T.nodes.push({ id, x, z }); return id; }
function trackStraight(T, a, b, cls, lim) {
  const A = T.nodes[a], B = T.nodes[b], id = T.edges.length;
  T.edges.push({ id, a, b, k: 'S', len: Math.hypot(B.x - A.x, B.z - A.z), cls, lim });
  return id;
}
// Arc starting at node a with heading (hx,hz). turn = +1 or -1 picks the side; deg is the sweep.
// If endNode is given the arc must land on it (checked by the validator).
function trackArc(T, a, hx, hz, R, turn, deg, cls, lim, endNode) {
  const A = T.nodes[a];
  const cx = A.x + R * hz * turn, cz = A.z - R * hx * turn;
  const th0 = Math.atan2(A.z - cz, A.x - cx), sweep = -turn * deg * Math.PI / 180, th1 = th0 + sweep;
  const b = endNode !== undefined ? endNode : trackNode(T, cx + R * Math.cos(th1), cz + R * Math.sin(th1));
  const id = T.edges.length;
  T.edges.push({ id, a, b, k: 'A', cx, cz, R, th0, sweep, len: R * Math.abs(sweep), cls, lim });
  const sg = sweep > 0 ? 1 : -1;
  return { e: id, node: b, hx: -Math.sin(th1) * sg, hz: Math.cos(th1) * sg };
}
// Point and tangent (pointing from A towards B) at distance s along edge E.
function edgeAt(T, E, s) {
  if (E.k === 'S') {
    const A = T.nodes[E.a], B = T.nodes[E.b], f = E.len ? s / E.len : 0;
    return { x: A.x + (B.x - A.x) * f, z: A.z + (B.z - A.z) * f, tx: (B.x - A.x) / E.len, tz: (B.z - A.z) / E.len };
  }
  const th = E.th0 + E.sweep * s / E.len, sg = E.sweep > 0 ? 1 : -1;
  return { x: E.cx + E.R * Math.cos(th), z: E.cz + E.R * Math.sin(th), tx: -Math.sin(th) * sg, tz: Math.cos(th) * sg };
}
// Tangent pointing out of a node along the edge.
function outTangent(T, E, node) {
  if (node === E.a) { const p = edgeAt(T, E, 0); return { x: p.tx, z: p.tz }; }
  const p = edgeAt(T, E, E.len); return { x: -p.tx, z: -p.tz };
}
// A switch on node `node`: trunk edge, through (normal) leg and diverging (reverse) leg.
function trackSwitch(T, node, trunk, normal, reverse) {
  const id = T.switches.length, N = T.nodes[node];
  const h = outTangent(T, T.edges[normal], node);
  const rev = T.edges[reverse], far = rev.a === node ? T.nodes[rev.b] : T.nodes[rev.a];
  const px = -h.z, pz = h.x, side = Math.sign((far.x - N.x) * px + (far.z - N.z) * pz) || 1;
  // The stand sits beside the trunk end, on the side away from the diverging leg.
  const sx = N.x - h.x * 0.4 - px * side * 1.3, sz = N.z - h.z * 0.4 - pz * side * 1.3;
  T.switches.push({ id, node, trunk, normal, reverse, state: 'N', lockedBy: null,
    stand: { x: sx, z: sz, hx: h.x, hz: h.z, ux: sx - px * side * 0.65, uz: sz - pz * side * 0.65 } });
  return id;
}

// Derived lookups (not saved): edges per node, switch per node, blocks.
const trackIndexCache = new WeakMap();
function trackIndex(T) {
  let ix = trackIndexCache.get(T);
  if (ix) return ix;
  ix = { nodeEdges: T.nodes.map(() => []), nodeSw: {}, legSw: {}, block: [] };
  for (const E of T.edges) { ix.nodeEdges[E.a].push(E.id); ix.nodeEdges[E.b].push(E.id); }
  for (const W of T.switches) { ix.nodeSw[W.node] = W.id; ix.legSw[W.normal] = W.id; ix.legSw[W.reverse] = W.id; }
  // Blocks: every switch (its two legs) is a block; other runs of edges joined by plain nodes form one block each.
  let nb = 0;
  for (const W of T.switches) { ix.block[W.normal] = nb; ix.block[W.reverse] = nb; nb++; }
  for (const E of T.edges) {
    if (ix.block[E.id] !== undefined) continue;
    const stack = [E.id]; ix.block[E.id] = nb;
    while (stack.length) {
      const cur = T.edges[stack.pop()];
      for (const n of [cur.a, cur.b]) {
        if (ix.nodeSw[n] !== undefined || ix.nodeEdges[n].length !== 2) continue;
        for (const o of ix.nodeEdges[n]) if (ix.block[o] === undefined && ix.legSw[o] === undefined) { ix.block[o] = nb; stack.push(o); }
      }
    }
    nb++;
  }
  ix.blockCount = nb;
  trackIndexCache.set(T, ix);
  return ix;
}

// Which edge comes next when leaving edge `fromE` through node `node`, following the switches as set.
function nextEdge(T, node, fromE) {
  const ix = trackIndex(T), swId = ix.nodeSw[node];
  if (swId !== undefined) {
    const W = T.switches[swId];
    if (fromE === W.trunk) return { e: W.state === 'N' ? W.normal : W.reverse };
    const want = fromE === W.normal ? 'N' : 'R';
    if (W.state !== want) return { blocked: 'against', sw: swId };
    return { e: W.trunk };
  }
  for (const o of ix.nodeEdges[node]) if (o !== fromE) return { e: o };
  return { blocked: 'end' };
}
function reversePos(p) { return { e: p.e, s: p.s, d: -p.d }; }
// Move a position `dist` along the track in its facing direction.
// Returns the new position, how far it got, and why it stopped early (if it did).
function trackWalk(T, pos, dist, collect) {
  let e = pos.e, s = pos.s, d = pos.d, left = dist;
  for (let guard = 0; guard < 1000; guard++) {
    const E = T.edges[e], avail = d > 0 ? E.len - s : s;
    if (left <= avail + 1e-12) {
      const s2 = s + d * left;
      if (collect) collect.push([e, Math.min(s, s2), Math.max(s, s2)]);
      return { pos: { e, s: s2, d }, moved: dist, blocked: null };
    }
    if (collect) collect.push([e, d > 0 ? s : 0, d > 0 ? E.len : s]);
    left -= avail;
    const node = d > 0 ? E.b : E.a, nx = nextEdge(T, node, e);
    if (nx.blocked) return { pos: { e, s: d > 0 ? E.len : 0, d }, moved: dist - left, blocked: nx.blocked, sw: nx.sw };
    const E2 = T.edges[nx.e];
    e = nx.e; d = E2.a === node ? 1 : -1; s = d > 0 ? 0 : E2.len;
  }
  return { pos: { e, s, d }, moved: dist - left, blocked: 'end' };
}
// Look ahead from a position: distance to the first place the train must stop, and speed limits on the way.
function trackScan(T, pos, maxDist) {
  let e = pos.e, s = pos.s, d = pos.d, run = 0;
  const limits = [];
  for (let guard = 0; guard < 1000; guard++) {
    const E = T.edges[e], avail = d > 0 ? E.len - s : s;
    limits.push({ at: run, lim: E.lim });
    run += avail;
    if (run >= maxDist) return { stop: Infinity, reason: null, limits };
    const node = d > 0 ? E.b : E.a, nx = nextEdge(T, node, e);
    if (nx.blocked) return { stop: Math.max(0, run - CFG.STOP_GAP), reason: nx.blocked, sw: nx.sw, limits };
    // Entering a switch from the far end of one of its legs: if the switch is set for the other leg,
    // stop before the switch's block, so the train never stands on a switch it cannot pass.
    const ix = trackIndex(T), legSw = ix.legSw[nx.e];
    if (legSw !== undefined && T.switches[legSw].node !== node && e !== T.switches[legSw].trunk) {
      const W = T.switches[legSw];
      if ((W.state === 'N' ? W.normal : W.reverse) !== nx.e) return { stop: Math.max(0, run - CFG.STOP_GAP), reason: 'against', sw: legSw, limits };
    }
    const E2 = T.edges[nx.e];
    e = nx.e; d = E2.a === node ? 1 : -1; s = d > 0 ? 0 : E2.len;
  }
  return { stop: Infinity, reason: null, limits };
}
// Nearest point on any edge to (x, z). Used for taps on the track.
function trackNearest(T, x, z) {
  let best = null;
  for (const E of T.edges) {
    const n = Math.max(2, Math.ceil(E.len / 0.2));
    for (let i = 0; i <= n; i++) {
      const s = E.len * i / n, p = edgeAt(T, E, s), dd = (p.x - x) ** 2 + (p.z - z) ** 2;
      if (!best || dd < best.dd) best = { e: E.id, s, dd, x: p.x, z: p.z };
    }
  }
  if (best) best.dist = Math.sqrt(best.dd);
  return best;
}

// ==== Section: track validation ====
// Checks the rules of section 6: exact arc ends, smooth joints (G1), switch shape, curve radius,
// and the straight needed between reverse curves. Returns a list of problems (empty = valid).
function trackValidate(T) {
  const errs = [], ix = trackIndex(T);
  const near = (a, b) => Math.abs(a - b) < 1e-6;
  for (const E of T.edges) {
    const A = T.nodes[E.a], B = T.nodes[E.b];
    const p0 = edgeAt(T, E, 0), p1 = edgeAt(T, E, E.len);
    if (!near(p0.x, A.x) || !near(p0.z, A.z)) errs.push(`edge ${E.id}: start is off node ${E.a}`);
    if (!near(p1.x, B.x) || !near(p1.z, B.z)) errs.push(`edge ${E.id}: end is off node ${E.b}`);
    if (E.k === 'A') {
      if (!near(E.len, E.R * Math.abs(E.sweep))) errs.push(`edge ${E.id}: arc length is not exact`);
      const g = CFG.GEOM[E.cls];
      if (g && E.R < g.minR - 1e-9) errs.push(`edge ${E.id}: radius ${E.R} is below the ${E.cls} minimum ${g.minR}`);
    }
  }
  for (const N of T.nodes) {
    const list = ix.nodeEdges[N.id];
    if (list.length > 3) errs.push(`node ${N.id}: ${list.length} edges (crossings are not built yet)`);
    const sw = ix.nodeSw[N.id];
    if (list.length === 2 && sw === undefined) {
      const t1 = outTangent(T, T.edges[list[0]], N.id), t2 = outTangent(T, T.edges[list[1]], N.id);
      if (t1.x * t2.x + t1.z * t2.z > -1 + 1e-9) errs.push(`node ${N.id}: edges do not meet smoothly`);
    }
    if (list.length === 3 && sw === undefined) errs.push(`node ${N.id}: three edges but no switch`);
    if (sw !== undefined) {
      const W = T.switches[sw];
      const tt = outTangent(T, T.edges[W.trunk], N.id), tn = outTangent(T, T.edges[W.normal], N.id), tr = outTangent(T, T.edges[W.reverse], N.id);
      if (tt.x * tn.x + tt.z * tn.z > -1 + 1e-9) errs.push(`switch ${W.id}: trunk and through leg do not line up`);
      if (tn.x * tr.x + tn.z * tr.z < 1 - 1e-9) errs.push(`switch ${W.id}: legs do not leave in the same direction`);
    }
  }
  // Reverse curves: two arcs that turn opposite ways need a straight of at least revStraight between them.
  const turnAt = (E, node) => (E.k !== 'A' ? 0 : (E.a === node ? Math.sign(E.sweep) : -Math.sign(E.sweep)));
  const otherEnd = (E, node) => (E.a === node ? E.b : E.a);
  for (const N of T.nodes) {
    const list = ix.nodeEdges[N.id];
    if (list.length !== 2 || ix.nodeSw[N.id] !== undefined) continue;
    const E1 = T.edges[list[0]], E2 = T.edges[list[1]];
    if (E1.k === 'A' && E2.k === 'A' && turnAt(E1, N.id) === turnAt(E2, N.id)) errs.push(`node ${N.id}: reverse curves with no straight between`);
  }
  for (const E of T.edges) {
    if (E.k !== 'S') continue;
    const ends = [E.a, E.b].map(n => {
      const l = ix.nodeEdges[n].filter(o => o !== E.id);
      if (l.length !== 1) return null;
      const O = T.edges[l[0]];
      return O.k === 'A' ? { O, n } : null;
    });
    if (!ends[0] || !ends[1]) continue;
    // Turning sense when travelling A -> B through the straight: compare arc turn at both ends.
    const t1 = -turnAt(ends[0].O, ends[0].n), t2 = turnAt(ends[1].O, ends[1].n);
    const g = CFG.GEOM[E.cls] || CFG.GEOM.yard;
    if (t1 !== t2 && E.len < g.revStraight - 1e-9) errs.push(`edge ${E.id}: ${E.len.toFixed(2)}u straight between reverse curves (minimum ${g.revStraight})`);
  }
  return errs;
}

// ==== Section: test yard layout ====
// An oval main line (radius 14 ends) with a passing siding on the south side (switches 0 and 1)
// and a dead-end spur off the north side (switch 2). Switch legs follow section 6:
// through leg straight 5u, diverging leg radius 10u, 30 degrees.
function buildTestYard() {
  const T = trackNew(), L = CFG.LIM;
  const n0 = trackNode(T, -20, 14), s1 = trackNode(T, -12, 14), s1t = trackNode(T, -7, 14);
  const s2t = trackNode(T, 7, 14), s2 = trackNode(T, 12, 14), n1 = trackNode(T, 20, 14);
  const n2 = trackNode(T, 20, -14), s3 = trackNode(T, -4, -14), s3t = trackNode(T, -9, -14), n3 = trackNode(T, -20, -14);
  const eW = trackStraight(T, n0, s1, 'main', L.main);
  const e1t = trackStraight(T, s1, s1t, 'switch', L.main);
  trackStraight(T, s1t, s2t, 'main', L.main);
  const e2t = trackStraight(T, s2t, s2, 'switch', L.main);
  const eE = trackStraight(T, s2, n1, 'main', L.main);
  trackArc(T, n1, 1, 0, 14, 1, 180, 'main', L.main, n2);
  const eN = trackStraight(T, n2, s3, 'main', L.main);
  const e3t = trackStraight(T, s3, s3t, 'switch', L.main);
  trackStraight(T, s3t, n3, 'main', L.main);
  trackArc(T, n3, -1, 0, 14, 1, 180, 'main', L.main, n0);
  // Passing siding, built from both switches towards the middle.
  const d1 = trackArc(T, s1, 1, 0, 10, -1, 30, 'switch', L.diverge);
  const a1 = trackNode(T, T.nodes[d1.node].x + d1.hx * 2, T.nodes[d1.node].z + d1.hz * 2);
  trackStraight(T, d1.node, a1, 'yard', L.yard);
  const b1 = trackArc(T, a1, d1.hx, d1.hz, 8, 1, 30, 'yard', L.yard);
  const d2 = trackArc(T, s2, -1, 0, 10, 1, 30, 'switch', L.diverge);

// ==== Section: game state ====

      route: null, status: 'Stopped', consist: CONSIST_NO1.map(c => ({ ...c })) }],

// ==== Section: routes ====
// Shortest way for the train's leading end to reach a point, without reversing (section 8: A* over the
// track graph, cost = length plus 20u for each diverging switch). Returns the switch settings it needs.
function findRoute(T, start, target) {
  const ix = trackIndex(T);

    return { cost: Math.abs(target.s - start.s), dist: Math.abs(target.s - start.s), needs: [] };
  }
  const open = [], seen = new Set();
  const first = start.d > 0 ? E0.len - start.s : start.s;
  open.push({ cost: first, dist: first, e: start.e, d: start.d, needs: [] });
  let best = null;
  while (open.length) {
    open.sort((p, q) => p.cost - q.cost || p.e - q.e || p.d - q.d);
    const cur = open.shift();
    if (best && cur.cost >= best.cost) break;
    const key = cur.e + ':' + cur.d;
    if (seen.has(key)) continue;
    seen.add(key);
    const E = T.edges[cur.e], node = cur.d > 0 ? E.b : E.a, swId = ix.nodeSw[node];
    const options = [];

        options.push({ e: W.reverse, need: { sw: swId, state: 'R' }, extra: CFG.DIVERGE_PENALTY });
      } else {
        options.push({ e: W.trunk, need: { sw: swId, state: cur.e === W.normal ? 'N' : 'R' }, extra: 0 });

        if (!best || cand.cost < best.cost) best = cand;

      open.push({ cost: cur.cost + op.extra + E2.len, dist: cur.dist + E2.len, e: op.e, d: d2, needs });
    }

// ==== Section: commands ====

    case 'walkDir':

      else { P.mode = 'dir'; P.a = c.a; P.run = !!c.run; }
      break;
    case 'useSwitch': {
      const W = T.switches[c.sw];

      P.mode = 'to'; P.tx = W.stand.ux; P.tz = W.stand.uz; P.use = { k: 'sw', id: c.sw }; P.act = null; P.run = false;
      break;

// ==== Section: trains ====
function trainTick(S, tr, ev) {

    const lead = leadPos(T, tr, tr.m);

    const sc = trackScan(T, lead, look);
    stop = sc.stop; reason = sc.reason; sw = sc.sw;
    if (tr.mode === 'route' && tr.route.left < stop) { stop = tr.route.left; reason = 'target'; }
    vTarget = CFG.LOCO_MAX * (tr.m < 0 ? CFG.TENDER_FIRST : 1);
    // Speed limits on the track under the train and ahead of it.
    for (const [e] of trainSegs(T, tr)) vTarget = Math.min(vTarget, T.edges[e].lim);
    for (const l of sc.limits) vTarget = Math.min(vTarget, Math.sqrt(l.lim * l.lim + 2 * CFG.BRAKE * l.at));
    vTarget = Math.min(vTarget, Math.sqrt(2 * CFG.BRAKE * stop));
  }
  if (tr.mode === 'stop' || tr.mode === 'idle') tr.v = Math.max(0, tr.v - CFG.BRAKE * DT_MIN); // ordinary braking
  else if (tr.v < vTarget) tr.v = Math.min(vTarget, tr.v + accel * DT_MIN);

  if (ds > 0) {
    if (tr.m > 0) tr.front = trackWalk(T, tr.front, ds).pos;
    else {
      const rear = trackWalk(T, leadPos(T, tr, -1), ds).pos;
      tr.front = trackWalk(T, reversePos(rear), L).pos;
    }
    if (tr.route) {
      tr.route.left = Math.max(0, tr.route.left - ds);
      const done = tr.route.total - tr.route.left;
      const occ = occupiedSwitches(S);
      for (const lk of tr.route.locks) {
        const W = T.switches[lk.sw];

  } else if (tr.mode === 'run' || tr.mode === 'route') {

    tr.status = (tr.mode === 'route' ? 'On its way, ' : 'Running ') + dir;
  } else if (tr.mode === 'idle' && tr.status !== 'Arrived') tr.status = 'Stopped';
}

// ==== Section: player ====
// Rough footprint test: is (x, z) inside a vehicle (plus the player's own radius)?
function insideTrain(poses, x, z) {

    const fx = Math.cos(p.yaw), fz = -Math.sin(p.yaw), dx = x - p.x, dz = z - p.z;

  }

}

function trainApproach(poses, x, z) {

    const fx = Math.cos(p.yaw), fz = -Math.sin(p.yaw);
    let t = (x - p.x) * fx + (z - p.z) * fz;
    t = Math.max(-p.len / 2, Math.min(p.len / 2, t));
    const cx = p.x + fx * t, cz = p.z + fz * t, dd = Math.hypot(x - cx, z - cz);

}

  }

// ==== Section: sim tick ====
// One fixed step of 8 game seconds, in the system order of section 19 (the parts built so far).
function simTick(S, cmds) {
  const ev = [];
  for (const c of cmds) applyCommand(S, c, ev);         // 1. commands
  S.tick += 1; S.time += CFG.TICK_GAME_S;               // 2. time
  for (const tr of S.trains) trainTick(S, tr, ev);      // 3-4. dispatch and train motion
  const poseCache = {};
  for (const tr of S.trains) poseCache[tr.id] = trainPoses(S.track, tr);
  playerTick(S, ev, poseCache);                         // 7. actors

}

  const byTick = {};
  for (const s of script || []) (byTick[s.tick] = byTick[s.tick] || []).push(s.cmd);
  for (let i = 0; i < ticks; i++) simTick(S, byTick[S.tick] || []);

}

  const season = ['Spring', 'Summer', 'Autumn', 'Winter'][Math.floor(day / 14) % 4];

// ==== Section: saving ====
// The whole state as JSON with a schema version, gzipped, in IndexedDB. Old saves pass through migrate().
const SAVE_KEY = 'auto';
function migrate(save) {

  return save;

    r.onupgradeneeded = () => r.result.createObjectStore('saves');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });

async function idbDo(mode, fn) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('saves', mode), req = fn(tx.objectStore('saves'));
    tx.oncomplete = () => { db.close(); res(req && req.result); };
    tx.onerror = () => { db.close(); rej(tx.error); };

}
async function saveWrite(obj) {
  const json = JSON.stringify(obj);
  let rec = { gz: false, data: json };
  if (typeof CompressionStream !== 'undefined') {
    const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    rec = { gz: true, data: buf };
  }
  await idbDo('readwrite', st => st.put(rec, SAVE_KEY));
}
async function saveRead() {
  const rec = await idbDo('readonly', st => st.get(SAVE_KEY));
  if (!rec) return null;
  const json = rec.gz
    ? await new Response(new Blob([rec.data]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
    : rec.data;
  return migrate(JSON.parse(json));
}

// ==== Section: models (procedural, low-poly) ====

const PAL = { grass: '#8a9f55', dirt: '#7a5a3a', rail: '#55534f', tie: '#5b4128', wall: '#b9875a', trim: '#6e4426',
  roof: '#7d3424', loco: '#2e2d30', brass: '#c69a2c', red: '#9e3a26', glass: '#3b3a3a', win: '#ffcf73', trunk: '#5d4027',
  skin: '#d9a77e', shirt: '#e6dcc4', vest: '#3b302a', navy: '#25324a', trousers: '#4b4237', hair: '#4a3222', boot: '#2a2522',
  green: '#3f8a3a' };

      const yb = 0.03 + lift;

        quad(rails, off(p, a, y1), off(q, a, y1), off(q, b, y1), off(p, b, y1));

  view.discMat = { N: new THREE.MeshStandardMaterial({ color: PAL.green, flatShading: true, roughness: 0.8 }),

    const d = new THREE.Mesh(cyl(0.16, 0.16, 0.04, 10), view.discMat[W.state]);

}

function groundAt(px, py) {

  return raycaster.ray.intersectPlane(groundPlane, out) ? out : null;
}
function toScreen(x, y, z) {
  const v = new THREE.Vector3(x, y, z).project(camera);
  return { x: (v.x + 1) / 2 * window.innerWidth, y: (1 - v.y) / 2 * window.innerHeight };
}
// What did a tap at (px, py) hit? Switch stands and the train are picked on screen with a thumb-sized margin.
function pickAt(px, py) {
  let best = null;
  for (const W of S.track.switches) {
    const p = toScreen(W.stand.x, 0.6, W.stand.z), d = Math.hypot(p.x - px, p.y - py);
    if (d < 34 && (!best || d < best.d)) best = { k: 'sw', id: W.id, d };
  }
  if (best) return best;
  raycaster.setFromCamera(ndc(px, py), camera);
  const hits = raycaster.intersectObjects(view.trainGroup.children, false);
  if (hits.length) return { k: 'tr', id: hits[0].object.userData.train };
  return null;
}
function onTap(px, py) {
  const g = groundAt(px, py);
  if (ui.sendMode) {
    if (!g) return;
    const n = trackNearest(S.track, g.x, g.z);
    if (n && n.dist < 1.2) { send({ t: 'trainSendTo', tr: ui.panelTrain, e: n.e, s: Math.round(n.s * 1000) }); setSendMode(false); }
    else toast('Tap closer to a track.');
    return;
  }
  const hit = pickAt(px, py);
  if (hit && hit.k === 'sw') { send({ t: 'useSwitch', sw: hit.id }); return; }
  if (hit && hit.k === 'tr') { send({ t: 'useTrain', tr: hit.id }); return; }
  if (g) {
    send({ t: 'walkTo', x: Math.round(g.x * 100), z: Math.round(g.z * 100) });
    view.ring.position.set(g.x, 0.05, g.z); view.ring.visible = true; view.ringArmed = true;

}

    const v = [...ptrs.values()], d = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y);
    const mx = (v[0].x + v[1].x) / 2, my = (v[0].y + v[1].y) / 2;
    if (pinch.d > 0) cam.zoom = Math.max(CFG.ZOOM_MIN, Math.min(CFG.ZOOM_MAX, cam.zoom * d / pinch.d));
    panBy(mx - pinch.mx, my - pinch.my);
    pinch.d = d; pinch.mx = mx; pinch.my = my;
  }
});
function pointerEnd(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (hold && hold.id === e.pointerId) {
    if (hold.on) stopHoldWalk();
    else if (e.type === 'pointerup') onTap(hold.x, hold.y);
    hold = null;
  }
  if (ptrs.size < 2) pinch = null;
}
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', pointerEnd);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = Math.max(CFG.ZOOM_MIN, Math.min(CFG.ZOOM_MAX, cam.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1))); }, { passive: false });
function panBy(dx, dy) {
  const wpp = (camera.right - camera.left) / window.innerWidth, s = Math.sin(CFG.ISO_EL);
  const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw), fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
  cam.ox += -rx * dx * wpp + fx * dy * wpp / s;
  cam.oz += -rz * dx * wpp + fz * dy * wpp / s;
}
function angleCode(dx, dz) { return ((Math.round(Math.atan2(dz, dx) / (Math.PI * 2) * 256) % 256) + 256) % 256; }
function sendDir(a, run) {
  const key = a === null ? 'stop' : a + (run ? 'r' : '');
  if (key === sentDir) return;
  sentDir = key; send({ t: 'walkDir', a, run: !!run });
}
function stopHoldWalk() { sendDir(null); sentDir = null; }
// Called every frame: while a finger is held down, walk towards it.
function updateHoldWalk() {
  if (hold && !hold.on && performance.now() - hold.t0 > CFG.HOLD_MS) hold.on = true;
  if (hold && hold.on) {
    view.ring.visible = false;
    const g = groundAt(hold.x, hold.y);
    if (g) {
      const dx = g.x - S.player.x, dz = g.z - S.player.z;
      if (Math.hypot(dx, dz) > 0.3) sendDir(angleCode(dx, dz), false);
      else sendDir(null);
    }
    return;
  }
  // Keyboard: W A S D relative to the view, Shift to run.
  let kx = 0, kz = 0;
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  if (keys.has('KeyW')) { kx += fx; kz += fz; }
  if (keys.has('KeyS')) { kx -= fx; kz -= fz; }
  if (keys.has('KeyD')) { kx += rx; kz += rz; }
  if (keys.has('KeyA')) { kx -= rx; kz -= rz; }
  if (kx || kz) { keyDir = true; view.ring.visible = false; sendDir(angleCode(kx, kz), keys.has('ShiftLeft') || keys.has('ShiftRight')); }
  else if (keyDir) { keyDir = null; stopHoldWalk(); }
}
const keys = new Set();
window.addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'KeyZ') cam.yawIdx -= 1;
  if (e.code === 'KeyX') cam.yawIdx += 1;
  if (e.code === 'KeyC') { cam.ox = 0; cam.oz = 0; }
  if (e.code === 'Space') { e.preventDefault(); setSpeed(speed > 0 ? 0 : lastSpeed); }
  if (e.code === 'Digit1') setSpeed(1);
  if (e.code === 'Digit2') setSpeed(2);
  if (e.code === 'Digit3') setSpeed(4);
  if (e.code === 'Escape') closePanel();
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

// ==== Section: drawing each frame ====
const lerp = (a, b, f) => a + (b - a) * f;
function lerpAngle(a, b, f) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * f; }
let lastFrame = performance.now(), animT = 0;
function render(alpha, dt) {
  animT += dt;
  // Arrow keys look away from the player.
  const pan = 12 * dt * 60;
  if (keys.has('ArrowLeft')) panBy(pan, 0); if (keys.has('ArrowRight')) panBy(-pan, 0);
  if (keys.has('ArrowUp')) panBy(0, pan); if (keys.has('ArrowDown')) panBy(0, -pan);
  // Trains.
  S.trains.forEach((tr, ti) => view.train[ti].forEach((m, vi) => {
    const a = prevPoses[ti][vi], b = curPoses[ti][vi];
    m.position.set(lerp(a.x, b.x, alpha), 0, lerp(a.z, b.z, alpha));
    m.rotation.y = lerpAngle(a.yaw, b.yaw, alpha);
  }));
  // Player.
  const P = S.player, pl = view.player, u = pl.userData;
  const px = lerp(prevPlayer.x, P.x, alpha), pz = lerp(prevPlayer.z, P.z, alpha);
  const moved = Math.hypot(px - pl.position.x, pz - pl.position.z);
  pl.position.set(px, 0, pz);
  pl.rotation.y = lerpAngle(pl.rotation.y, P.f, 1 - Math.exp(-dt * 12));
  u.phase += moved * 0.6 * Math.PI * 2;
  const walking = moved > 1e-4;
  u.swing = lerp(u.swing || 0, walking ? 1 : 0, 1 - Math.exp(-dt * 10));
  const sw = Math.sin(u.phase) * u.swing;
  u.legL.rotation.x = sw * 25 * Math.PI / 180; u.legR.rotation.x = -sw * 25 * Math.PI / 180;
  u.armL.rotation.x = -sw * 20 * Math.PI / 180; u.armR.rotation.x = sw * 20 * Math.PI / 180;
  if (P.act) { u.armR.rotation.x = -1.2 + Math.sin(animT * 4) * 0.25; u.armL.rotation.x = -1.0; }
  u.body.position.y = Math.abs(Math.sin(u.phase)) * 0.02 * u.swing;
  pl.scale.y = 1 + Math.sin(animT * 0.35 * Math.PI * 2) * 0.015 * (1 - u.swing);
  // The tap marker shows until the walk it started ends.
  if (view.ringArmed && P.mode === 'to') view.ringArmed = false;
  if (!view.ringArmed && (P.mode !== 'to' || P.use)) view.ring.visible = false;
  // Switch discs.
  S.track.switches.forEach((W, i) => { view.discs[i].material = view.discMat[W.state]; });
  // Camera: follow the player with a soft lag, ease the 90-degree turns.
  const k = 1 - Math.exp(-dt / CFG.CAM_LAG_S);
  cam.fx += (px - cam.fx) * k; cam.fz += (pz - cam.fz) * k;
  cam.yaw += (camYawTarget() - cam.yaw) * (1 - Math.exp(-dt * 10));
  placeCamera();
  applyDaylight(S, dt);
  updateCrowd(dt);
  debugUpdate(dt);
  renderer.render(scene, camera);
}

// ==== Section: main loop ====
function frame(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.25); lastFrame = now;
  updateHoldWalk();
  if (speed > 0) {
    acc += dt * speed * CFG.TICKS_PER_REAL_S;
    let n = Math.floor(acc); acc -= n;
    n = Math.min(n, 40);
    for (let i = 0; i < n; i++) doTick();
  }
  render(speed > 0 ? acc : 1, dt);
  updateHud();
  window.__railhead.drawCalls = renderer.info.render.calls;
  requestAnimationFrame(frame);
}
async function saveGame() {
  try { await saveWrite({ state: S, ui: { yawIdx: cam.yawIdx, zoom: cam.zoom, speed: lastSpeed } }); return true; }
  catch (e) { console.warn('Save failed:', e && e.message); return false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveGame(); });
window.addEventListener('pagehide', () => { saveGame(); });

// ==== Section: test hooks ====
// Read by the check scripts in tests/. Also handy in the browser console.
window.__railhead = {
  ready: false, drawCalls: 0, threeRevision: THREE.REVISION,
  get state() { return S; },
  hash: st => stateHash(st || S),
  send, setSpeed, saveGame,
  step(n) { for (let i = 0; i < n; i++) doTick(); },
  newState, simRun, simTick, stateHash, trackValidate, trackNew, trackNode, trackStraight, trackArc, trackSwitch, trackNearest, trackWalk, edgeAt, findRoute, trainPoses, trainLength,
  switchLockReason, occupiedSwitches, migrate,
  toScreen: (x, z, y) => toScreen(x, y || 0, z),
  exportSave: () => JSON.stringify({ state: S, ui: { yawIdx: cam.yawIdx, zoom: cam.zoom, speed: lastSpeed } }),
  importSave(json) { const sv = migrate(JSON.parse(json)); S = sv.state; buildWorld(S); buildActors(S); resetViewsFromState(); return stateHash(S); },
  camera: cam,
};

// ==== Section: start ====
(async () => {
  try {
    const sv = await saveRead();
    if (sv) {
      S = sv.state;
      if (sv.ui) { cam.yawIdx = sv.ui.yawIdx || 0; cam.yaw = camYawTarget(); cam.zoom = sv.ui.zoom || 1; lastSpeed = sv.ui.speed || 1; }
    }
  } catch (e) { console.warn('Could not load the save, starting fresh:', e && e.message); }
  buildWorld(S); buildActors(S); resetViewsFromState();
  buildCrowd(); buildToolInit(); debugInit();
  setSpeed(new URLSearchParams(location.search).has('paused') ? 0 : lastSpeed); // ?paused is used by the checks
  resize();
  window.__railhead.ready = true;
  requestAnimationFrame(frame);
})();
</script>
