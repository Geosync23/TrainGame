<title>Railhead M1 Questions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column of waybill-like question slips, a sticky save bar at the foot. */
:root {
  --paper: #f3f1ea; --slip: #fffdf7; --ink: #262420; --muted: #6c675c;
  --rule: #d9d3c4; --brass: #8a6418; --brass-soft: #f1e4c4; --ok: #2f6b3a;
  --f-display: "Zilla Slab", Georgia, serif;
  --f-body: "Source Sans 3", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1b1a17; --slip: #24221e; --ink: #ece7db; --muted: #a39d8f;
  --rule: #3a372f; --brass: #d9aa4f; --brass-soft: #3a3020; --ok: #7bc187; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1b1a17; --slip: #24221e; --ink: #ece7db; --muted: #a39d8f;
  --rule: #3a372f; --brass: #d9aa4f; --brass-soft: #3a3020; --ok: #7bc187; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-body); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 120px; display: grid; gap: 16px; }
h1 { font: 700 1.9rem/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); }
.lead a { color: var(--brass); }
#qs { display: grid; gap: 16px; }
.slip { background: var(--slip); border: 1px solid var(--rule); border-radius: 4px; padding: 16px; display: grid; gap: 12px; }
.no { font: 500 .75rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--brass); }
.q { font: 500 1.15rem/1.3 var(--f-display); margin: 0; text-wrap: balance; }
.ctx { margin: 0; color: var(--muted); font-size: .92rem; }
.opts { display: grid; gap: 8px; border: 0; margin: 0; padding: 0; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 12px; min-height: 48px; box-sizing: border-box;
  border: 1px solid var(--rule); border-radius: 4px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--brass); background: var(--brass-soft); }
.opt input { margin-top: 4px; accent-color: var(--brass); width: 18px; height: 18px; flex: none; }
.opt span { min-width: 0; }
.tag { font: 500 .7rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--brass);
  border: 1px solid var(--brass); border-radius: 3px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
label.note { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
textarea { font: 16px/1.4 var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule);
  border-radius: 4px; padding: 8px 10px; min-height: 48px; resize: vertical; box-sizing: border-box; width: 100%; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--slip); border-top: 1px solid var(--rule);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar-in { max-width: 640px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
#status { font: 500 .8rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
#status.ok { color: var(--ok); }
button { font: 600 1rem var(--f-body); min-height: 48px; padding: 0 20px; border-radius: 4px; border: 0;
  background: var(--brass); color: var(--slip); cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
</style>

<div class="wrap">
  <h1>Railhead M1: your answers</h1>
  <p class="lead">Ten questions from the <a href="https://claude.ai/artifact/GbucAqeiKB7imWD2TRYZsu" target="_blank" rel="noopener">M1 plan</a>. Pick an option for each and add a note if you like. My suggestion is marked. Answers save on this page as you go.</p>
  <div id="qs"></div>
</div>
<div class="bar"><div class="bar-in"><span id="status">Connecting...</span><button id="save" type="button">Save answers</button></div></div>

<script>
const QS = [
  { id: 'approve', q: 'Do you approve the M1 plan, so rounds B to D can start in that order?', ctx: 'B: hand-building, larger platform, interchange. C: money, Willow Ford, town, passengers. D: panels, tutorial, acceptance check.',
    o: [['yes', 'Yes, start round B', 1], ['changes', 'Yes, with the changes in my note'], ['talk', 'Not yet, let us talk first']] },
  { id: 'review', q: 'How do you want to review M1?', ctx: 'M1 has four rounds of work.',
    o: [['round', 'Once per round (4 reviews)', 1], ['piece', 'After every piece'], ['end', 'Once, at the end of M1']] },
  { id: 'pace', q: 'How long should hand-building a 20u siding take at 1x speed?', ctx: 'Set a tie 0.5, drop a rail pair 1, drive a spike 1.3 game minutes. A game minute is 0.75 real seconds.',
    o: [['5', 'About 5 real minutes', 1], ['10', 'Slower: about 10 minutes, more of a job'], ['2', 'Faster: about 2 minutes']] },
  { id: 'taps', q: 'How does the player work along a job?',
    o: [['one', 'One tap keeps working until done or out of materials; tap anywhere to stop', 1], ['each', 'One tap for each tie, rail and spike']] },
  { id: 'spikes', q: 'How many spikes are shown per tie?',
    o: [['4', '4, two on each rail, as on real track', 1], ['2', '2, simpler to look at']] },
  { id: 'help', q: 'Can the player hand the building work to someone before M3?',
    o: [['no', 'No: alone in M1, crews come in M3 and M4', 1], ['hand', 'Yes: one hired hand in M1']] },
  { id: 'hills', q: 'Can a plan that needs earthwork (amber) be built in M1?',
    o: [['no', 'No, the hub is flat; earthwork comes in M4', 1], ['shovel', 'Yes, the player shovels it']] },
  { id: 'platform', q: 'How big should the new hub platform be?', ctx: 'Today 12u by 1.6u. Train No. 1 is 10.8u long; the engine plus 4 cars is about 17u.',
    o: [['20', '20u long, 2.4u deep, canopy over the middle 10u', 1], ['24', '24u long, 2.4u deep'], ['other', 'Another size (in my note)']] },
  { id: 'cross', q: 'Where may the player cross track on foot?',
    o: [['any', 'Anywhere in M1, as in M0; revisit in M2', 1], ['crossings', 'Only at crossings and platform ends, as the design doc says']] },
  { id: 'else', q: 'Anything else you want changed or added?', o: [] },
];
const answers = {};
const qsEl = document.getElementById('qs'), statusEl = document.getElementById('status'), saveBtn = document.getElementById('save');
QS.forEach((Q, i) => {
  const s = document.createElement('section'); s.className = 'slip';
  const no = document.createElement('div'); no.className = 'no'; no.textContent = 'Question ' + (i + 1);
  const h = document.createElement('h2'); h.className = 'q'; h.id = 'q-' + Q.id; h.textContent = Q.q;
  s.append(no, h);
  if (Q.ctx) { const p = document.createElement('p'); p.className = 'ctx'; p.textContent = Q.ctx; s.append(p); }
  if (Q.o.length) {
    const fs = document.createElement('fieldset'); fs.className = 'opts'; fs.setAttribute('aria-labelledby', h.id);
    for (const [v, label, sug] of Q.o) {
      const l = document.createElement('label'); l.className = 'opt';
      const r = document.createElement('input'); r.type = 'radio'; r.name = Q.id; r.value = v; r.id = Q.id + '-' + v;
      r.addEventListener('change', () => { setA(Q.id, 'choice', v); });
      const t = document.createElement('span'); t.textContent = label;
      if (sug) { const g = document.createElement('span'); g.className = 'tag'; g.textContent = 'Suggested'; t.append(g); }
      l.append(r, t); fs.append(l);
    }
    s.append(fs);
  }
  const nl = document.createElement('label'); nl.className = 'note'; nl.textContent = Q.o.length ? 'Note (optional)' : 'Your answer';
  const ta = document.createElement('textarea'); ta.id = 'note-' + Q.id; ta.rows = 2;
  ta.addEventListener('input', () => setA(Q.id, 'note', ta.value));
  nl.append(ta); s.append(nl); qsEl.append(s);
});
function render() {
  for (const Q of QS) {
    const a = answers[Q.id] || {};
    for (const [v] of Q.o) document.getElementById(Q.id + '-' + v).checked = a.choice === v;
    const ta = document.getElementById('note-' + Q.id);
    if (document.activeElement !== ta) ta.value = a.note || '';
  }
}
let ref = null, dirty = false, saving = false, timer = null;
function setA(id, k, v) { answers[id] = Object.assign({}, answers[id], { [k]: v }); dirty = true; status('Not saved yet'); clearTimeout(timer); timer = setTimeout(save, 1500); }
function status(t, ok) { statusEl.textContent = t; statusEl.className = ok ? 'ok' : ''; }
async function save() {
  if (!ref) { status('Saving is not available here'); return; }
  if (saving) { clearTimeout(timer); timer = setTimeout(save, 800); return; }
  if (!dirty) return;
  saving = true; dirty = false; saveBtn.disabled = true;
  try { await ref.set({ answers, savedAt: Date.now() }); status('Saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), true); }
  catch (e) { dirty = true; status('Could not save: ' + ((e && e.message) || 'try again')); }
  finally { saving = false; saveBtn.disabled = false; }
}
saveBtn.addEventListener('click', () => { dirty = true; clearTimeout(timer); save(); });
(async () => {
  const to = setTimeout(() => status('Still connecting; your choices are kept on screen'), 10000);
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  clearTimeout(to);
  if (!db) { status('Saving is not available here'); saveBtn.disabled = true; return; }
  ref = db.doc('answers/m1-plan');
  try {
    const snap = await ref.get();
    if (snap.exists) { const d = snap.data(); if (d && d.answers) for (const k in d.answers) if (!answers[k]) answers[k] = d.answers[k]; render(); status('Loaded your saved answers', true); }
    else status('Nothing saved yet');
  } catch (e) { status('Could not load saved answers'); }
})();
</script>
