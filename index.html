// ==== Section: economy ====
// Owner: M1 package 3 (builder C1). Cash, the Overland market, import orders by telegraph, contracts, the
// credit line and the ledger (design-doc 10, 16, 19, 20, 21). Pure simulation: no three.js, no page elements.
// All money is whole cents; all times are game seconds (S.time, counted from 05:00 on day 1).
//
// S.econ:
//   cash, start      cash on hand and the cash the game started with (cents). cash may go down to ECON.OVERDRAFT.
//   ledger           every money change, oldest first: { t, amount, category, counterparty, ref }
//                    (amount + in, - out; category one of ECON_CATEGORIES; ref { kind, id } or null)
//   loan             what is drawn on the Eastern investors' credit line (cents)
//   market           { buy: { c: cents }, sell: { c: cents }, walk: { c: permille }, history: { c: [buy, ...last 8 weeks] } }
//                    null where a commodity is not traded that way (section 21)
//   orders           import orders waiting for their Overland visit: { id, t, due, lines: [{ c, n, contract }], cost }
//   nextOrder        the next order id
//   contracts        every contract ever offered, index = id: section 20 Contract plus
//                    { period (standing: weeks done), owed (standing: unpaid cents, paid Saturday 18:00),
//                      items (ids of items paid for), offered (time) }; status OFFERED, ACTIVE, LATE, DONE,
//                    CANCELLED, DECLINED or EXPIRED (the last two: an offer turned down or left until its due time)
//   reputation       { townId: 0..100 } (section 10)
//
// The money rule (section 19): cash = start + the sum of the ledger, and loan = the sum of the 'credit' entries.
// econCheckMoney(S) lists any break, like itemCheckConservation. Only econPost changes cash.
//
// API (S the game state, ev the tick's event list or null):
//   econPost(S, amount, category, counterparty, ref, ev)   the one way money changes; event 'money'
//   econCheckMoney(S)                                      -> list of problems (empty when the money adds up)
//   econTelegraphKey()                                     where the telegraph key is (from the depot's layout)
//   econNextVisit(time)                                    the Overland visit an order placed at time rides
//   contractOffer(S, spec, ev)                             a business offers a contract (placeholder towns, C5)
//   contractDeliver(S, itemId, ev)                         an item handed over at a business: pays its contract
//   econLotFee(S, kind, townId, ref, ev)                   lot fees stub: 'HOUSE' $25, 'BUSINESS' $60
//   econSoldOutside(S, itemId, ev)                         an item sold Outside on the Overland's pick-up: pays
// Commands (the player must stand within ECON.TEL_REACH of the telegraph key, except useTelegraph):
//   { t: 'useTelegraph' }                                  walk to the key; event 'reachedTelegraph'
//   { t: 'useDesk' }                                       walk to the office desk (D13); event 'reachedDesk'
//   (every other economy command also works within ECON.TEL_REACH of the office desk)
//   { t: 'econOrder', lines: [{ c, n, contract? }] }       order goods for the next Overland visit (pay on order)
//   { t: 'contractAccept', id }, { t: 'contractDecline', id }
//   { t: 'creditDraw', amount }, { t: 'creditRepay', amount }   cents
// Events: money, reachedTelegraph, econRefused { why }, orderPlaced, orderDelivered, contractOffered,
//   contractAccepted, contractDeclined, contractExpired, contractDelivered, contractLate, contractCancelled,
//   contractPaid, creditDrawn, creditRepaid, marketMoved, interestPaid.
// Provisional numbers (DEV_NOTES "Economy"): order lead 6 game hours, at most 6 cars of orders a visit,
// Willow Ford 12 miles from the hub, starting offers due by the end of their day.
const ECON = {
  START_CASH: 250000, CREDIT_LIMIT: 500000, CREDIT_PERMILLE_WEEK: 10, OVERDRAFT: -50000,
  LOT_FEE: { HOUSE: 2500, BUSINESS: 6000 },
  ORDER_LEAD_S: 6 * 3600, ORDER_MAX_CARS: 6, ORDER_MAX_LINE: 99, ORDER_MAX_LINES: 40,
  TEL_REACH: 3,
  LATE_PCT_DAY: 10, LATE_PCT_MAX: 50, CANCEL_DAYS: 5,
  REP_START: 50, REP_ON_TIME: 2, REP_LATE: -4, REP_CANCEL: -10,
  WALK_STEP: 50, PRICE_MIN: 700, PRICE_MAX: 1400, HISTORY_WEEKS: 8,
  DAY_S: 86400, WEEK_S: 7 * 86400, PAYDAY_SOD: 18 * 3600,
};
const ECON_CATEGORIES = ['delivered', 'haulage', 'fares', 'mail', 'lotFees', 'exports', 'imports', 'wages', 'rollingStock',
  'construction', 'land', 'interest', 'upkeep', 'credit'];
const ECON_CATEGORY_NAMES = { delivered: 'Delivered sales', haulage: 'Haulage', fares: 'Fares', mail: 'Mail', lotFees: 'Lot fees',
  exports: 'Sold Outside', imports: 'Imports', wages: 'Wages', rollingStock: 'Rolling stock', construction: 'Construction',
  land: 'Land', interest: 'Interest', upkeep: 'Upkeep', credit: 'Credit line' };
// The businesses are the town section's (TOWN_BUSINESSES, builder C5): one list. Ids match the Overland's
// test delivery (business 0 at the hub, 1 at Willow Ford). Town ids are CARGO_TOWNS ids.
const ECON_BUSINESSES = TOWN_BUSINESSES;
const ECON_TOWN_MILES = { 0: 0, 1: 12 };                      // provisional: miles from the hub (MILE_U, 25.6u a mile since D15)
const ECON_OWN_USE = ['ties', 'rails', 'spikes', 'hardware'];  // ordered for our own track work: addressed to construction
// What can be ordered: traded goods that are items (bulk needs gondolas; mail is not bought). Section 21 order.
const ECON_ORDERABLE = Object.keys(COMMODITIES).filter(c => COMMODITIES[c].buy !== null && COMMODITIES[c].type !== 'bulk');
// The starting offers (section 21 "First contracts", one commodity per contract), plus a standing one for
// Willow Ford. due: by the end of that day (day 1 is the first day).
const ECON_START_OFFERS = [
  { kind: 'DELIVERY', counterparty: 0, commodity: 'flour', quantity: 6, dueDay: 2 },
  { kind: 'DELIVERY', counterparty: 0, commodity: 'beans', quantity: 4, dueDay: 2 },
  { kind: 'DELIVERY', counterparty: 2, commodity: 'lumber', quantity: 8, dueDay: 4 },
  { kind: 'DELIVERY', counterparty: 2, commodity: 'nails', quantity: 2, dueDay: 4 },
  { kind: 'STANDING', counterparty: 1, commodity: 'coffee', quantity: 2, dueDay: 7, repeatWeeks: 4 },
];
const econBiz = id => ECON_BUSINESSES.find(b => b.id === id) || null;
const econTownName = id => { const t = CARGO_TOWNS.find(t => t.id === id); return t ? t.name : 'town ' + id; };
// "$2,500.00", "-$5.25".
function econMoney(c) {
  const a = Math.abs(c), d = Math.floor(a / 100), s = String(d).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (c < 0 ? '-$' : '$') + s + '.' + String(a % 100).padStart(2, '0');
}
// A game time as words: "Mon 18:00", or "end of Tue" for midnight.
function econWhen(time) {
  const abs = time + CFG.DAY_START_S, sod = abs % ECON.DAY_S, wd = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  if (sod === 0) return 'end of ' + wd[(Math.floor(abs / ECON.DAY_S) + 6) % 7];
  return wd[Math.floor(abs / ECON.DAY_S) % 7] + ' ' + String(Math.floor(sod / 3600)).padStart(2, '0') + ':' + String(Math.floor(sod % 3600 / 60)).padStart(2, '0');
}

// ---- The market (section 10 "The Overland market") ----
// Seasons as in clockText: 14 days each, spring first. Factors in permille.
function econSeasonPermille(c, day, side) {
  const season = Math.floor(day / 14) % 4;
  if (side === 'buy' && season === 3 && ['flour', 'beans', 'meat', 'cordwood'].includes(c)) return 1100;
  if (side === 'buy' && season === 0 && c === 'lumber') return 1100;
  if (side === 'sell' && season === 2 && c === 'grain') return 1200;
  return 1000;
}
function econPrice(base, season, walk) {
  if (base === null) return null;
  const p = Math.round(base * season * walk / 1e6);
  return Math.max(Math.round(base * ECON.PRICE_MIN / 1000), Math.min(Math.round(base * ECON.PRICE_MAX / 1000), p));
}
function econMarketSet(M, day) {
  for (const c of Object.keys(COMMODITIES).sort()) {
    const C = COMMODITIES[c];
    M.buy[c] = econPrice(C.buy, econSeasonPermille(c, day, 'buy'), M.walk[c]);
    M.sell[c] = econPrice(C.sell, econSeasonPermille(c, day, 'sell'), M.walk[c]);
  }
}
// Each Monday at 00:00: a random walk of up to 5% of base per commodity (the game's seeded numbers, in
// commodity order), the season's factor, kept within 70% to 140% of base; 8 weeks of buy prices kept.
function econMarketMove(S, day, ev) {
  const M = S.econ.market;
  for (const c of Object.keys(COMMODITIES).sort()) {
    const d = Math.round((rngNext(S.rng) * 2 - 1) * ECON.WALK_STEP);
    M.walk[c] = Math.max(ECON.PRICE_MIN, Math.min(ECON.PRICE_MAX, M.walk[c] + d));
  }
  econMarketSet(M, day);
  for (const c of Object.keys(COMMODITIES).sort()) if (M.buy[c] !== null) {
    M.history[c].push(M.buy[c]);
    if (M.history[c].length > ECON.HISTORY_WEEKS) M.history[c].shift();
  }
  if (ev) ev.push({ t: 'marketMoved' });
}
// Delivered price offered (section 10): buy x (1.25 + 0.03 x miles from the hub), to the cent. (Scarcity: C5.)
function econDeliveredPrice(E, c, townId) {
  const buy = E.market.buy[c] !== null && E.market.buy[c] !== undefined ? E.market.buy[c] : COMMODITIES[c].sell || 0;
  return Math.round(buy * (125 + 3 * (ECON_TOWN_MILES[townId] || 0)) / 100);
}

// ---- State ----
// A fresh economy at game time `time` (0 for a new game; an old save's time when it is migrated).
function econNewState(time) {
  time = time || 0;
  const day = Math.floor((time + CFG.DAY_START_S) / ECON.DAY_S);
  const M = { buy: {}, sell: {}, walk: {}, history: {} };
  for (const c of Object.keys(COMMODITIES).sort()) M.walk[c] = 1000;
  econMarketSet(M, day);
  for (const c of Object.keys(COMMODITIES).sort()) if (M.buy[c] !== null) M.history[c] = [M.buy[c]];
  const E = { cash: ECON.START_CASH, start: ECON.START_CASH, ledger: [], loan: 0, market: M, orders: [], nextOrder: 0,
    contracts: [], reputation: {} };
  for (const t of CARGO_TOWNS) E.reputation[t.id] = ECON.REP_START;
  for (const o of ECON_START_OFFERS) {
    econAddContract(E, time, { kind: o.kind, counterparty: o.counterparty, commodity: o.commodity, quantity: o.quantity,
      due: (day + o.dueDay) * ECON.DAY_S - CFG.DAY_START_S, repeatWeeks: o.repeatWeeks || 1 });
  }
  return E;
}
function econAddContract(E, time, s) {
  const b = econBiz(s.counterparty);
  const k = { id: E.contracts.length, kind: s.kind, counterparty: s.counterparty, townId: b.townId, commodity: s.commodity,
    quantity: s.quantity, pricePerUnit: s.pricePerUnit !== undefined ? s.pricePerUnit : econDeliveredPrice(E, s.commodity, b.townId),
    due: s.due, repeatWeeks: s.repeatWeeks || 1, period: 0, delivered: 0, status: 'OFFERED', owed: 0, items: [], offered: time };
  E.contracts.push(k);
  return k;
}
// A business offers a contract (for the placeholder towns, C5). spec: { kind: 'DELIVERY' | 'STANDING',
// counterparty (business id), commodity, quantity, due (game seconds), repeatWeeks?, pricePerUnit? (cents) }.
function contractOffer(S, s, ev) {
  const why = !s || !['DELIVERY', 'STANDING'].includes(s.kind) ? 'unknown kind of contract'
    : !econBiz(s.counterparty) ? 'no such business' : !COMMODITIES[s.commodity] || COMMODITIES[s.commodity].type === 'bulk' ? 'not an item commodity'
    : !Number.isInteger(s.quantity) || s.quantity < 1 ? 'bad quantity' : !Number.isInteger(s.due) || s.due <= S.time ? 'bad due time'
    : s.repeatWeeks !== undefined && !(Number.isInteger(s.repeatWeeks) && s.repeatWeeks >= 1) ? 'bad number of weeks'
    : s.pricePerUnit !== undefined && !(Number.isInteger(s.pricePerUnit) && s.pricePerUnit >= 0) ? 'bad price' : null;
  if (why) return { ok: false, why };
  const k = econAddContract(S.econ, S.time, { ...s, repeatWeeks: s.kind === 'STANDING' ? s.repeatWeeks || 1 : 1 });
  if (ev) ev.push({ t: 'contractOffered', id: k.id });
  return { ok: true, id: k.id };
}

// ---- Money ----
function econPost(S, amount, category, counterparty, ref, ev) {
  if (!Number.isInteger(amount) || amount === 0) return;
  const E = S.econ;
  E.cash += amount;
  E.ledger.push({ t: S.time, amount, category, counterparty, ref: ref || null });
  if (ev) ev.push({ t: 'money', amount, category });
}
function econCheckMoney(S) {
  const E = S.econ, out = [];
  if (!E || typeof E !== 'object') return ['no economy state'];
  if (!Number.isInteger(E.cash) || !Number.isInteger(E.start)) return ['cash is not a whole number of cents'];
  if (!Array.isArray(E.ledger)) return ['no ledger'];
  let sum = 0, credit = 0;
  E.ledger.forEach((L, i) => {
    if (!L || !Number.isInteger(L.amount) || L.amount === 0) { out.push('ledger entry ' + i + ' has no whole-cent amount'); return; }
    if (!ECON_CATEGORIES.includes(L.category)) out.push('ledger entry ' + i + ' has an unknown category (' + L.category + ')');
    if (typeof L.counterparty !== 'string' || !L.counterparty) out.push('ledger entry ' + i + ' has no counterparty');
    if (!Number.isInteger(L.t)) out.push('ledger entry ' + i + ' has no time');
    else if (i && E.ledger[i - 1] && L.t < E.ledger[i - 1].t) out.push('ledger entry ' + i + ' is out of time order');
    sum += L.amount;
    if (L.category === 'credit') credit += L.amount;
  });
  if (E.cash !== E.start + sum) out.push(`cash ${econMoney(E.cash)} is not the starting cash plus the ledger (${econMoney(E.start + sum)})`);
  if (!Number.isInteger(E.loan) || E.loan !== credit) out.push(`the credit line owed (${E.loan}) is not the sum of the credit entries (${credit})`);
  if (E.loan < 0 || E.loan > ECON.CREDIT_LIMIT) out.push('the credit line is outside 0 to ' + econMoney(ECON.CREDIT_LIMIT));
  for (const k of E.contracts || []) if (!Number.isInteger(k.owed) || k.owed < 0) out.push('contract ' + k.id + ' owes a bad amount');
  return out;
}
// Lot fees (stub, section 10): a building completed in a town you founded pays $25 (house) or $60 (business).
// Nothing calls it yet (towns grow in M2).
function econLotFee(S, kind, townId, ref, ev) {
  const fee = ECON.LOT_FEE[kind];
  if (!fee) return { ok: false, why: 'lot fees are for a HOUSE or a BUSINESS' };
  econPost(S, fee, 'lotFees', econTownName(townId), ref || null, ev);
  return { ok: true, amount: fee };
}
// An item sold Outside on the Overland's pick-up (called after itemConsume 'soldOutside'): the market's sell
// price (a part-used bundle pays for its pieces). Returns the cents paid.
function econSoldOutside(S, id, ev) {
  if (!S.econ) return 0;
  const wb = S.items.waybill[id], p = S.econ.market.sell[wb.commodity];
  if (!p) return 0;
  const M = typeof JOB_MAT !== 'undefined' && JOB_MAT[wb.commodity];
  const amount = wb.pieces !== undefined && M ? Math.round(p * wb.pieces / M.per) : p;
  econPost(S, amount, 'exports', 'Overland market', { kind: 'item', id }, ev);
  return amount;
}

// ---- The telegraph key and import orders ----
// The key is in the depot's agent's office bay; the player works it from the platform in front of the bay
// window. Worked out from the depot's layout (buildings section), so it moves with the depot.
// x, z: where the player stands; wx, wy, wz: the bay window (the spot to tap).
// When the buildings section gives use spots (buildingSpots(), builder C2), the hub depot's 'telegraph' spot is
// used; otherwise the spot is worked out from the depot's footprint (the layout before C2).
function econTelegraphKey() {
  const at = BLD_LAYOUT.find(a => a.id === 'depot'), ext = BLD_EXTENTS.depot, c = Math.cos(at.yaw || 0), s = Math.sin(at.yaw || 0);
  const w = (lx, lz) => ({ x: at.x + lx * c + lz * s, z: at.z - lx * s + lz * c });
  const sp = typeof buildingSpots === 'function' ? buildingSpots().find(p => p.building === 'depot' && p.kind === 'telegraph') : null;
  const stand = sp ? { x: sp.x, z: sp.z } : w(0.4 * SC, ext[3] + 0.37); // 0.37: just outside the walk grid's block, as C2's spot
  // The bay window, 0.44u back from the standing spot towards the building (local -z).
  return { x: stand.x, z: stand.z, wx: stand.x - 0.44 * s, wy: 1.05 * SC, wz: stand.z - 0.44 * c };
}
// The office desk (D13, builder D1): the hub depot's 'desk' use spot from buildingSpots(), else worked out from the
// depot's layout. x, z: where the player stands; wx, wy, wz: the depot wall behind it (the spot to tap).
function econDeskSpot() {
  const at = BLD_LAYOUT.find(a => a.id === 'depot'), ext = BLD_EXTENTS.depot, c = Math.cos(at.yaw || 0), s = Math.sin(at.yaw || 0);
  const sp = typeof buildingSpots === 'function' ? buildingSpots().find(p => p.building === 'depot' && p.kind === 'desk') : null;
  const stand = sp ? { x: sp.x, z: sp.z } : { x: at.x - 1.3 * SC * c + (ext[3] + 0.52) * s, z: at.z + 1.3 * SC * s + (ext[3] + 0.52) * c };
  return { x: stand.x, z: stand.z, wx: stand.x - 0.44 * s, wy: 1.05 * SC, wz: stand.z - 0.44 * c };
}
// Economy commands work from the telegraph key or from the office desk (D13): within r of either.
function econAtKey(S, r) {
  const k = econTelegraphKey(), d = econDeskSpot(), P = S.player, R = r || ECON.TEL_REACH;
  return Math.hypot(P.x - k.x, P.z - k.z) <= R || Math.hypot(P.x - d.x, P.z - d.z) <= R;
}
function econAtDesk(S, r) { const d = econDeskSpot(), P = S.player; return Math.hypot(P.x - d.x, P.z - d.z) <= (r || ECON.TEL_REACH); }
function econRefuse(ev, why) { if (ev) ev.push({ t: 'econRefused', why }); return { ok: false, why }; }
// The visit an order placed at `time` rides: the first 06:00 or 18:00 at least ECON.ORDER_LEAD_S away.
function econNextVisit(time) {
  const abs = time + CFG.DAY_START_S;
  for (let d = Math.floor(abs / ECON.DAY_S); ; d++) for (const v of OVERLAND.DUE) {
    const at = d * ECON.DAY_S + v;
    if (at - abs >= ECON.ORDER_LEAD_S) return at - CFG.DAY_START_S;
  }
}
// Which cars a list of commodities (one per item, in order) needs: long bundles and machinery on flatcars,
// everything else in boxcars, first fit. Returns [{ k, units: [index into the list] }].
function econPack(list) {
  const cars = [];
  list.forEach((c, i) => {
    const type = COMMODITIES[c].type, k = type === 'longBundle' || type === 'machinery' ? 'flatcar' : 'boxcar', R = CARGO_CAR_RULES[k], cost = R.cost[type];
    let car = cars.find(x => x.k === k && x.used + cost <= R.cap);
    if (!car) { car = { k, used: 0, units: [] }; cars.push(car); }
    car.used += cost; car.units.push(i);
  });

//          read (true once opened), answered (index of the button tapped, or null), kind, ref }

//   alertsOf(S)   -> the active problems [{ key, k, title, body, x, z }], k one of 'wait' (a train waiting past its

function simTick(S, cmds) {

  for (const c of cmds) applyCommand(S, c, ev);         // 1. commands
  S.tick += 1; S.time += CFG.TICK_GAME_S;               // 2. time

  ttTick(S, ev);                                        // 3. dispatch: timetable trains and reservations (section "timetable")

  for (const tr of S.trains) poseCache[tr.id] = trainPoses(S.track, tr);
  const tel = econTelBefore(S, ev);
  rideActorTick(S, ev, poseCache);                      // 7. actors (the player: riding a train, else walking in playerTick; carrying, job work and train tasks around it)
  econTick(S, ev, tel);                                 // 8. economy: reaching the telegraph key, market Mondays, contracts due
  townTick(S, ev);                                      // 8b. towns: businesses use goods each hour, offer contracts at 07:00
  paxTick(S, ev, poseCache);                            // 8. travellers: arriving, the ticket queue, boarding and stepping off (section "passengers")
  tgTick(S, ev);                                        // 9. telegrams for this tick's events and new alerts (section "telegrams and alerts")
  tutTick(S, ev);                                       // 9b. the investor's tutorial: goals met, the next telegram (section "tutorial")

}
function simRun(S, script, ticks) {
  const byTick = {};

  for (let i = 0; i < ticks; i++) simTick(S, byTick[S.tick] || []);

  return ('0000000' + (h >>> 0).toString(16)).slice(-8);

function clockText(S) {
  const abs = S.time + CFG.DAY_START_S, day = Math.floor(abs / 86400), sec = abs % 86400;
  const wd = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][day % 7];
  const season = ['Spring', 'Summer', 'Autumn', 'Winter'][Math.floor(day / 14) % 4];

// ==== Section: saving ====
// The whole state as JSON with a schema version, gzipped, in IndexedDB. Old saves pass through migrate().

  const st = save.state;
  if (st.schemaVersion === 1) {
    // 1 -> 2 (cargo): every car gets a stock id, and the game gets an empty item store and the default bay tags.
    let id = 0;
    if (Array.isArray(st.trains)) for (const tr of st.trains) if (tr && Array.isArray(tr.consist)) for (const c of tr.consist) if (c && typeof c === 'object') c.id = id++;

    st.tools = carryNewTools(TOOL_PARKS.yard); // saves this old are in the test yard world (see 6 -> 7)
    saveUnscale14(st, { tools: true });        // the spots as they were then: 13 -> 14 grows them again

    // own track, exactly as before (only a new game starts in the real world).

  jobCheckSaveShape(st);

  econCheckSaveShape(st);

// A step cycle (g.ph, 0 to 1) with each leg on the ground for the first f of its half (the left leg from 0, the
// right from 0.5). On the ground the foot stays put: the cycle moves on by the distance walked over the stride
// length (twice the foot's sweep over f), so the stride follows the real ground speed and feet do not slide.
// Off the ground the foot swings forward with an eased curve and lifts (the leg shortens a little: a cheap knee).
// The hips drop a little at each heel strike (twice per cycle); the upper body sways over the standing foot,
// twists against the hips, and leans forward more with speed (and pushing a cart). Starting and stopping blend the
// whole walk in and out (g.sw), so the figure eases into its standing pose. Running (from about 1.15 x walk)
// shortens the time on the ground, adds a small hop, swings the arms harder and holds them a little forward.
// Nothing here touches the game state: it reads distances already drawn.
const GAIT = {
  V_WALK: 2.8,         // u per game minute that counts as a normal walk (the player's CFG.WALK; a run, CFG.RUN 4.4, is 1.57 x)
  AMP0: 0.38, AMP_K: 0.3, AMP_MAX: 0.8, // leg swing either side (radians): AMP0 + AMP_K x speed / V_WALK, at most AMP_MAX
  AMP_MIN: 0.02,       // the smallest swing used for the stride length (only to keep it above 0)
  RUN0: 1.15, RUN1: 1.5, // speed / V_WALK where the gait turns into a run (blend between)
  F_WALK: 0.5, F_RUN: 0.36, // share of each leg's cycle on the ground
  LIFT: 0.1, LIFT_RUN: 0.18, // the swinging leg shortens by this share at mid-swing
  BOB: 0.4,            // share of the straight-leg hip drop kept at heel strike (the rest is a knee's give)
  HOP: 0.035,          // extra rise in a run's flight (u, for a 0.34u leg)

const BLD_FONT = { A: ['111', '101', '111', '101', '101'], B: ['110', '101', '110', '101', '110'], D: ['110', '101', '101', '101', '110'],
  E: ['111', '100', '110', '100', '111'], F: ['111', '100', '110', '100', '100'], H: ['101', '101', '111', '101', '101'],
  I: ['111', '010', '010', '010', '111'], L: ['100', '100', '100', '100', '111'], O: ['111', '101', '101', '101', '111'],
  P: ['110', '101', '110', '100', '100'], R: ['110', '101', '110', '101', '101'], T: ['111', '010', '010', '010', '010'],
  U: ['101', '101', '101', '101', '111'], W: ['101', '101', '101', '111', '101'] };
// Letters as flat dark quads (2 triangles a piece; a letter's pixels joined in runs down its columns or along its rows,
// whichever needs fewer) on the shell, facing out along x (sx), centred at (x, yc, 0), px the pixel size (M1 units).
function bldSignText(b, text, sx, x, yc, px) {
  const cols = text.length * 4 - 1;
  const put = (c0, r0, wc, hr) => b.shell(new THREE.PlaneGeometry(wc * px, hr * px).rotateY(sx * Math.PI / 2), PAL.loco,
    x, yc + (2.5 - r0 - hr / 2) * px, -sx * (c0 + wc / 2 - cols / 2) * px);   // read left to right from outside
  [...text].forEach((ch, k) => {
    const g = BLD_FONT[ch];
    if (!g) return;
    const colRuns = [], rowRuns = [];
    for (let c = 0; c < 3; c++) for (let r = 0; r < 5;) { if (g[r][c] !== '1') { r++; continue; } let e = r; while (e < 5 && g[e][c] === '1') e++; colRuns.push([c, r, 1, e - r]); r = e; }
    for (let r = 0; r < 5; r++) for (let c = 0; c < 3;) { if (g[r][c] !== '1') { c++; continue; } let e = c; while (e < 3 && g[r][e] === '1') e++; rowRuns.push([c, r, e - c, 1]); c = e; }
    for (const [c, r, wc, hr] of (colRuns.length <= rowRuns.length ? colRuns : rowRuns)) put(k * 4 + c, r, wc, hr);
  });
}

function boardPlaces() {

  for (const K of paxStations(S.track)) {

  if (/^No engine/.test(l.state)) return 'No engine';

// ---- Seeded descriptions ----
function crowdHex(hex, rng, dh, dl) {
  const c = new THREE.Color(hex), hsl = {};
  c.getHSL(hsl);
  c.setHSL((hsl.h + (rngNext(rng) - 0.5) * 2 * dh + 1) % 1, hsl.s, Math.max(0, Math.min(1, hsl.l + (rngNext(rng) - 0.5) * 2 * dl)));
  return (Math.round(c.r * 255) << 16) | (Math.round(c.g * 255) << 8) | Math.round(c.b * 255);
}
function crowdPick(rng, arr) { return arr[Math.floor(rngNext(rng) * arr.length) % arr.length]; }
// Person i always gets the same look, whatever the crowd size. Roles follow section 17's hats:
// visor cap railroad staff, kepi conductor, slouch laborer, bowler merchant or banker, bonnet women, none children.
function crowdDescribe(i) {

  const child = kit === 'chunky' && rngNext(rng) < 0.22;          // about 10% of everyone
  const woman = kit !== 'stocky' && rngNext(rng) < (child ? 0.5 : 0.45);
  const v = hex => crowdHex(hex, rng, 4 / 360, 0.06);              // per-person shift: hue 4 degrees, lightness 6%
  const num = hex => parseInt(hex.slice(1), 16);
  let mask = 0, role, top, low, hat = 0, acc = 0;
  const skin = crowdPick(rng, CPAL.skin);
  let hair = crowdPick(rng, CPAL.hair);
  if (kit === 'lanky' && !woman && rngNext(rng) < 0.35) hair = CPAL.hair[5];
  if (woman) {
    role = child ? 'girl' : 'townswoman';
    mask |= bit(G.SKIRT);
    if (kit === 'lanky') { top = v(crowdPick(rng, ['#4a2a3a', '#2a3a4a', '#3a3a3a', '#5a4a3a', '#4a3a52'])); low = top; }
    else {
      top = v(crowdPick(rng, ['#e6dcc4', '#b9c4cc', '#c9a0a0', '#a8b48a', '#d8c08a']));
      low = v(crowdPick(rng, ['#5a3a4a', '#3a4a5a', '#6b5232', '#7a3a30', '#4a5a3a', '#2f3a52']));
    }
    if (!child && rngNext(rng) < 0.6) { mask |= bit(G.BONNET); hat = v(crowdPick(rng, ['#e4d6b6', '#d8c8a0', '#efe7d4', '#c9b48a', '#8a5a4a'])); }
    else mask |= bit(G.HAIRC) | bit(G.BUN);
  } else {
    mask |= bit(G.LEGS);
    if (kit === 'chunky') {
      top = v(crowdPick(rng, ['#e6dcc4', '#e6dcc4', '#b9c4cc', '#d8c08a', '#ece8de']));
      if (child) { role = 'boy'; low = v(crowdPick(rng, [PAL.trousers, '#5a4a38', '#3e3a36'])); mask |= bit(G.HAIRC); }
      else {
        const rr = rngNext(rng);
        role = rr < 0.4 ? 'staff' : rr < 0.65 ? 'merchant' : 'townsman';
        mask |= bit(G.MALE);
        if (rngNext(rng) < 0.6) mask |= bit(G.MUST);
        if (role === 'staff') { mask |= bit(G.CAP) | bit(G.BADGE) | bit(G.ARMBAND); hat = acc = low = num(PAL.navy); }
        else {
          acc = v(crowdPick(rng, [PAL.vest, '#4a3a2c', '#2f3a2e', '#4a4038']));
          low = v(crowdPick(rng, [PAL.trousers, '#3e3a36', '#5a4a38']));
          if (role === 'merchant') { mask |= bit(G.BOWL); hat = v(crowdPick(rng, ['#2a2522', '#3b302a', '#5a4232'])); }
          else mask |= bit(G.HAIRC);
        }
      }
    } else if (kit === 'lanky') {
      role = rngNext(rng) < 0.45 ? 'conductor' : 'banker';
      mask |= bit(G.MALE);
      const fb = rngNext(rng);
      if (fb < 0.45) mask |= bit(G.BEARD) | bit(G.MUST); else if (fb < 0.75) mask |= bit(G.MUST);
      if (role === 'conductor') { mask |= bit(G.CAP); top = hat = low = num(PAL.navy); }
      else {
        mask |= bit(G.BOWL);
        top = v(crowdPick(rng, ['#2a2624', '#3b302a', '#4a4a52', '#5a4232']));
        hat = v(crowdPick(rng, ['#1f1c1a', '#2a2522', '#3b302a']));
        low = v(crowdPick(rng, [PAL.trousers, '#2f2c2a', '#5a5a5e']));
      }
    } else {
      role = 'laborer';
      top = v(crowdPick(rng, [CPAL.flannel, CPAL.flannel, '#7a4a2e', '#4a5a6a', '#6a6a3a', '#8a3a3a']));
      low = v(crowdPick(rng, ['#3a4256', PAL.trousers, '#4a4a40']));
      if (rngNext(rng) < 0.85) { mask |= bit(G.CAP); hat = v(crowdPick(rng, [CPAL.hat, '#5a4a36', '#7a6646', '#4a3c2c'])); }
      else mask |= bit(G.HAIRC);
      const fb = rngNext(rng);
      if (fb < 0.45) mask |= bit(G.BEARD); else if (fb < 0.7) mask |= bit(G.MUST);
      if (rngNext(rng) < 0.35) mask |= bit(G.TOOL);
    }

  return { kit, role, woman, child, scale: child ? 0.7 : 1, mask, skin: num(skin), hair: num(hair), top, low, hat, acc };
}

// ---- Where walkers go: a coarse grid marking the track ballast, rebuilt when the track changes ----
function crowdGrid() {

      const p = edgeAt(T, E, E.len * i / n), cx = Math.round((p.x - A.x0) / cell), cz = Math.round((p.z - A.z0) / cell);
      for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++) {
        const gx = cx + dx, gz = cz + dz;
        if (gx < 0 || gz < 0 || gx >= w || gz >= h) continue;
        if (Math.hypot(gx * cell + A.x0 - p.x, gz * cell + A.z0 - p.z) <= CROWD.BALLAST) bad[gz * w + gx] = 1;

  const fps = buildingFootprints(), M = 0.3;
  for (let gz = 0; gz < h; gz++) for (let gx = 0; gx < w; gx++) {
    const x = gx * cell + A.x0, z = gz * cell + A.z0;
    // A cell counts as hill if the ground rises anywhere within 0.35u of its centre (cells are 0.5u).
    let no = [[0, 0], [0.35, 0], [-0.35, 0], [0, 0.35], [0, -0.35]].some(([ox, oz]) => !terrainFlatAt(T, x + ox, z + oz));
    for (let k = 0; !no && k < fps.length; k++) {
      const f = fps[k], c = Math.cos(f.yaw), sn = Math.sin(f.yaw), dx = x - f.x, dz = z - f.z;
      no = Math.abs(dx * c - dz * sn) <= f.w / 2 + M && Math.abs(dx * sn + dz * c) <= f.d / 2 + M;
    }
    if (no) bad[gz * w + gx] = 2;

}
// 0 free, 1 track ballast (avoided where possible), 2 building or hill (never entered).

    while (saveNext !== null) {
      const json = saveNext; saveNext = null;
      try { await saveWrite(json); ok = true; } catch (e) { console.warn('Save failed:', e && e.message); ok = false; }
    }
    saveBusy = null;
    return ok;
  })();
  return saveBusy;
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveGame, 2000); }
// Written at once (no gzip, no IndexedDB), so it is complete even if the page closes straight after.
function quickSave() { if (savingOff) return; try { localStorage.setItem(QUICK_KEY, saveJson()); } catch (e) { console.warn('Quick save failed:', e && e.message); } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { quickSave(); saveGame(); } });
window.addEventListener('pagehide', () => { quickSave(); saveGame(); });

  jobSignText: job => jobSignText(S, job), jobSignSpot, jobGeom,
  trackTieCount: () => view.staticGroup.children.reduce((n, o) => n + (o.name === 'trackTies' ? o.count : 0), 0),
  pax: { PAX, paxStations: T => paxStations(T || S.track), paxStation: (id, T) => paxStation(T || S.track, id), paxQueueSlots, paxFare, paxAdd, paxUnstaffed, paxCarsAt, stationDepartures, paxTrainServes, paxDebugScenario, paxNewStore, paxLook, paxPlaceName,
    get view() { return paxView; }, get kits() { return crowd.kits; } },
  jobs: { JOB, JOB_MAT, jobGet, jobNeeds, jobPoint, jobTieAt, jobStepAt, jobPieceTotals, jobDebugScenario, jobNewStore },
  tt: { TT, TT_TEST_STATIONS, FUEL_CAP, ttStations, ttStation, ttBoard, ttRunOf, ttJointAt, ttEngineJoint, ttTenderAt, ttSpout, ttDebugScenario, ttNewState, ttStopNeeds, ttWoodNeedU,
    ttPathBlocks, ttWorkDone, trainObstacle, tenderFirst, trainFacing, trackIndex, get boards() { return ttView; } },
  feet: { bldStandY, bldDeckInside, deckGroundAt, BLD_STEP_R, get playerY() { return view.player.position.y; }, get ringY() { return view.ring.position.y; },
    get actionRingY() { return carryView.ring.position.y; }, get toolYs() { return carryView.tools.map(v => v.g.position.y); } },
  gait: { GAIT, gaitNew, gaitStep, gaitPose, gaitStride, gaitApplyPlayer, get player() { return view.player; } },   // the walk (drawing only)
  ride: { RIDE, rideCarOf: (stock, st) => rideCarOf(st || S, stock), rideAtPlatform, ridePoses, rideDoors, get playerVisible() { return view.player.visible; } },
  // The cutaway (D15): each combine's open side and draw range; the open car, and the player, seated travellers
  // and freight drawn in it, in the car's own frame (x along it, the baggage end +x; z across; y up from the rail line).
  cutaway() {
    const toLocal = (m, x, y, z) => { const v = new THREE.Vector3(x, y, z); m.worldToLocal(v); return [v.x, v.y, v.z]; };
    const cars = Object.entries(view.byStock || {}).filter(([, m]) => m.userData.cut).map(([sid, m]) => {
      const u = m.userData.cut, whole = m.geometry === u.whole, n = u.whole.attributes.position.count;
      // drawn: which parts the mesh's current geometry draws (from its index, or all for the whole geometry)
      const ix = m.geometry.index, has = {};
      if (ix) for (let i = 0; i < ix.count; i++) has[ix.getX(i)] = 1;
      const drawn = {};
      for (const [name, [a, b]] of Object.entries(u.parts)) { let all = true; if (!whole) for (let i = a; i < b && all; i++) if (!has[i]) all = false; drawn[name] = all; }
      return { stock: +sid, side: u.side, end: u.end, whole, drawn, n, visible: m.visible };
    });
    const c = view.cut;
    if (!c) return { cars, cut: null };
    c.m.updateMatrixWorld();
    const pl = view.player, seated = [];
    for (const [id, w] of paxView.w) if (w.sit) {
      const p = S.pax.list.find(q => q.id === id);
      if (p && p.s === 'aboard' && p.car === c.stock) seated.push({ id, local: toLocal(c.m, w.x, w.y + crowd.kits[w.d.kit].legPiv[1] * w.d.scale, w.z) });
    }
    const flat = cargoFlatPoses(S), items = Object.keys(flat).filter(id => { const w = S.items.where[id]; return w && w.stockId === c.stock; }).map(id => ({ id: +id, local: toLocal(c.m, flat[id].x, flat[id].y, flat[id].z) }));
    const toCam = [Math.sin(cam.yaw), Math.cos(cam.yaw)], r = c.m.rotation.y;
    return { cars, cut: { stock: c.stock, open: c.open, end: c.end, nearPlus: Math.sin(r) * toCam[0] + Math.cos(r) * toCam[1] > 0,
      nearEndPlus: Math.cos(r) * toCam[0] - Math.sin(r) * toCam[1] > 0,
      player: { visible: pl.visible, local: toLocal(c.m, pl.position.x, pl.position.y, pl.position.z) }, seated, items, half: [1.35 * WS, 0.475 * WS] } };
  },
  toScreen: (x, z, y) => toScreen(x, y || 0, z),
  // The painted departure boards (D15) and the ticket booths (2026-11-03).
  board: { BOARD, BLD_BOOTH, boardRows, boardState, boardHitAt, ttCardPin, get list() { return boards.list; }, get mesh() { return boards.mesh; },
    get redraws() { return boards.redraws; }, get canvas() { return boards.canvas; }, get card() { return ttCardUi; },
    booths: () => buildingBooths(), walkInBooth, get shell() { return bldShell; } },
  exportSave: () => JSON.stringify({ state: S, ui: { yawIdx: cam.yawIdx, zoom: cam.zoom, speed: lastSpeed } }),
  importSave(json) { const sv = migrate(JSON.parse(json)); S = sv.state; buildWorld(S); buildActors(S); resetViewsFromState(); return stateHash(S); },
  camera: cam,
  world: { WORLDS, HUB, WFORD, STATIONS, TURN_OFF, worldOf, worldId, stationsOf, buildingSpots, buildStartWorld, BLD_LAYOUTS, BLD_EXTENTS,
    get layout() { return BLD_LAYOUT; }, walkGrid, walkGridBuild, terrainHeight, get walk() { return WALK; } },
};

// ==== Section: start ====
// Both saves are read (IndexedDB and the quick save in localStorage); the one with the higher tick wins.
// A save that is damaged, or that fails while the world is built from it, is kept under 'broken-<time>'
// and the next one is tried; if none works the game starts fresh. Only warnings go to the console.
(async () => {
  const found = [];
  try {
    const raw = await saveReadRaw();
    if (raw) {
      try { found.push({ sv: migrate(JSON.parse(raw.json)), keep: () => saveKeepBroken(raw.rec) }); }
      catch (e) { console.warn('The saved game is damaged and was kept as broken-<time>; starting without it:', e && e.message); await saveKeepBroken(raw.rec).catch(() => {}); }
    }
  } catch (e) { console.warn('Could not read the saved game:', e && e.message); }
  const quick = quickRead();
  if (quick) {
    try { found.push({ sv: migrate(JSON.parse(quick)), keep: async () => quickKeepBroken(quick) }); }
    catch (e) { console.warn('The quick save is damaged and was kept as railhead-broken-<time>:', e && e.message); quickKeepBroken(quick); }
  }
  found.sort((a, b) => b.sv.state.tick - a.sv.state.tick);
  let loaded = null;
  for (const f of found) {
    try {
      S = f.sv.state;
      simTick(JSON.parse(JSON.stringify(S)), []); // a trial tick on a copy: throws now rather than in the game loop
      buildWorld(S); buildActors(S); resetViewsFromState();
      loaded = f; break;
    } catch (e) {
      console.warn('Could not build the game from a save; it was kept as broken-<time>:', e && e.message);
      await Promise.resolve(f.keep()).catch(() => {});
    }
  }
  if (loaded) {
    const u = loaded.sv.ui;
    if (u) { cam.yawIdx = u.yawIdx || 0; cam.yaw = camYawTarget(); cam.zoom = u.zoom || 1; lastSpeed = u.speed || 1; }
  } else {
    S = newState(CFG.SEED, PAGE_WORLD);
    buildWorld(S); buildActors(S); resetViewsFromState();
  }
  buildCrowd(); buildToolInit(); debugInit();
  setSpeed(new URLSearchParams(location.search).has('paused') ? 0 : lastSpeed); // ?paused is used by the checks
  resize();
  window.__railhead.ready = true;
  requestAnimationFrame(frame);
})();
