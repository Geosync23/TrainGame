<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Railhead</title>
<style>
  :root { --ink: #2b2118; --paper: #efe7d4; --paper-2: #e2d6ba; --edge: #6e4426; --accent: #9e3a26; --green: #3f6b2c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9d3d8; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: Georgia, "Times New Roman", serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud { position: fixed; z-index: 2; }
  [hidden] { display: none !important; }
  button { font: 600 15px/1 Georgia, serif; color: var(--ink); background: var(--paper); border: 2px solid var(--edge);
    border-radius: 8px; min-width: 48px; min-height: 48px; padding: 0 12px; cursor: pointer; touch-action: manipulation; }
  button:active { background: var(--paper-2); }
  button[aria-pressed="true"] { background: var(--edge); color: var(--paper); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #topleft { left: calc(env(safe-area-inset-left) + 10px); top: calc(env(safe-area-inset-top) + 10px); display: grid; gap: 6px; }
  #clock { background: var(--paper); border: 2px solid var(--edge); border-radius: 8px; padding: 6px 10px; font-size: 15px;
    color: var(--ink); font-variant-numeric: tabular-nums; justify-self: start; }
  #speeds { display: flex; gap: 4px; }
  #speeds button { padding: 0 8px; }
  #bottomleft { left: calc(env(safe-area-inset-left) + 10px); bottom: calc(env(safe-area-inset-bottom) + 10px); display: flex; gap: 8px; }
  #bottomleft svg { width: 26px; height: 26px; display: block; }
  #carry { left: calc(env(safe-area-inset-left) + 10px); bottom: calc(env(safe-area-inset-bottom) + 66px); max-width: min(78vw, 340px);
    box-sizing: border-box; display: flex; gap: 8px; align-items: center; background: var(--paper); border: 2px solid var(--edge);
    border-radius: 8px; padding: 3px 3px 3px 10px; font-size: 15px; color: var(--ink); }
  #carryText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #carryPut { flex: none; }
  #centre { right: calc(env(safe-area-inset-right) + 10px); bottom: calc(env(safe-area-inset-bottom) + 10px); }
  #toast { left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 112px); max-width: min(92vw, 420px);
    background: var(--ink); color: var(--paper); border-radius: 8px; padding: 10px 14px; font-size: 15px; line-height: 1.3;
    pointer-events: none; opacity: 0; transition: opacity .25s; text-align: center; }
  #toast.show { opacity: 1; }
  #toast.below { top: calc(env(safe-area-inset-top) + 184px); } /* under the Send-to banner */
  #panel { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 70px); width: min(94vw, 380px);
    box-sizing: border-box; background: var(--paper); border: 2px solid var(--edge); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
  #panel .row { display: flex; gap: 6px; align-items: center; }
  #panel .grow { flex: 1; }
  #panel h2 { margin: 0; font-size: 18px; color: var(--ink); }
  #panelStatus { font-size: 14px; color: #5a4a3a; min-height: 1.3em; }
  #panel .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #panel .acts button { padding: 0 4px; font-size: 14px; }
  #banner { left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 112px); width: min(94vw, 380px);
    box-sizing: border-box; background: var(--accent); color: #fff; border-radius: 10px; padding: 8px 8px 8px 14px;
    display: flex; gap: 10px; align-items: center; font-size: 15px; }
  #banner span { flex: 1; }
  #buildBtn { right: calc(env(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-top) + 10px); }
  #buildLabel { left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 112px); width: max-content; max-width: min(92vw, 380px);
    box-sizing: border-box; background: var(--paper); color: var(--ink); border: 2px solid var(--edge); border-left-width: 8px;
    border-radius: 8px; padding: 8px 12px; font-size: 15px; line-height: 1.3; text-align: center; pointer-events: none; }
  #buildLabel[data-k="ok"] { border-left-color: var(--green); }
  #buildLabel[data-k="amber"] { border-left-color: #d9952b; }
  #buildLabel[data-k="bad"] { border-left-color: var(--accent); color: var(--accent); }
  #buildConfirm { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 70px); display: flex; gap: 12px; }
  #buildConfirm button { min-height: 56px; min-width: 128px; font-size: 17px; }
  #buildLay { background: var(--edge); color: var(--paper); }
  #buildLay:disabled { opacity: 0.45; cursor: default; }
  #buildConfirm.planOnly { width: max-content; }
  #buildPlanOnly { display: flex; align-items: center; flex: 0 0 auto; width: 200px; min-height: 56px; box-sizing: border-box; padding: 6px 12px;
    background: var(--paper); color: var(--ink); border: 2px solid var(--edge); border-radius: 8px; font-size: 15px; line-height: 1.25; }
  /* The car panel (loading and unloading a set-out car): same place and look as the train panel. */
  #carPanel { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 70px); width: min(94vw, 380px); max-height: 52vh;
    overflow-y: auto; box-sizing: border-box; background: var(--paper); border: 2px solid var(--edge); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
  #carPanel .row { display: flex; gap: 6px; align-items: center; }
  #carPanel .grow { flex: 1; min-width: 0; }
  #carPanel h2 { margin: 0; font-size: 18px; color: var(--ink); }
  #carInfo, #carHeld { font-size: 14px; color: #5a4a3a; }
  #carItems { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  #carItems button { font-size: 14px; padding: 0 6px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jobSign { left: 0; top: 0; z-index: 1; width: max-content; max-width: 250px; box-sizing: border-box; pointer-events: none;
    background: var(--paper); color: var(--ink); border: 2px solid var(--edge); border-left-width: 7px; border-radius: 8px;
    padding: 3px 3px 3px 9px; font-size: 14px; line-height: 1.25; display: flex; gap: 8px; align-items: center; }
  .jobSign .txt { flex: 1 1 auto; min-width: 0; max-width: 150px; }
  .jobSign b { display: block; font-size: 14px; }
  .jobSign span:empty { display: none; }
  .jobSign button { pointer-events: auto; flex: none; font-size: 14px; padding: 0 8px; min-width: 48px; min-height: 48px; max-width: 86px; line-height: 1.1; }
  .jobSign button[data-armed] { background: var(--accent); color: #fff; }
  .jobSign[data-k="need"] { border-left-color: var(--accent); }
  .jobSign[data-k="ready"] { border-left-color: var(--green); }
  .jobSign[data-k="work"] { border-left-color: #c69a2c; }
  /* Passengers (C4): the staffing readout, the departure boards and the ticket window's button. */
  #paxDesk { left: calc(env(safe-area-inset-left) + 10px); bottom: calc(env(safe-area-inset-bottom) + 122px); max-width: min(78vw, 340px);
    box-sizing: border-box; display: flex; gap: 8px; align-items: center; background: var(--paper); border: 2px solid var(--edge);
    border-left: 7px solid var(--green); border-radius: 8px; padding: 3px 3px 3px 10px; font-size: 15px; color: var(--ink); }
  #paxDeskText { flex: 1; min-width: 0; line-height: 1.25; }
  #paxLeave { flex: none; }
  .paxBoard { left: 0; top: 0; z-index: 1; width: max-content; max-width: 220px; box-sizing: border-box; pointer-events: none;
    background: #2f2a24; color: #f3ead2; border: 2px solid var(--edge); border-radius: 6px; padding: 4px 8px; font-size: 13px; line-height: 1.3;
    font-variant-numeric: tabular-nums; }
  .paxBoard b { display: block; font-size: 13px; letter-spacing: 0.02em; }
  .paxBoard .none { color: #cbbf9f; font-style: italic; }
  .paxWin { left: 0; top: 0; z-index: 1; font-size: 14px; padding: 0 10px; white-space: nowrap; border-left-width: 6px; border-left-color: var(--green); }
  @media (orientation: landscape) and (max-height: 500px) {
    #carPanel { left: auto; right: calc(env(safe-area-inset-right) + 10px); transform: none; bottom: calc(env(safe-area-inset-bottom) + 10px); width: 340px; max-height: 76vh; }
    #buildLabel { top: calc(env(safe-area-inset-top) + 10px); max-width: 340px; }
    #buildConfirm { bottom: calc(env(safe-area-inset-bottom) + 10px); }
    #panel { left: auto; right: calc(env(safe-area-inset-right) + 10px); transform: none; bottom: calc(env(safe-area-inset-bottom) + 66px); width: 340px; }
    #toast, #banner { top: calc(env(safe-area-inset-top) + 10px); }
    #toast.below { top: calc(env(safe-area-inset-top) + 82px); }
  }
</style>

<body>
<div id="topleft" class="hud">

  <div id="speeds" role="group" aria-label="Game speed">

</div>

  <button id="rotL" aria-label="Turn view left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 3v5h5"/></svg></button>
  <button id="rotR" aria-label="Turn view right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 3v5h-5"/></svg></button>

<script>
'use strict';

// ==== Section: config ====
// Tunable numbers, named as in design-doc.md. Units: u (world units), game minutes, game seconds.
const CFG = {
  SCHEMA_VERSION: 6,
  SEED: 1866,
  TICK_GAME_S: 8,            // one sim tick = 8 game seconds (section 19)
  TICKS_PER_REAL_S: 10,      // at 1x
  DAY_START_S: 5 * 3600,     // the game starts at 05:00
  WALK: 2.25, RUN: 3.5,      // player speeds, u per game minute (section 4)
  ACCEL_K: 2.0,              // a = 2.0 x power / mass, u/min^2 (section 7)
  BRAKE: 3.0,                // u/min^2
  TENDER_FIRST: 0.6,         // speed cap factor running tender-first
  LOCO_MAX: 4.0,             // mainline maximum
  LIM: { main: 4.0, yard: 1.0, diverge: 1.5, interchange: 2.0 },
  STOP_GAP: 0.5,             // trains stop 0.5u before a block they may not enter
  THROW_S: 30,               // throwing a switch takes 0.5 game minutes
  CARRY_S: 12,               // picking up or putting down an item takes 0.2 game minutes (section 9)
  DIVERGE_PENALTY: 20,       // route cost per diverging switch
  REACH: 1.5,                // interactables are in reach within 1.5u
  GEOM: { main: { minR: 12, revStraight: 3 }, yard: { minR: 8, revStraight: 2 } },
  GAUGE_HALF: 0.38,
  ZOOM_MIN: 0.6, ZOOM_MAX: 4, VIEW_MIN_U: 14,
  ISO_EL: Math.atan(1 / Math.SQRT2), // 35.264 degrees
  CAM_LAG_S: 0.2,
  HOLD_MS: 220, TAP_MOVE_PX: 10,
  MAP_HALF: 60,
};
const DT_MIN = CFG.TICK_GAME_S / 60; // one tick in game minutes

// ==== Section: random numbers (seeded) ====
// sfc32. The state is four 32-bit integers kept inside the game state, so saves resume the same sequence.
function rngSeed(seed) {
  const st = [0x9e3779b9 | 0, 0x243f6a88 | 0, 0xb7e15162 | 0, seed | 0];
  for (let i = 0; i < 15; i++) rngNext(st);
  return st;
}
function rngNext(st) {
  let a = st[0], b = st[1], c = st[2], d = st[3];
  let t = (a + b) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11);
  d = (d + 1) | 0; t = (t + d) | 0; c = (c + t) | 0;
  st[0] = a; st[1] = b; st[2] = c; st[3] = d;
  return (t >>> 0) / 4294967296;
}

// ==== Section: track graph ====
// Nodes joined by straight or arc edges (section 6). A train position is {e, s, d}:
// edge id, distance from node A, and d = +1 facing towards B or -1 facing towards A.
function trackNew() { return { nodes: [], edges: [], switches: [] }; }
function trackNode(T, x, z) { const id = T.nodes.length; T.nodes.push({ id, x, z }); return id; }
function trackStraight(T, a, b, cls, lim) {
  const A = T.nodes[a], B = T.nodes[b], id = T.edges.length;
  T.edges.push({ id, a, b, k: 'S', len: Math.hypot(B.x - A.x, B.z - A.z), cls, lim });
  return id;
}
// Arc starting at node a with heading (hx,hz). turn = +1 or -1 picks the side; deg is the sweep.
// If endNode is given the arc must land on it (checked by the validator).
function trackArc(T, a, hx, hz, R, turn, deg, cls, lim, endNode) {
  const A = T.nodes[a];
  const cx = A.x + R * hz * turn, cz = A.z - R * hx * turn;
  const th0 = Math.atan2(A.z - cz, A.x - cx), sweep = -turn * deg * Math.PI / 180, th1 = th0 + sweep;
  const b = endNode !== undefined ? endNode : trackNode(T, cx + R * Math.cos(th1), cz + R * Math.sin(th1));
  const id = T.edges.length;
  T.edges.push({ id, a, b, k: 'A', cx, cz, R, th0, sweep, len: R * Math.abs(sweep), cls, lim });
  const sg = sweep > 0 ? 1 : -1;
  return { e: id, node: b, hx: -Math.sin(th1) * sg, hz: Math.cos(th1) * sg };
}
// Point and tangent (pointing from A towards B) at distance s along edge E.
function edgeAt(T, E, s) {
  if (E.k === 'S') {
    const A = T.nodes[E.a], B = T.nodes[E.b], f = E.len ? s / E.len : 0;
    return { x: A.x + (B.x - A.x) * f, z: A.z + (B.z - A.z) * f, tx: (B.x - A.x) / E.len, tz: (B.z - A.z) / E.len };
  }
  const th = E.th0 + E.sweep * s / E.len, sg = E.sweep > 0 ? 1 : -1;
  return { x: E.cx + E.R * Math.cos(th), z: E.cz + E.R * Math.sin(th), tx: -Math.sin(th) * sg, tz: Math.cos(th) * sg };
}
// Tangent pointing out of a node along the edge.
function outTangent(T, E, node) {
  if (node === E.a) { const p = edgeAt(T, E, 0); return { x: p.tx, z: p.tz }; }
  const p = edgeAt(T, E, E.len); return { x: -p.tx, z: -p.tz };
}
// A switch on node `node`: trunk edge, through (normal) leg and diverging (reverse) leg.
function trackSwitch(T, node, trunk, normal, reverse) {
  const id = T.switches.length, N = T.nodes[node];
  const h = outTangent(T, T.edges[normal], node);
  const rev = T.edges[reverse], far = rev.a === node ? T.nodes[rev.b] : T.nodes[rev.a];
  const px = -h.z, pz = h.x, side = Math.sign((far.x - N.x) * px + (far.z - N.z) * pz) || 1;
  // The stand sits beside the trunk end, on the side away from the diverging leg.
  const sx = N.x - h.x * 0.4 - px * side * 1.3, sz = N.z - h.z * 0.4 - pz * side * 1.3;
  T.switches.push({ id, node, trunk, normal, reverse, state: 'N', lockedBy: null,
    stand: { x: sx, z: sz, hx: h.x, hz: h.z, ux: sx - px * side * 0.65, uz: sz - pz * side * 0.65 } });
  return id;
}

// Derived lookups (not saved): edges per node, switch per node, blocks.
const trackIndexCache = new WeakMap();
function trackIndex(T) {
  let ix = trackIndexCache.get(T);
  if (ix) return ix;
  ix = { nodeEdges: T.nodes.map(() => []), nodeSw: {}, legSw: {}, block: [] };
  for (const E of T.edges) { ix.nodeEdges[E.a].push(E.id); ix.nodeEdges[E.b].push(E.id); }
  for (const W of T.switches) { ix.nodeSw[W.node] = W.id; ix.legSw[W.normal] = W.id; ix.legSw[W.reverse] = W.id; }
  // Blocks: every switch (its two legs) is a block; other runs of edges joined by plain nodes form one block each.
  let nb = 0;
  for (const W of T.switches) { ix.block[W.normal] = nb; ix.block[W.reverse] = nb; nb++; }
  for (const E of T.edges) {
    if (ix.block[E.id] !== undefined) continue;
    const stack = [E.id]; ix.block[E.id] = nb;
    while (stack.length) {
      const cur = T.edges[stack.pop()];
      for (const n of [cur.a, cur.b]) {
        if (ix.nodeSw[n] !== undefined || ix.nodeEdges[n].length !== 2) continue;
        for (const o of ix.nodeEdges[n]) if (ix.block[o] === undefined && ix.legSw[o] === undefined) { ix.block[o] = nb; stack.push(o); }
      }
    }
    nb++;
  }
  ix.blockCount = nb;
  trackIndexCache.set(T, ix);
  return ix;
}

// Which edge comes next when leaving edge `fromE` through node `node`, following the switches as set.
function nextEdge(T, node, fromE) {
  const ix = trackIndex(T), swId = ix.nodeSw[node];
  if (swId !== undefined) {
    const W = T.switches[swId];
    if (fromE === W.trunk) return { e: W.state === 'N' ? W.normal : W.reverse };
    const want = fromE === W.normal ? 'N' : 'R';
    if (W.state !== want) return { blocked: 'against', sw: swId };
    return { e: W.trunk };
  }
  for (const o of ix.nodeEdges[node]) if (o !== fromE) return { e: o };
  return { blocked: 'end' };
}
function reversePos(p) { return { e: p.e, s: p.s, d: -p.d }; }
// Move a position `dist` along the track in its facing direction.
// Returns the new position, how far it got, and why it stopped early (if it did).
function trackWalk(T, pos, dist, collect) {
  let e = pos.e, s = pos.s, d = pos.d, left = dist;
  for (let guard = 0; guard < 1000; guard++) {
    const E = T.edges[e], avail = d > 0 ? E.len - s : s;
    if (left <= avail + 1e-12) {
      const s2 = s + d * left;
      if (collect) collect.push([e, Math.min(s, s2), Math.max(s, s2)]);
      return { pos: { e, s: s2, d }, moved: dist, blocked: null };
    }
    if (collect) collect.push([e, d > 0 ? s : 0, d > 0 ? E.len : s]);
    left -= avail;
    const node = d > 0 ? E.b : E.a, nx = nextEdge(T, node, e);
    if (nx.blocked) return { pos: { e, s: d > 0 ? E.len : 0, d }, moved: dist - left, blocked: nx.blocked, sw: nx.sw };
    const E2 = T.edges[nx.e];
    e = nx.e; d = E2.a === node ? 1 : -1; s = d > 0 ? 0 : E2.len;
  }
  return { pos: { e, s, d }, moved: dist - left, blocked: 'end' };
}
// Look ahead from a position: distance to the first place the train must stop, and speed limits on the way.
function trackScan(T, pos, maxDist) {
  let e = pos.e, s = pos.s, d = pos.d, run = 0;
  const limits = [];
  for (let guard = 0; guard < 1000; guard++) {
    const E = T.edges[e], avail = d > 0 ? E.len - s : s;
    limits.push({ at: run, lim: E.lim });
    run += avail;
    if (run >= maxDist) return { stop: Infinity, reason: null, limits };
    const node = d > 0 ? E.b : E.a, nx = nextEdge(T, node, e);
    if (nx.blocked) return { stop: Math.max(0, run - CFG.STOP_GAP), reason: nx.blocked, sw: nx.sw, limits };
    // Entering a switch from the far end of one of its legs: if the switch is set for the other leg,
    // stop before the switch's block, so the train never stands on a switch it cannot pass.
    const ix = trackIndex(T), legSw = ix.legSw[nx.e];
    if (legSw !== undefined && T.switches[legSw].node !== node && e !== T.switches[legSw].trunk) {
      const W = T.switches[legSw];
      if ((W.state === 'N' ? W.normal : W.reverse) !== nx.e) return { stop: Math.max(0, run - CFG.STOP_GAP), reason: 'against', sw: legSw, limits };
    }
    const E2 = T.edges[nx.e];

    if (tr.mode === 'route' && tr.route.left < stop) { stop = tr.route.left; reason = 'target'; }
    vTarget = CFG.LOCO_MAX * (tr.m < 0 ? CFG.TENDER_FIRST : 1);
    // Speed limits on the track under the train and ahead of it.
    for (const [e] of trainSegs(T, tr)) vTarget = Math.min(vTarget, T.edges[e].lim);
    for (const l of sc.limits) vTarget = Math.min(vTarget, Math.sqrt(l.lim * l.lim + 2 * CFG.BRAKE * l.at));
    vTarget = Math.min(vTarget, Math.sqrt(2 * CFG.BRAKE * stop));
  }
  if (!driving) {
    // Ordinary braking ('stop', 'turn', 'idle'), but never faster than the curve that ends at the stopping point.
    tr.v = Math.max(0, tr.v - CFG.BRAKE * DT_MIN);
    if (tr.v > 0) tr.v = Math.min(tr.v, Math.sqrt(2 * CFG.BRAKE * stop));
  }
  else if (tr.v < vTarget) tr.v = Math.min(vTarget, tr.v + accel * DT_MIN);
  else tr.v = vTarget; // vTarget already follows the braking curve to the stopping point
  let ds = tr.v * DT_MIN;
  ds = Math.min(ds, stop);
  if (!driving && tr.v > 0 && stop - ds < 1e-3) tr.v = 0; // reached the stopping point while braking
  if (ds > 0) {
    if (tr.m > 0) tr.front = trackWalk(T, tr.front, ds).pos;
    else {
      const rear = trackWalk(T, leadPos(T, tr, -1), ds).pos;
      tr.front = trackWalk(T, reversePos(rear), L).pos;
    }
    if (tr.route) {
      tr.route.left = Math.max(0, tr.route.left - ds);
      const done = tr.route.total - tr.route.left;
      const occ = occupiedSwitches(S);
      for (const lk of tr.route.locks) {
        const W = T.switches[lk.sw];
        if (W.lockedBy === tr.id && done > lk.at + L + 1 && occ[lk.sw] === undefined) W.lockedBy = null;
      }
    }
  }
  // Status line for the panel.
  if (tr.mode === 'route' && tr.route && tr.route.left < 1e-3) {
    tr.v = 0; releaseRoute(S, tr); tr.mode = 'idle'; tr.status = 'Arrived';
    ev.push({ t: 'trainArrived', tr: tr.id });
  } else if (tr.mode === 'stop') {
    if (tr.v < 1e-3) { tr.v = 0; tr.mode = 'idle'; }
    tr.status = 'Stopped';
  } else if (tr.mode === 'turn') {
    // Braked to a stop: now go the other way.
    if (tr.v < 1e-3) { tr.v = 0; tr.m = -tr.m; tr.mode = 'run'; }
    tr.status = 'Stopping to change direction';
  } else if ((tr.mode === 'run' || tr.mode === 'route') && stop < 1e-3) {
    tr.v = 0;
    tr.status = reason === 'against' ? 'Waiting: the switch ahead is set against us' : reason === 'end' ? 'At the end of the track' : 'Waiting';
  } else if (tr.mode === 'run' || tr.mode === 'route') {
    const dir = tr.m > 0 ? 'forward' : 'back (tender first)';
    tr.status = (tr.mode === 'route' ? 'On its way, ' : 'Running ') + dir;
  } else if (tr.mode === 'idle' && tr.status !== 'Arrived') tr.status = 'Stopped';
}

// ---- The Overland (M1 package 2, builder B4): design-doc 9 "The interchange" ----
// Pure simulation. The Overland's train (S.trains entry with owner 'overland') arrives twice a day, at 06:00
// and 18:00 game time: at that tick it comes in from beyond the east map edge on the interchange track
// (section "test yard layout", ICH), pushing its cars ahead of the engine. It sets them out (uncouples them)
// at the dead end, and leaves off the map edge again. The cars it set out are one standing train with no
// engine (owner 'interchange'), which blocks walking like any train and holds items at CAR locations.
// Pick-up (one track serves inbound and outbound for now): when cars stand there, the Overland couples to
// them (1.0 game minute). If any standing car is empty, or holds only goods addressed Outside, it takes
// those cars: it pulls the whole string off the map, where its crew drops them (their Outside goods are
// logged as sold Outside), then pushes the rest back in and sets them out with its new cars.
// Everything is in S.overland and the two trains; a visit is driven by game ticks only, so it is the same
// every time and a save taken mid-visit resumes exactly. The player cannot drive either train.
// Room: set-out cars must end by s = ICH.FIT_S (x = 48). Cars that do not fit stay on the Overland and come
// back next visit; while it has cars like that aboard it brings no new delivery.
// Events: overlandArriving, overlandCoupled, overlandPickedUp, overlandSetOut, overlandLeft.
const OVERLAND = { FIRST_STOCK: 100, DUE: [6 * 3600, 18 * 3600], COUPLE_S: 60, UNCOUPLE_S: 30 };
const OVERLAND_LOCO = { k: 'loco', len: 5.2, mass: 3, power: 10, look: 'overland' };
const OVERLAND_CARS = { flatcar: { k: 'flatcar', len: 2.6, mass: 0.5 }, boxcar: { k: 'boxcar', len: 2.6, mass: 0.5 } };
// The fixed test delivery, until money and import orders exist (M1 round C). Each line is
// [commodity, destination town (CARGO_TOWNS id), consignee kind, consignee id, how many]. Track materials go to
// CONSTRUCTION (id 0, the hub's own track work); town goods to placeholder businesses (id 0 at the hub,
// id 1 at Willow Ford). Morning: 4 tie bundles, 2 rail bundles and a hardware crate (switch parts) on a
// flatcar, and 2 spike kegs with town goods in a boxcar. Evening: a boxcar of town goods and the mail.
const OVERLAND_DELIVERY = {
  morning: [
    { car: 'flatcar', items: [['ties', 0, 'CONSTRUCTION', 0, 4], ['rails', 0, 'CONSTRUCTION', 0, 2], ['hardware', 0, 'CONSTRUCTION', 0, 1]] },
    { car: 'boxcar', items: [['spikes', 0, 'CONSTRUCTION', 0, 2], ['flour', 1, 'BUSINESS', 1, 2], ['coffee', 1, 'BUSINESS', 1, 1],
      ['tinned', 0, 'BUSINESS', 0, 1], ['lampoil', 0, 'BUSINESS', 0, 1], ['clothing', 0, 'BUSINESS', 0, 1]] },
  ],
  evening: [
    { car: 'boxcar', items: [['flour', 0, 'BUSINESS', 0, 2], ['beans', 1, 'BUSINESS', 1, 1], ['salt', 1, 'BUSINESS', 1, 1],
      ['whiskey', 0, 'BUSINESS', 0, 1], ['mail', 1, 'BUSINESS', 1, 1]] },
  ],
};
function overlandNewState() { return { phase: 'away', wait: 0, visits: 0, nextStock: OVERLAND.FIRST_STOCK + 1, took: 0 }; }
// The Overland (away, off the map) and its set-out cars (none yet). ids follow the trains already there.
function overlandNewTrains(T, firstId) {
  const e = interchangeEdge(T), id = firstId === undefined ? 1 : firstId;
  return [
    { id, name: 'The Overland', owner: 'overland', away: true, front: { e, s: ICH.ENTER_S + 6, d: 1 }, v: 0, mode: 'idle', m: 1,
      route: null, status: 'Away', consist: [{ id: OVERLAND.FIRST_STOCK, ...OVERLAND_LOCO }] },
    { id: id + 1, name: 'Interchange cars', owner: 'interchange', front: { e, s: CFG.STOP_GAP, d: 1 }, v: 0, mode: 'idle', m: 1,
      route: null, status: 'Standing', consist: [] },
  ];
}
const overlandTrain = S => S.trains.find(t => t.owner === 'overland') || null;
const interchangeCut = S => S.trains.find(t => t.owner === 'interchange') || null;
function overlandNotYours(tr) {
  return tr.owner === 'overland' ? 'That is the Overland\'s train: its own crew drives it' : 'Those are the Overland\'s cars: tap one to load or unload it';
}
// Does the Overland take this standing car away? Empty, or only goods addressed Outside.
function overlandTakes(S, car) {
  return car.k !== 'loco' && itemsAt(S, { kind: 'CAR', stockId: car.id }).every(id => itemTag(S.items.waybill[id]) === 'OUTSIDE');
}
// Run the Overland along the interchange so its leading end (front for m = +1, rear for m = -1) stops at s.
function overlandGo(S, tr, m, s) {
  const lead = leadPos(S.track, tr, m), dist = Math.max(0, m > 0 ? s - lead.s : lead.s - s);
  tr.m = m; tr.mode = 'route'; tr.route = { total: dist, left: dist, locks: [] };
}
// Step 3 (dispatch) for the Overland: once per tick, before the trains move.
function overlandTick(S, ev) {
  const O = S.overland, tr = overlandTrain(S), cut = interchangeCut(S);
  if (!O || !tr || !cut || O.phase === 'off') return; // 'off': debug scenarios that test other things (never in play)
  const sod = (S.time + CFG.DAY_START_S) % 86400;
  if (O.phase === 'away') {
    if (!OVERLAND.DUE.includes(sod)) return;
    O.visits += 1;
    let cars = 0, items = 0;
    const held = tr.consist.length - 1;
    if (!held) for (const d of OVERLAND_DELIVERY[sod === OVERLAND.DUE[0] ? 'morning' : 'evening']) {
      const car = { id: O.nextStock++, ...OVERLAND_CARS[d.car] };
      tr.consist.push(car); cars++;
      for (const [commodity, town, kind, cid, n] of d.items) for (let i = 0; i < n; i++) {
        const wb = { commodity, originTownId: 'OUTSIDE', destTownId: town, consignee: { kind, id: cid }, contractId: null, due: null };
        if (itemCreate(S, wb, { kind: 'CAR', stockId: car.id }, ev).ok) items++;
      }
    }
    tr.away = false; tr.v = 0;
    tr.front = { e: interchangeEdge(S.track), s: ICH.ENTER_S + trainLength(tr), d: 1 };
    O.phase = 'in'; O.wait = 0;
    overlandGo(S, tr, -1, cut.consist.length ? cut.front.s + COUPLER_GAP : CFG.STOP_GAP);
    ev.push({ t: 'overlandArriving', cars, items, held });
    return;
  }
  if (O.wait > 0) { O.wait -= CFG.TICK_GAME_S; if (O.wait > 0) return; O.wait = 0; }
  if (tr.mode !== 'idle' || tr.v > 0) return; // still running in or out
  if (O.phase === 'in') {
    if (cut.consist.length) { O.phase = 'couple'; O.wait = OVERLAND.COUPLE_S; tr.status = 'Coupling up'; }
    else { O.phase = 'setout'; O.wait = OVERLAND.UNCOUPLE_S; tr.status = 'Setting out cars'; }
  } else if (O.phase === 'couple') {
    const n = cut.consist.length;
    tr.consist = tr.consist.concat(cut.consist); cut.consist = [];
    ev.push({ t: 'overlandCoupled', cars: n });
    if (tr.consist.some(c => overlandTakes(S, c))) { O.phase = 'out'; overlandGo(S, tr, 1, ICH.ENTER_S + 1 + trainLength(tr)); }
    else { O.phase = 'setout'; O.wait = OVERLAND.UNCOUPLE_S; tr.status = 'Setting out cars'; }
  } else if (O.phase === 'out') {
    // Off the map: the crew drops the cars it takes; their Outside goods are sold Outside (money: round C).
    const take = tr.consist.filter(c => overlandTakes(S, c)), gone = new Set(take.map(c => c.id));
    let sold = 0;
    for (const c of take) for (const id of itemsAt(S, { kind: 'CAR', stockId: c.id })) if (itemConsume(S, id, 'soldOutside', ev).ok) sold++;
    tr.consist = tr.consist.filter(c => !gone.has(c.id));
    O.took += take.length;
    ev.push({ t: 'overlandPickedUp', cars: take.length, stock: take.map(c => c.id), sold });
    if (tr.consist.length > 1) { O.phase = 'back'; overlandGo(S, tr, -1, CFG.STOP_GAP); }
    else { O.phase = 'leave'; tr.route = null; }
  } else if (O.phase === 'back') {
    O.phase = 'setout'; O.wait = OVERLAND.UNCOUPLE_S; tr.status = 'Setting out cars';
  } else if (O.phase === 'setout') {
    // Uncouple every car behind the engine that fits on the interchange; the rest stay aboard.
    const rearS = leadPos(S.track, tr, -1).s;
    let k = 1;
    while (k < tr.consist.length && rearS + trainLength({ consist: tr.consist.slice(k) }) > ICH.FIT_S + 1e-9) k++;
    const out = tr.consist.slice(k);
    if (out.length) {
      cut.consist = out; cut.front = { e: tr.front.e, s: rearS + trainLength(cut), d: 1 };
      cut.v = 0; cut.mode = 'idle'; cut.route = null; cut.status = 'Standing';
    }
    tr.consist = tr.consist.slice(0, k);
    ev.push({ t: 'overlandSetOut', cars: out.length, stock: out.map(c => c.id), held: k - 1 });
    O.phase = 'leave'; overlandGo(S, tr, 1, ICH.ENTER_S + 1 + trainLength(tr));
  } else if (O.phase === 'leave') {
    tr.away = true; tr.route = null; tr.status = 'Away'; tr.m = 1;
    O.phase = 'away';
    ev.push({ t: 'overlandLeft', held: tr.consist.length - 1 });
  }
}
// Saves from before the interchange (schema 4 and older): the interchange track is added to their track
// (old saves keep all their own track), with the Overland away and no cars set out yet.
function overlandMigrate(st) {
  if (!st.track || !Array.isArray(st.track.edges) || !Array.isArray(st.track.nodes)) return; // the shape check reports it
  if (interchangeEdge(st.track) < 0) interchangeAdd(st.track);
  if (Array.isArray(st.trains) && !st.trains.some(t => t && t.owner)) st.trains = st.trains.concat(overlandNewTrains(st.track, st.trains.length));
  st.overland = overlandNewState();
}
function overlandCheckSaveShape(st) {
  const O = st.overland, tr = st.trains.find(t => t.owner === 'overland'), cut = st.trains.find(t => t.owner === 'interchange');
  if (!O || typeof O.phase !== 'string' || !Number.isInteger(O.nextStock) || !Number.isFinite(O.wait)) throw new Error('damaged save: the Overland');
  if (!tr || !cut || !tr.consist.length || st.trains.some((t, i) => t.id !== i)) throw new Error('damaged save: the Overland\'s trains');
  if (!st.track.edges[tr.front.e] || !st.track.edges[tr.front.e].fixed) throw new Error('damaged save: the interchange track');
}

// ==== Section: cargo (items and waybills) ====
// Owner: M1 package 2 (builder W2). Freight items, their waybills and where each one is (design-doc 9, 19, 20, 21).
// Pure simulation: no three.js, no page elements. Whole numbers only in the state (positions in hundredths of a u).
//
// The item store lives in S.items (struct of arrays, indexed by item id; ids are never reused):
//   S.items.next        the next item id
//   S.items.waybill[id] { commodity, originTownId, destTownId, consignee: { kind, id }, contractId, due }
//                       plus, only on a part-used bundle or keg, pieces (see "construction jobs")
//   S.items.where[id]   an ItemLocation (below), or null once the item is consumed
//   S.items.alive[id]   true until the item is consumed
//   S.items.used        the consumption log, oldest first: { id, tick, reason, from } (from = where it was)
// Bay destination tags live in S.bayTags[buildingId] = [tag code per bay] (codes in CARGO_TAGS).
//
// ItemLocation, one of:
//   { kind: 'CAR', stockId }                        in a car (stockId = the car's id in a train's consist)
//   { kind: 'BAY', buildingId, bay }                in a freight shed bay (bay number from 0); 8 per bay
//   { kind: 'CARRIED', actorId, carrier, slot }     carried by an actor ('player' for the player);
//                                                   carrier 'HAND' (1, slot 0), 'HANDTRUCK' (3), 'HANDCART' (6)
//   { kind: 'GROUND', x, z }                        on the ground, x and z in hundredths of a u
//   { kind: 'STOCKPILE', jobId }                    at a construction job's stockpile
//   { kind: 'BUSINESS', businessId }                delivered to a business door or stock
//
// API (all take the game state S; ev is the tick's event list, or null for no events):
//   itemCreate(S, waybill, where, ev)  -> { ok: true, id } or { ok: false, why }   event 'itemCreated'
//   itemMove(S, id, where, ev)         -> { ok: true } or { ok: false, why }       event 'itemMoved' or 'itemRefused'
//                                         refuses impossible moves: full bay, long bundle on a hand truck,
//                                         a taken slot, a car that cannot take that item type, and so on.
//   itemCanMove(S, id, where)          -> null if the move is allowed, else the reason (changes nothing)
//   itemsAt(S, query)                  -> ascending ids of living items whose location matches every field
//                                         given in query, e.g. { kind: 'BAY', buildingId: 'freightshed' }
//                                         (all bays) or { kind: 'CARRIED', actorId: 'player' }
//   itemConsume(S, id, reason, ev)     -> { ok: true } or { ok: false, why }       event 'itemConsumed'
//                                         reason is one of CARGO_CONSUME_REASONS; the only way an item ends
//   itemCheckConservation(S)           -> list of problems (empty when all is well)
//   itemType(S, id), itemTag(waybill), bayTagMatches(S, buildingId, bay, id), setBayTag(S, b, bay, tag, ev)
// Commands: { t: 'setBayTag', b: 'freightshed', bay: 0..3, tag: 'WILLOW' | 'HUB' | 'HUBWH' | ... | 'ANY' }.

// Placeholder towns until the towns package builds real ones (provisional): the hub and Willow Ford.
const CARGO_TOWNS = [{ id: 0, name: 'Hub' }, { id: 1, name: 'Willow Ford' }];
// Destination tags: colour (Okabe-Ito, colourblind-safe), one letter and a shape, so no one cue is needed alone.
// Shapes: 0 circle, 1 square, 2 triangle, 3 diamond, 4 hexagon, 5 ring. 'ANY' is for bays only.
const CARGO_TAGS = {
  WILLOW: { name: 'Willow Ford', letter: 'W', col: '#009e73', shape: 0 },
  HUB: { name: 'Hub town', letter: 'T', col: '#e69f00', shape: 1 },
  HUBWH: { name: 'Hub warehouse', letter: 'H', col: '#cc79a7', shape: 4 },
  RAILHEAD: { name: 'Railhead', letter: 'R', col: '#d55e00', shape: 2 },
  OUTSIDE: { name: 'Outside', letter: 'O', col: '#0072b2', shape: 3 },
  ANY: { name: 'Any', letter: 'A', col: '#9a9a9a', shape: 5 },
};
const CARGO_CONSIGNEE_KINDS = ['BUSINESS', 'CAMP', 'WAREHOUSE', 'CONSTRUCTION', 'OUTSIDE'];
const CARGO_CONSUME_REASONS = ['business', 'household', 'construction', 'soldOutside', 'fuel'];
const CARGO_BAY_CAP = 8;
const CARGO_CARRY_CAP = { HAND: 1, HANDTRUCK: 3, HANDCART: 6 };
// Car capacity (section 7) in slot units. Flatcar: 12 long items or 8 crates, so a long bundle uses 2 of 24
// units and a crate (or pallet) 3. Machinery uses a flatcar's whole crate allowance less one (provisional: 9).
const CARGO_CAR_RULES = {
  boxcar: { cap: 16, cost: { crate: 1, sack: 1, keg: 1, barrel: 1, bale: 1, mailSack: 1, pallet: 1 } },
  combine: { cap: 8, cost: { crate: 1, sack: 1, keg: 1, barrel: 1, bale: 1, mailSack: 1 } },
  flatcar: { cap: 24, cost: { longBundle: 2, crate: 3, pallet: 3, machinery: 9 } },

const cargoName = t => ({ crate: 'crate', sack: 'sack', keg: 'keg', barrel: 'barrel', bale: 'bale', longBundle: 'long bundle',
  mailSack: 'mail sack', pallet: 'pallet', machinery: 'machinery', bulk: 'bulk load' })[t] || t;

function cargoNewStore() { return { next: 0, waybill: [], where: [], alive: [], used: [] }; }
// Every freight shed's bays start with these tags (section 9 examples), one per bay.
function cargoDefaultBayTags() {
  const out = {};
  for (const b of Object.keys(BLD_BAYS).sort()) out[b] = BLD_BAYS[b].bays.map((_, i) => ['WILLOW', 'HUBWH', 'OUTSIDE', 'ANY'][i] || 'ANY');
  return out;
}
const cargoInt = v => Number.isInteger(v);
const cargoId = v => (Number.isInteger(v) && v >= 0) || (typeof v === 'string' && v.length > 0 && v.length <= 40);
function itemType(S, id) { const w = S.items.waybill[id]; return w && COMMODITIES[w.commodity] ? COMMODITIES[w.commodity].type : null; }
// The destination tag an item's waybill calls for.
function itemTag(wb) {
  const k = wb.consignee && wb.consignee.kind;
  if (wb.destTownId === 'OUTSIDE' || k === 'OUTSIDE') return 'OUTSIDE';
  if (k === 'CONSTRUCTION' || k === 'CAMP') return 'RAILHEAD';

function bayTagMatches(S, b, bay, id) { const t = S.bayTags[b] && S.bayTags[b][bay]; return t === 'ANY' || t === itemTag(S.items.waybill[id]); }

  if (C.type === 'bulk') return C.name + ' is bulk, carried as tons, not as items';
  const town = v => v === 'OUTSIDE' || CARGO_TOWNS.some(t => t.id === v);
  if (!town(wb.originTownId)) return 'unknown origin';
  if (!town(wb.destTownId)) return 'unknown destination';
  if (!wb.consignee || !CARGO_CONSIGNEE_KINDS.includes(wb.consignee.kind) || !cargoId(wb.consignee.id)) return 'bad consignee';
  if (wb.contractId !== null && !cargoInt(wb.contractId)) return 'bad contract id';
  if (wb.due !== null && !cargoInt(wb.due)) return 'bad due time';
  // Optional (construction jobs): a part-used bundle or keg holds this many pieces, fewer than a full one.

// The car with this stock id, or null.
function cargoCar(S, stockId) {

// ==== Section: models (procedural, low-poly) ====
// Shapes follow the approved style test page. Each model is merged into one mesh with vertex colours,
// sharing one material, so a vehicle or a body part costs one draw call.
const PAL = { grass: '#8a9f55', dirt: '#7a5a3a', rail: '#55534f', tie: '#5b4128', wall: '#b9875a', trim: '#6e4426',
  roof: '#7d3424', loco: '#2e2d30', brass: '#c69a2c', red: '#9e3a26', glass: '#3b3a3a', win: '#ffcf73', trunk: '#5d4027',
  skin: '#d9a77e', shirt: '#e6dcc4', vest: '#3b302a', navy: '#25324a', trousers: '#4b4237', hair: '#4a3222', boot: '#2a2522',
  green: '#3f8a3a' };
const SEG = 7;
const KIT_MAT = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9, metalness: 0 });
class Kit {
  constructor() { this.p = []; this.c = []; }
  add(geo, hex, x, y, z, rx, ry, rz) {
    const g = geo.index ? geo.toNonIndexed() : geo;
    const m = new THREE.Matrix4().compose(new THREE.Vector3(x, y, z),
      new THREE.Quaternion().setFromEuler(new THREE.Euler(rx || 0, ry || 0, rz || 0)), new THREE.Vector3(1, 1, 1));
    const pos = g.attributes.position, col = new THREE.Color(hex), v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i).applyMatrix4(m); this.p.push(v.x, v.y, v.z); this.c.push(col.r, col.g, col.b); }
    if (g !== geo) g.dispose();
    geo.dispose();
    return this;
  }
  mesh(shadow) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, KIT_MAT);
    m.castShadow = shadow !== false; m.receiveShadow = true;
    return m;
  }
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, s) => new THREE.CylinderGeometry(rt, rb, h, s || SEG);
const ico = (r, d) => new THREE.IcosahedronGeometry(r, d === undefined ? 1 : d);

// --- Hand-building (D10, D12): the pieces of a construction job and the work tools. Drawn by "world rendering"
// (jobDraw). The tie matches the laid track's tie (0.22 x 0.08 x 1.2, PAL.tie); the rail piece is a unit length
// of the laid track's rail (0.08 wide, from 0.11 to RAIL_TOP), stretched along z per instance; the spike is a tiny
// iron head. All are vertex-coloured so their InstancedMeshes share KIT_MAT.
const JOB_LOOK = {
  STAKE_OFF: 0.8,      // stakes stand this far either side of the centre line, just outside the ties (0.6) and bed (0.75)
  STRING_Y: 0.14,      // the string runs this high between the stakes
  SIGN_OFF: 1.7,       // the sign stands this far to the work side of the job's start, 0.6u back along it
  SPIKE_COL: '#7d7b76',// fresh iron: lighter than PAL.rail so the heads read on a dark tie
  FLAG_COL: '#c4502e', // surveyor's flag on each stake
  STRING_COL: '#e4d6b6',
};

  };

// The fixed parts of every staked job, merged into ONE mesh (rebuilt only when a job is staked, done or
// cancelled): a dirt bed along the centre line (2 cm up, under the laid track's ballast height of 3 cm, so
// nothing lies on the same plane), a stake pair every 2.5u with a flag at the tip, string along both rail lines,
// and the job's sign board beside its start. hAt(x, z) gives the ground height.
function jobStaticKit(jobs, hAt) {
  const k = new Kit(), L = JOB_LOOK;
  for (const job of jobs) {
    const n = Math.max(2, Math.ceil(job.len / 0.4)), bed = [];
    const edge = (p, o) => { const x = p.x - p.tz * o, z = p.z + p.tx * o; return [x, hAt(x, z) + 0.02, z]; };
    for (let i = 0; i < n; i++) {            // the bed: one ribbon of quads along the job, like the laid ballast
      const p = jobPoint(job, job.len * i / n), q = jobPoint(job, job.len * (i + 1) / n);
      const a = edge(p, -0.75), b = edge(q, -0.75), c = edge(q, 0.75), d = edge(p, 0.75);
      bed.push(...a, ...c, ...b, ...a, ...d, ...c);
    }
    const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.Float32BufferAttribute(bed, 3));
    k.add(bg, PAL.dirt, 0, 0, 0);
    // Stakes at job.stakes (every 2.5u and the end), a pair across the line; string between neighbours.
    // Tangents at the stakes come from the job's own geometry: they lie on it every 2.5u, and the last at its end.
    const pts = job.stakes.map(([x, z], i) => ({ x: x / 100, z: z / 100, q: jobPoint(job, i === job.stakes.length - 1 ? job.len : i * JOB.STAKE) }));
    const side = (p, sd) => ({ x: p.x - p.q.tz * sd * L.STAKE_OFF, z: p.z + p.q.tx * sd * L.STAKE_OFF });
    for (const p of pts) for (const sd of [-1, 1]) {
      const a = side(p, sd), y = hAt(a.x, a.z), yaw = Math.atan2(p.q.tx, p.q.tz);
      k.add(box(0.05, 0.34, 0.05), PAL.trim, a.x, y + 0.17, a.z, 0, yaw, 0);
      k.add(box(0.012, 0.07, 0.12), L.FLAG_COL, a.x + p.q.tx * 0.07, y + 0.3, a.z + p.q.tz * 0.07, 0, yaw, 0);
    }
    for (let i = 0; i + 1 < pts.length; i++) for (const sd of [-1, 1]) {
      const a = side(pts[i], sd), b = side(pts[i + 1], sd), len = Math.hypot(b.x - a.x, b.z - a.z);
      const y = (hAt(a.x, a.z) + hAt(b.x, b.z)) / 2 + L.STRING_Y;
      k.add(box(0.03, 0.03, len), L.STRING_COL, (a.x + b.x) / 2, y, (a.z + b.z) / 2, 0, Math.atan2(b.x - a.x, b.z - a.z), 0);
    }
    // The sign: a board on two posts, its face towards the work side, with dark lines standing for lettering.
    const sp = jobSignSpot(job), y = hAt(sp.x, sp.z), yaw = Math.atan2(sp.tx, sp.tz) + Math.PI / 2;
    const ax = Math.sin(yaw + Math.PI / 2), az = Math.cos(yaw + Math.PI / 2); // along the board
    for (const s of [-1, 1]) k.add(box(0.06, 0.62, 0.06), PAL.trim, sp.x + ax * s * 0.26, y + 0.31, sp.z + az * s * 0.26, 0, yaw, 0);
    k.add(box(0.7, 0.36, 0.04), PAL.wall, sp.x, y + 0.5, sp.z, 0, yaw, 0);
    const fx = -Math.sin(yaw) * job.side, fz = -Math.cos(yaw) * job.side; // the face looks to the work side
    for (const [dy, w] of [[0.08, 0.5], [0, 0.42], [-0.08, 0.46]]) k.add(box(w, 0.035, 0.01), PAL.vest, sp.x + fx * 0.024, y + 0.5 + dy, sp.z + fz * 0.024, 0, yaw, 0);
  }
  const m = k.mesh(true); m.name = 'jobStatic';

// ==== Section: terrain ====
// Owner: piece 3a. The ground, and terrainHeight(x, z) for everything that stands on it.
// A 64 x 64 tile test heightmap (tile 2u, so 128u square, centred on the yard) with gentle low-poly
// hills from seeded value noise. The ground is held flat at height 0 near every track edge and over
// the yard and station area, and blends into the hills further out. Track beds stay at height 0 in M0.
// The mesh is 2 x 2 chunks of 32 x 32 tiles with vertex colours and the shared kit material, so it
// costs at most 4 draw calls. terrainHeight() uses the same two triangles per tile as the mesh.

const TERRAIN = {

// Smooth value noise in [0, 1]: random values on a lattice every `cell` tiles, cosine blended.
function terrainNoise(st, n, cell) {

const smooth01 = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  const dist = new Float32Array(V * V).fill(1e9), reach = Math.ceil(C.BLEND_R / C.TILE) + 1;
  for (const E of (T ? T.edges : [])) {

    const dYard = Math.hypot(Math.max(Y.x0 - x, 0, x - Y.x1), Math.max(Y.z0 - z, 0, z - Y.z1));
    const d = Math.min(dist[j * V + i], dYard);

}

function terrainFlatAt(T, x, z) {

}

function terrainHeight(x, z) {

  const grass = new THREE.Color(PAL.grass), dirt = new THREE.Color(PAL.dirt), tile = new THREE.Color(), tmp = new THREE.Color();
  const colRng = rngSeed(CFG.SEED ^ 0x51c3);

      const x0 = i * C.TILE - C.HALF, z0 = j * C.TILE - C.HALF, x1 = x0 + C.TILE, z1 = z0 + C.TILE;
      const a = h[j * V + i], b = h[j * V + i + 1], c = h[(j + 1) * V + i], d = h[(j + 1) * V + i + 1];

    const xs = [X0 <= -C.HALF ? X0 - C.SKIRT : X0, X0, X1, X1 >= C.HALF ? X1 + C.SKIRT : X1];
    const zs = [Z0 <= -C.HALF ? Z0 - C.SKIRT : Z0, Z0, Z1, Z1 >= C.HALF ? Z1 + C.SKIRT : Z1];
    for (let b = 0; b < 3; b++) for (let a = 0; a < 3; a++) {
      if ((a === 1 && b === 1) || xs[a] === xs[a + 1] || zs[b] === zs[b + 1]) continue;
      tri(xs[a], 0, zs[b], xs[a], 0, zs[b + 1], xs[a + 1], 0, zs[b], grass);
      tri(xs[a + 1], 0, zs[b], xs[a], 0, zs[b + 1], xs[a + 1], 0, zs[b + 1], grass);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals(); g.computeBoundingSphere();

    G.add(m); C.meshes.push(m);

}

// ==== Section: day and night ====
// Owner: piece 3a. Called every frame with the game state; sets sun, sky, hemisphere light,
// and the glow of GLOW_MAT (lit windows and lamps) from the game clock.
// Keyframes are design-doc section 17: background, sun colour and sun elevation as written there.
// The intensities used (sunI, skyI) differ from the doc's (si, hi, kept for reference): noon keeps the
// approved piece 1 brightness (sun 0.8, hemisphere 0.5), and dawn, dusk and night are lifted so the
// scene stays readable on a phone (the doc's values were for a brighter renderer). Sunrise and sunset follow the season (section 4): summer 05:00 to 21:00,
// winter 07:00 to 17:00, spring and autumn 06:00 to 19:00. Dawn light is at sunrise and dusk light
// at sunset; noon light holds from 3 hours after sunrise to 3 hours before sunset; full night
// starts 1.5 hours after sunset and lasts until 1.5 hours before sunrise.
const GLOW_MAT = new THREE.MeshStandardMaterial({ color: PAL.win, emissive: PAL.win, emissiveIntensity: 0, flatShading: true, roughness: 0.9, metalness: 0 });
const DAY = {
  GLOW_MAX: 1.2,
  RISE: [6, 5, 6, 7], SET: [19, 21, 19, 17],          // by season: spring, summer, autumn, winter
  NOON_AZ: Math.atan2(10, 28), SWEEP: 75 * Math.PI / 180, MOON_AZ: -30 * Math.PI / 180,
  KEYS: {
    night: { bg: '#121828', sun: '#7f95d8', si: 0.22, hi: 0.20, el: 45, sunI: 0.35, skyI: 0.5, sky: '#8f9fd6', gnd: '#3a3a4a' },
    dawn:  { bg: '#e9b48e', sun: '#ffb27a', si: 0.75, hi: 0.45, el: 12, sunI: 0.95, skyI: 0.65, sky: '#f4d6c2', gnd: '#7a6450' },
    noon:  { bg: '#b9d3d8', sun: '#fff4e0', si: 1.15, hi: 0.65, el: 60, sunI: 0.8, skyI: 0.5, sky: '#e8f0ff', gnd: '#7a6a50' },
    dusk:  { bg: '#d98a62', sun: '#ff8a52', si: 0.70, hi: 0.40, el: 14, sunI: 0.9, skyI: 0.62, sky: '#f0c4a6', gnd: '#6e5444' },
  },

  const season = Math.floor(day / 14) % 4, R = DAY.RISE[season], Z = DAY.SET[season];

  }

// Owner: piece 4. Extra characters (all three kits), instanced per body part. Render-side only in M0:

// A part builder like Kit, but each shape also records its colour slot and shape group.

const CROWD_VERT_HEAD = `
attribute vec2 rh;
attribute vec4 iA;
attribute vec3 iB;
vec3 rhRGB(float v) { float r = floor(v / 65536.0); float g = floor((v - r * 65536.0) / 256.0); return vec3(r, g, v - r * 65536.0 - g * 256.0) / 255.0; }

    .replace('#include <common>', '#include <common>' + CROWD_VERT_HEAD)
    .replace('#include <begin_vertex>', CROWD_BEGIN)
    .replace('#include <color_vertex>', `vColor = color;
  if (rh.x > 0.5) vColor = rhRGB(rh.x < 1.5 ? iA.x : rh.x < 2.5 ? iA.y : rh.x < 3.5 ? iA.z : rh.x < 4.5 ? iA.w : rh.x < 5.5 ? iB.x : iB.y);`);

// ---- Seeded descriptions ----
function crowdHex(hex, rng, dh, dl) {
  const c = new THREE.Color(hex), hsl = {};
  c.getHSL(hsl);
  c.setHSL((hsl.h + (rngNext(rng) - 0.5) * 2 * dh + 1) % 1, hsl.s, Math.max(0, Math.min(1, hsl.l + (rngNext(rng) - 0.5) * 2 * dl)));
  return (Math.round(c.r * 255) << 16) | (Math.round(c.g * 255) << 8) | Math.round(c.b * 255);
}
function crowdPick(rng, arr) { return arr[Math.floor(rngNext(rng) * arr.length) % arr.length]; }

// visor cap railroad staff, kepi conductor, slouch laborer, bowler merchant or banker, bonnet women, none children.
function crowdDescribe(i) {
  const rng = rngSeed(CROWD.SEED + i * 7919), G = CG, bit = g => 1 << (g - 1);
  const r = rngNext(rng);

  const child = kit === 'chunky' && rngNext(rng) < 0.22;          // about 10% of everyone
  const woman = kit !== 'stocky' && rngNext(rng) < (child ? 0.5 : 0.45);
  const v = hex => crowdHex(hex, rng, 4 / 360, 0.06);              // per-person shift: hue 4 degrees, lightness 6%
  const num = hex => parseInt(hex.slice(1), 16);
  let mask = 0, role, top, low, hat = 0, acc = 0;

  const moved = Math.hypot(px - pl.position.x, pz - pl.position.z);
  pl.position.set(px, 0, pz);
  pl.rotation.y = lerpAngle(pl.rotation.y, P.f, 1 - Math.exp(-dt * 12));
  u.phase += moved * 0.6 * Math.PI * 2;
  const walking = moved > 1e-4;
  u.swing = lerp(u.swing || 0, walking ? 1 : 0, 1 - Math.exp(-dt * 10));
  const sw = Math.sin(u.phase) * u.swing;
  u.legL.rotation.x = sw * 25 * Math.PI / 180; u.legR.rotation.x = -sw * 25 * Math.PI / 180;
  u.armL.rotation.x = -sw * 20 * Math.PI / 180; u.armR.rotation.x = sw * 20 * Math.PI / 180;
  if (P.act && P.act.k === 'throw') { u.armR.rotation.x = -1.2 + Math.sin(animT * 4) * 0.25; u.armL.rotation.x = -1.0; }
  carryDraw(alpha, dt);
  jobDraw(S, alpha);      // construction jobs and the work poses (hand-building, after the carry poses)
  u.body.position.y = Math.abs(Math.sin(u.phase)) * 0.02 * u.swing;
  pl.scale.y = 1 + Math.sin(animT * 0.35 * Math.PI * 2) * 0.015 * (1 - u.swing);
  // The tap marker shows until the walk it started ends.
  if (view.ringArmed && P.mode === 'to') view.ringArmed = false;
  if (!view.ringArmed && (P.mode !== 'to' || P.use)) view.ring.visible = false;
  // Switch discs.
  S.track.switches.forEach((W, i) => { view.discs[i].material = view.discMat[W.state]; });
  // Camera: follow the player with a soft lag, ease the 90-degree turns.
  const k = 1 - Math.exp(-dt / CFG.CAM_LAG_S);
  cam.fx += (px - cam.fx) * k; cam.fz += (pz - cam.fz) * k;
  cam.yaw += (camYawTarget() - cam.yaw) * (1 - Math.exp(-dt * 10));
  placeCamera();
  cargoDraw(S);           // item props and tags (section "cargo")
  applyDaylight(S, dt);
  updateCrowd(dt);
  paxDraw(alpha, dt);     // travellers, in the crowd's meshes (section "people (crowd)")
  debugUpdate(dt);
  renderer.info.reset(); // once per frame: drawCalls then counts the shadow pass and the main pass
  renderer.render(scene, camera);
}

// ==== Section: main loop ====
function frame(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.25); lastFrame = now;
  updateHoldWalk();
  if (speed > 0) {
    acc += dt * speed * CFG.TICKS_PER_REAL_S;
    let n = Math.floor(acc); acc -= n;
    if (DBG.on && speed > 4) debugRunTicks(n); // debug time warp (8x to 32x), time-boxed
    else { n = Math.min(n, 40); for (let i = 0; i < n; i++) doTick(); }
  }
  render(speed > 0 ? acc : 1, dt);
  updateHud();
  window.__railhead.drawCalls = renderer.info.render.calls;
  requestAnimationFrame(frame);
}
function saveJson() { return JSON.stringify({ state: S, ui: { yawIdx: cam.yawIdx, zoom: cam.zoom, speed: lastSpeed } }); }
// Saves run one after another; if several are asked for while one is writing, only the newest is written next.
// The returned promise resolves (true or false) once the newest state asked for is written.
// savingOff is set by the debug tools' test scenarios, so a scenario never overwrites the player's save.
let savingOff = false;
let saveBusy = null, saveNext = null, saveTimer = 0;
function saveGame() {
  if (savingOff) return Promise.resolve(false);
  saveNext = saveJson();
  if (!saveBusy) saveBusy = (async () => {
    let ok = true;
    while (saveNext !== null) {
      const json = saveNext; saveNext = null;
      try { await saveWrite(json); ok = true; } catch (e) { console.warn('Save failed:', e && e.message); ok = false; }
    }
    saveBusy = null;
    return ok;
  })();
  return saveBusy;
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveGame, 2000); }
// Written at once (no gzip, no IndexedDB), so it is complete even if the page closes straight after.
function quickSave() { if (savingOff) return; try { localStorage.setItem(QUICK_KEY, saveJson()); } catch (e) { console.warn('Quick save failed:', e && e.message); } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { quickSave(); saveGame(); } });
window.addEventListener('pagehide', () => { quickSave(); saveGame(); });

// ==== Section: test hooks ====
// Read by the check scripts in tests/. Also handy in the browser console.
window.__railhead = {
  ready: false, drawCalls: 0, threeRevision: THREE.REVISION,
  get state() { return S; },
  hash: st => stateHash(st || S),
  send, setSpeed, saveGame,
  step(n) { for (let i = 0; i < n; i++) doTick(); },
  newState, simRun, simTick, stateHash, trackValidate, trackNew, trackNode, trackStraight, trackArc, trackSwitch, trackNearest, trackWalk, edgeAt, findRoute, trainPoses, trainLength,
  switchLockReason, occupiedSwitches, migrate,
  cargo: { COMMODITIES, CARGO_TAGS, CARGO_TOWNS, BLD_BAYS, itemCreate, itemMove, itemCanMove, itemsAt, itemConsume, itemCheckConservation, itemType, itemTag, bayTagMatches, cargoDebugItems,
    redraw() { cargoView.dirty = true; }, get view() { return cargoView; } },
  carry: { TOOL_KINDS, TOOL_PARK, carryNoCartRects, carryHeld, carryCarrier, carryNoCartAt },
  interchange: { ICH, OVERLAND, OVERLAND_DELIVERY, interchangeEdge, overlandTrain, interchangeCut, overlandTakes, carryCarDoor, carryCarWhy,
    carPanel: carUi, cargoFlatPoses: st => cargoFlatPoses(st || S) },
  get jobsView() { return jobView; },   // drawing hand-building (B2): job meshes, instance counts, the work in hand
  jobSignText: job => jobSignText(S, job), jobSignSpot, jobGeom,
  trackTieCount: () => view.staticGroup.children.reduce((n, o) => n + (o.isInstancedMesh && o.geometry.parameters && o.geometry.parameters.depth === 1.2 ? o.count : 0), 0),
  pax: { PAX, paxStations: T => paxStations(T || S.track), paxStation: (id, T) => paxStation(T || S.track, id), paxQueueSlots, paxFare, paxCarsAt, stationDepartures, paxDebugScenario, paxNewStore, paxLook,
    get view() { return paxView; }, get kits() { return crowd.kits; } },
  jobs: { JOB, JOB_MAT, jobGet, jobNeeds, jobPoint, jobTieAt, jobStepAt, jobPieceTotals, jobDebugScenario, jobNewStore },
  toScreen: (x, z, y) => toScreen(x, y || 0, z),
  exportSave: () => JSON.stringify({ state: S, ui: { yawIdx: cam.yawIdx, zoom: cam.zoom, speed: lastSpeed } }),
  importSave(json) { const sv = migrate(JSON.parse(json)); S = sv.state; buildWorld(S); buildActors(S); resetViewsFromState(); return stateHash(S); },
  camera: cam,
};

// ==== Section: start ====
// Both saves are read (IndexedDB and the quick save in localStorage); the one with the higher tick wins.
// A save that is damaged, or that fails while the world is built from it, is kept under 'broken-<time>'
// and the next one is tried; if none works the game starts fresh. Only warnings go to the console.
(async () => {
  const found = [];
  try {
    const raw = await saveReadRaw();
    if (raw) {
      try { found.push({ sv: migrate(JSON.parse(raw.json)), keep: () => saveKeepBroken(raw.rec) }); }
      catch (e) { console.warn('The saved game is damaged and was kept as broken-<time>; starting without it:', e && e.message); await saveKeepBroken(raw.rec).catch(() => {}); }
    }
  } catch (e) { console.warn('Could not read the saved game:', e && e.message); }
  const quick = quickRead();
  if (quick) {
    try { found.push({ sv: migrate(JSON.parse(quick)), keep: async () => quickKeepBroken(quick) }); }
    catch (e) { console.warn('The quick save is damaged and was kept as railhead-broken-<time>:', e && e.message); quickKeepBroken(quick); }
  }
  found.sort((a, b) => b.sv.state.tick - a.sv.state.tick);
  let loaded = null;
  for (const f of found) {
    try {
      S = f.sv.state;
      simTick(JSON.parse(JSON.stringify(S)), []); // a trial tick on a copy: throws now rather than in the game loop
      buildWorld(S); buildActors(S); resetViewsFromState();
      loaded = f; break;
    } catch (e) {
      console.warn('Could not build the game from a save; it was kept as broken-<time>:', e && e.message);
      await Promise.resolve(f.keep()).catch(() => {});
    }
  }
  if (loaded) {
    const u = loaded.sv.ui;
    if (u) { cam.yawIdx = u.yawIdx || 0; cam.yaw = camYawTarget(); cam.zoom = u.zoom || 1; lastSpeed = u.speed || 1; }
  } else {
    S = newState(CFG.SEED);
    buildWorld(S); buildActors(S); resetViewsFromState();
  }
  buildCrowd(); buildToolInit(); debugInit();
  setSpeed(new URLSearchParams(location.search).has('paused') ? 0 : lastSpeed); // ?paused is used by the checks
  resize();
  window.__railhead.ready = true;
  requestAnimationFrame(frame);
})();
</script>
</body>
